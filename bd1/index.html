<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>棕色塵埃 1 收藏管理</title>
<style>
  :root{--bg:#f3f4f8;--card:#fff;--text:#1d2130;--sub:#6b7085;--line:#e3e5ee;--accent:#4a5cff;--ok:#1f9d55;--gold:#d4a017}
  @media (prefers-color-scheme: dark){:root{--bg:#14161d;--card:#1f2230;--text:#eceef5;--sub:#9aa0b5;--line:#2e3244;--accent:#8c98ff;--ok:#3ccf7a}}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);font-family:"Segoe UI","Noto Sans TC","Microsoft JhengHei",sans-serif}
  header{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
  .wrap{max-width:1300px;margin:0 auto;padding:10px 14px}
  .top{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .top h1{margin:0;font-size:20px}
  .top a.back{color:var(--sub);text-decoration:none;font-size:14px}
  .top .sp{flex:1}
  button,select,input{font:inherit;color:var(--text)}
  .btn{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:6px 10px;cursor:pointer;font-size:13px}
  .btn:hover{border-color:var(--accent)}
  .tabs{display:flex;gap:6px;margin-top:10px}
  .tab{padding:7px 16px;border-radius:8px 8px 0 0;border:1px solid var(--line);border-bottom:none;background:var(--card);cursor:pointer;font-weight:600;color:var(--sub)}
  .tab.on{background:var(--accent);border-color:var(--accent);color:#fff}
  .filters{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:8px}
  .filters input[type=search]{flex:1;min-width:180px;padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:var(--card)}
  .filters select{padding:6px 8px;border:1px solid var(--line);border-radius:8px;background:var(--card)}
  .chips{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}
  .chip{padding:3px 9px;border:1px solid var(--line);border-radius:999px;background:var(--card);cursor:pointer;font-size:12px;user-select:none}
  .chip.on{background:var(--accent);border-color:var(--accent);color:#fff}
  .stats{margin-top:8px;font-size:13px;color:var(--sub);display:flex;flex-wrap:wrap;gap:4px 14px}
  .stats b{color:var(--text)}
  main{max-width:1300px;margin:0 auto;padding:14px;display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:10px}
  .item{position:relative;background:var(--card);border:2px solid var(--line);border-radius:10px;overflow:hidden;cursor:pointer;display:flex;flex-direction:column;user-select:none}
  .item .img{position:relative;aspect-ratio:1/1;background:#0002}
  .item img{width:100%;height:100%;object-fit:cover;display:block;filter:grayscale(1);opacity:.45;transition:.15s}
  .item.own{border-color:var(--ok)}
  .item.own img{filter:none;opacity:1}
  .item .no{position:absolute;left:4px;top:4px;background:#000a;color:#fff;font-size:11px;padding:1px 5px;border-radius:5px}
  .item .rar{position:absolute;right:4px;top:4px;background:#000a;color:var(--gold);font-size:11px;padding:1px 5px;border-radius:5px}
  .item .chk{position:absolute;right:4px;bottom:4px;width:24px;height:24px;border-radius:50%;background:#fffc;border:2px solid #888;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:700;color:transparent}
  .item.own .chk{background:var(--ok);border-color:#fff;color:#fff}
  .item .nm{font-size:12px;line-height:1.3;padding:4px 5px 2px;height:36px;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
  .item .cls{font-size:11px;color:var(--sub);padding:0 5px}
  .np{display:flex;gap:2px;padding:4px 4px 5px;visibility:hidden}
  .item.own .np{visibility:visible}
  .np span{flex:1;text-align:center;font-size:11px;border:1px solid var(--line);border-radius:4px;padding:2px 0;color:var(--sub)}
  .np span.on{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:700}
  .np span.mlb{flex:1}
  .item.np5 .np span.on{background:var(--gold);border-color:var(--gold)}
  main[hidden],#teamOut[hidden]{display:none}
  .filters label{font-size:13px;color:var(--sub);display:flex;align-items:center;gap:5px}
  #teamOut{max-width:1300px;margin:0 auto;padding:14px;display:grid;grid-template-columns:repeat(auto-fill,minmax(400px,1fr));gap:12px}
  .tm-card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
  .tm-head{font-size:13px;display:flex;gap:8px;align-items:center;margin-bottom:8px}
  .tm-b{font-size:12px;padding:2px 8px;border-radius:6px;color:#fff;font-weight:600}
  .tm-b.ok{background:var(--ok)}.tm-b.mid{background:#d08a00}.tm-b.ng{background:#c33}
  .tm-mems{display:flex;gap:8px}
  .tm-mem{width:84px;cursor:pointer;text-align:center}
  .tm-mem img{width:72px;height:72px;border-radius:8px;display:block;margin:0 auto}
  .tm-tag{display:inline-block;font-size:11px;padding:0 6px;border-radius:4px;margin-top:3px;color:#fff;background:#888}
  .tm-tag.t-dps{background:#c33}.tm-tag.t-own{background:var(--accent)}.tm-tag.t-friend{background:#d08a00}
  .tm-nm{font-size:11px;line-height:1.25;margin-top:2px;max-height:2.5em;overflow:hidden}
  table.tm-w{width:100%;border-collapse:collapse;font-size:12px;margin-top:8px}
  table.tm-w th,table.tm-w td{border-top:1px solid var(--line);padding:3px 4px;text-align:left;white-space:nowrap}
  table.tm-w th{color:var(--sub);font-weight:400}
  table.tm-w td.tm-plan{white-space:normal;color:var(--sub)}
  .tm-ok{color:var(--ok);font-weight:700}.tm-ng{color:#c33;font-weight:700}
  @media (max-width:600px){#teamOut{grid-template-columns:1fr;padding:8px}}
  .msg{grid-column:1/-1;text-align:center;color:var(--sub);padding:40px 0}
  footer{text-align:center;color:var(--sub);font-size:12px;padding:0 16px 30px}
  footer a{color:var(--sub)}
  .item .chk{width:30px;height:30px;right:3px;bottom:3px;font-size:17px}
  .item .chk:hover{border-color:var(--ok)}
  /* detail modal */
  #dlg{position:fixed;inset:0;z-index:20;background:#000a;display:none;align-items:flex-start;justify-content:center;overflow-y:auto;padding:24px 10px}
  #dlg.on{display:flex}
  body.lock{overflow:hidden}
  .dbox{position:relative;background:var(--card);border-radius:14px;max-width:880px;width:100%;padding:18px 20px 22px;box-shadow:0 20px 50px #0008}
  .dclose{position:absolute;right:10px;top:8px;border:none;background:none;font-size:28px;cursor:pointer;color:var(--sub);line-height:1}
  .dhead{display:flex;gap:14px;align-items:center;padding-right:30px}
  .dhead img{width:72px;height:72px;border-radius:8px}
  .dhead h2{margin:0;font-size:20px}
  .dhead .ruby{color:var(--sub);font-size:12px}
  .dhead .meta{color:var(--sub);font-size:13px;margin-top:2px}
  .down{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:12px 0 4px;padding:8px 10px;border:1px solid var(--line);border-radius:10px}
  .down .np{visibility:visible;padding:0;gap:4px}
  .down .np span{cursor:pointer;padding:4px 10px;font-size:13px}
  .dcols{display:grid;grid-template-columns:minmax(0,300px) minmax(0,1fr);gap:18px;margin-top:12px}
  .dart img{width:100%;border-radius:8px;display:block;background:#0002;min-height:200px}
  .dart .asc{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
  .dart .asc span{font-size:12px;padding:2px 8px;border:1px solid var(--line);border-radius:6px;cursor:pointer}
  .dart .asc span.on{background:var(--accent);border-color:var(--accent);color:#fff}
  .dbox h3{font-size:15px;margin:16px 0 6px;padding-bottom:4px;border-bottom:1px solid var(--line)}
  .dcols h3:first-child{margin-top:0}
  table.kv{border-collapse:collapse;font-size:13px;width:100%}
  table.kv th,table.kv td{border:1px solid var(--line);padding:4px 6px;text-align:left;vertical-align:top}
  table.kv th{background:#8881;white-space:nowrap;font-weight:600;width:1%}
  .sk{display:flex;gap:10px;padding:8px 0;border-bottom:1px dashed var(--line)}
  .sk:last-child{border-bottom:none}
  .sk img{width:40px;height:40px;flex:none}
  .sk .t{font-weight:600;font-size:14px}
  .sk .t small{font-weight:400;color:var(--sub);margin-left:6px}
  .sk .d{font-size:13px;margin-top:3px;white-space:pre-wrap}
  .vals{font-size:12px;color:var(--sub);margin-top:4px;overflow-x:auto}
  .vals table{border-collapse:collapse}
  .vals td{border:1px solid var(--line);padding:1px 5px;white-space:nowrap}
  .vals td:first-child{color:var(--text)}
  .tag{display:inline-block;font-size:11px;padding:0 6px;border-radius:4px;background:var(--accent);color:#fff;margin-left:6px;vertical-align:middle}
  .card-q{color:#2a7de1;font-weight:700}.card-a{color:#1f9d55;font-weight:700}.card-b{color:#d33;font-weight:700}
  .prof{font-size:13px;white-space:pre-wrap;line-height:1.6;padding:8px 0;border-bottom:1px dashed var(--line)}
  .prof .cond{display:block;color:var(--sub);font-size:12px}
  details.older{margin:2px 0 6px 50px;font-size:13px}
  details.older summary{cursor:pointer;color:var(--sub);font-size:12px}
  details.older .sk{opacity:.8}
  .dlink{color:var(--accent);cursor:pointer;text-decoration:underline}
  .dfoot{margin-top:14px;font-size:12px;color:var(--sub)}
  .dfoot a{color:var(--sub)}
  @media (max-width:700px){.dcols{grid-template-columns:1fr}.dart{max-width:320px;margin:0 auto}#dlg{padding:0}.dbox{border-radius:0;min-height:100%}}
  @media (max-width:600px){header{position:static}main{grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:7px}.item .nm{font-size:11px}}
</style>
<style>
  .item .img{aspect-ratio:1/1;background:#2a2620}
  .item .img img.cls-ic{position:absolute;left:3px;bottom:3px;width:20px;height:20px;object-fit:contain;filter:none;opacity:1}
  .item .rar{color:#f7c948}
  .item .rar.t0{color:#ff7ad9}.item .rar.t1{color:#7ad7ff}.item .rar.t2{color:#ffb347}
  .np select{flex:none;font-size:11px;padding:0 2px;border:1px solid var(--line);border-radius:4px;background:var(--card)}
  .ct{display:inline-block;font-size:10px;font-weight:700;border-radius:4px;padding:0 4px;line-height:15px;color:#fff}
  .ct-CT_ATTACK{background:#d04a3a}.ct-CT_DEFENSE{background:#3a7ad0}.ct-CT_MAGIC{background:#8a4ad0}.ct-CT_SUPPORT{background:#2fa070}.ct-CT_RECOVERY{background:#888}
  .bf{display:flex;gap:8px;padding:6px 0;border-top:1px dashed var(--line)}
  .bf img{width:36px;height:36px;flex:none}
  .bf .t{font-weight:600;font-size:13px}
  .bf .t.db{color:#d33}.bf .t.bfz{color:#2a7de1}
  .bf .m{font-size:11.5px;color:var(--sub);margin-left:6px;font-weight:400}
  .bf .x{font-size:13px;white-space:pre-wrap;margin-top:2px}
  .bf .ex{font-size:12px;color:var(--sub);white-space:pre-wrap;margin-top:2px}
  .skhead{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:6px 0}
  .skhead img{height:56px;background:#2a2620;border-radius:6px}
  .grid9{display:grid;grid-template-columns:repeat(3,96px);gap:6px;margin-top:8px}
  .grid9 .cell{height:118px;border:1px dashed var(--line);border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:11px;color:var(--sub);text-align:center}
  .grid9 .cell .tm-mem{width:90px}
  .grid9 .cell .tm-mem img{width:60px;height:60px}
  .gridlab{display:grid;grid-template-columns:repeat(3,96px);gap:6px;font-size:11px;color:var(--sub);text-align:center;margin-top:6px}
  #teamInfo{display:block;line-height:1.7}
  .tm-mem img{object-fit:cover;background:#2a2620}
</style>
</head>
<body>
<header><div class="wrap">
  <div class="top">
    <a class="back" href="../">← Portal</a>
    <h1>棕色塵埃 1 收藏管理（韓服資料・中文翻譯）</h1>
    <span class="sp"></span>
    <button class="btn" id="btnExport">匯出</button>
    <button class="btn" id="btnImport">匯入</button>
    <input type="file" id="fileImport" accept=".json,application/json" hidden>
  </div>
  <div class="tabs">
    <div class="tab on" data-tab="list">傭兵</div>
    <div class="tab" data-tab="team">布陣推薦</div>
  </div>
  <div id="listCtl">
    <div class="filters">
      <input type="search" id="q" placeholder="搜尋名稱（中文／韓文）">
      <select id="fOwn">
        <option value="all">全部</option>
        <option value="own">持有</option>
        <option value="not">未持有</option>
        <option value="max">最終階段且 +滿</option>
        <option value="notmax">持有但未滿</option>
      </select>
      <select id="fSort">
        <option value="def">圖鑑順序</option>
        <option value="star">星級 ↓</option>
        <option value="bv">戰鬥力 ↓</option>
        <option value="name">名稱</option>
      </select>
    </div>
    <div class="chips" id="chipTab"></div>
    <div class="chips" id="chipCls"></div>
    <div class="stats" id="stats"></div>
  </div>
  <div id="teamCtl" hidden>
    <div class="filters">
      <label>陣型 <select id="tmPreset">
        <option value="bal">均衡（防 1・攻魔 3・支 1）</option>
        <option value="atk">進攻（防 1・攻魔 4）</option>
        <option value="def">防守（防 2・攻魔 2・支 1）</option>
        <option value="sup">輔助（防 1・攻魔 2・支 2）</option>
      </select></label>
      <label>人數 <select id="tmN"><option value="5" selected>5</option><option value="6">6</option></select></label>
    </div>
    <div class="stats" id="teamInfo"></div>
  </div>
</div></header>
<main id="grid"><div class="msg">讀取資料中…</div></main>
<section id="teamOut" hidden></section>
<div id="dlg"><div class="dbox"><button class="dclose" title="關閉">×</button><div id="dbody"></div></div></div>
<footer>棕色塵埃 1 已於 2024 年 12 月結束線上服務、轉為離線版，資料不再更新。資料與圖片來自非官方粉絲站 <a href="https://browndust-dogam.vercel.app/" target="_blank" rel="noopener">브라운더스트 1 기록관</a>（韓服用戶端資料），中文為本頁翻譯（非官方譯名），著作權屬 NEOWIZ 所有。點圖片看詳細資料，點右下圓圈打勾持有，下方選星級階段與強化值。持有紀錄存在此瀏覽器，換裝置請用「匯出／匯入」。</footer>

<script src="data/list.js"></script>
<script>
const IMG = 'https://browndust-dogam.vercel.app/img/';
const SAVE_KEY = 'bd1_owned_v1';
const TAB = ['神話', '超越', '傳說', '攻擊型', '防禦型', '魔法型', '支援型', '合作'];
const CLS = {CT_ATTACK:'攻擊型', CT_DEFENSE:'防禦型', CT_MAGIC:'魔法型', CT_SUPPORT:'支援型', CT_RECOVERY:'材料'};
const CLS_IMG = {CT_ATTACK:'attack', CT_DEFENSE:'defense', CT_MAGIC:'magic', CT_SUPPORT:'support'};
const STAT = ['攻擊力', '生命力', '支援力', '防禦力', '暴擊率', '暴擊傷害', '敏捷', '忍耐', '穿透'];
const SKTY = {ST_ATTACK:'攻擊', ST_MISSILE:'遠程', ST_BUFF:'支援'};
const L = window.BD1_LIST || [];
L.forEach((x, i) => { x.g = i % 20; x.ord = i; });

function esc(s){ return String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
const icon = f => IMG + f;
let owned = {};   // h: [stageIdx, enh]
try{ owned = JSON.parse(localStorage.getItem(SAVE_KEY)) || {}; }catch(e){ owned = {}; }
function saveOwned(){ try{ localStorage.setItem(SAVE_KEY, JSON.stringify(owned)); }catch(e){ alert('儲存失敗：' + e.message); } }
const F = {t:new Set(), c:new Set()};
const lastStg = x => x.stg[x.stg.length - 1];
const curStg = x => x.stg[owned[x.h] ? owned[x.h][0] : x.stg.length - 1];
const stgLab = s => s.s + '★' + (s.aw ? '覺' : '');
const isMax = x => owned[x.h] && owned[x.h][0] === x.stg.length - 1 && owned[x.h][1] >= x.stg[owned[x.h][0]].mx;

function buildChips(){
  document.getElementById('chipTab').innerHTML = TAB.map((t, i) => `<span class="chip${F.t.has(i) ? ' on' : ''}" data-k="t" data-v="${i}">${t}</span>`).join('');
  document.getElementById('chipCls').innerHTML = Object.keys(CLS_IMG).map(c => `<span class="chip${F.c.has(c) ? ' on' : ''}" data-k="c" data-v="${c}"><span class="ct ct-${c}">${CLS[c]}</span></span>`).join('');
}
function filtered(){
  const q = document.getElementById('q').value.trim().toLowerCase(), fo = document.getElementById('fOwn').value, so = document.getElementById('fSort').value;
  const out = L.filter(x => {
    if (F.t.size && !F.t.has(x.t)) return false;
    if (F.c.size && !F.c.has(x.c)) return false;
    if (q && !(x.n.toLowerCase().includes(q) || x.nk.includes(q) || x.stg.some(s => s.fn.toLowerCase().includes(q)))) return false;
    const v = owned[x.h];
    if (fo === 'own' && !v) return false;
    if (fo === 'not' && v) return false;
    if (fo === 'max' && !isMax(x)) return false;
    if (fo === 'notmax' && !(v && !isMax(x))) return false;
    return true;
  });
  if (so === 'star') out.sort((a, b) => lastStg(b).s - lastStg(a).s || a.ord - b.ord);
  else if (so === 'bv') out.sort((a, b) => (lastStg(b).bv || 0) - (lastStg(a).bv || 0));
  else if (so === 'name') out.sort((a, b) => a.n.localeCompare(b.n, 'zh-Hant'));
  else out.sort((a, b) => a.ord - b.ord);
  return out;
}
function cardHTML(x){
  const v = owned[x.h], s = curStg(x);
  return `<div class="item${v ? ' own' : ''}${isMax(x) ? ' np5' : ''}" data-h="${x.h}">
    <div class="img"><img loading="lazy" src="${icon(s.icon)}" data-big="${icon(s.card)}" alt="">
      <span class="rar t${x.t}">${stgLab(s)}</span>${CLS_IMG[x.c] ? `<img class="cls-ic" src="${IMG}ui/game/class_${CLS_IMG[x.c]}.png" alt="">` : ''}<span class="chk">✓</span></div>
    <div class="nm" title="${esc(x.nk)}">${esc(s.fn)}</div>
    <div class="cls">${esc(TAB[x.t])}</div>
    <div class="np">${x.stg.map((st, i) => `<span data-st="${i}" class="${v && v[0] === i ? 'on' : ''}" title="${esc(st.fn)}">${stgLab(st)}</span>`).join('')}${v && s.mx ? `<select data-enh>${Array.from({length:s.mx + 1}, (_, k) => `<option value="${k}"${v[1] === k ? ' selected' : ''}>+${k}</option>`).join('')}</select>` : ''}</div></div>`;
}
function render(){
  const out = filtered(), g = document.getElementById('grid');
  g.innerHTML = out.length ? out.map(cardHTML).join('') : '<div class="msg">沒有符合的項目</div>';
  renderStats(out.length);
}
function renderStats(shown){
  const own = L.filter(x => owned[x.h]);
  let h = `<span>持有 <b>${own.length}</b> / ${L.length}</span>` + [0, 1, 2].map(t => `<span>${TAB[t]} <b>${own.filter(x => x.t === t).length}</b>/${L.filter(x => x.t === t).length}</span>`).join('');
  h += `<span>6★ <b>${own.filter(x => curStg(x).s >= 6).length}</b></span><span>已滿 <b>${own.filter(isMax).length}</b></span><span>顯示中 ${shown}</span>`;
  document.getElementById('stats').innerHTML = h;
}
function setOwn(h, v){
  if (v) owned[h] = v; else delete owned[h];
  saveOwned();
  const x = L.find(y => y.h === h), el = document.querySelector(`#grid .item[data-h="${h}"]`);
  if (el){ const t = document.createElement('div'); t.innerHTML = cardHTML(x); el.replaceWith(t.firstElementChild); }
  renderStats(document.querySelectorAll('#grid .item').length);
}
const grid = document.getElementById('grid');
grid.addEventListener('click', ev => {
  const el = ev.target.closest('.item'); if (!el) return;
  const h = +el.dataset.h, x = L.find(y => y.h === h);
  const st = ev.target.closest('[data-st]');
  if (st){ const i = +st.dataset.st; setOwn(h, [i, Math.min(owned[h] ? owned[h][1] : 0, x.stg[i].mx)]); return; }
  if (ev.target.closest('select')) return;
  if (ev.target.closest('.chk')){ setOwn(h, owned[h] ? 0 : [0, 0]); return; }
  pushedHash = true; location.hash = 'm-' + h;
});
grid.addEventListener('change', ev => {
  if (!ev.target.matches('[data-enh]')) return;
  const h = +ev.target.closest('.item').dataset.h;
  setOwn(h, [owned[h][0], +ev.target.value]);
});

/* ===== 詳細 ===== */
let curDetail = null, pushedHash = false;
const loaded = {};
function loadGroup(g){
  if (loaded[g]) return loaded[g];
  return loaded[g] = new Promise((res, rej) => { const s = document.createElement('script'); s.src = `data/d${g}.js`; s.onload = res; s.onerror = () => { delete loaded[g]; rej(new Error('d' + g + '.js 讀取失敗')); }; document.head.appendChild(s); });
}
function fmtStat(i, v){ return i <= 2 ? (i === 2 && v < 1 && v > 0 ? (v * 100).toFixed(0) + '%' : Number(v).toLocaleString()) : (v * 100).toFixed(v * 100 % 1 ? 1 : 0) + '%'; }
function whoTr(s){ return String(s || '').replace('남', '男').replace('여', '女').replace(/(\d+)세/, '$1歲').replace('불명', '不明'); }
function ownBar(x){
  const v = owned[x.h];
  let h = `<label style="display:flex;align-items:center;gap:6px;cursor:pointer;font-weight:600"><input type="checkbox" id="downChk" ${v ? 'checked' : ''}> 持有</label>`;
  if (v){
    h += `<div class="np">${x.stg.map((s, i) => `<span data-dst="${i}" class="${v[0] === i ? 'on' : ''}">${stgLab(s)}</span>`).join('')}</div>`;
    const mx = x.stg[v[0]].mx;
    if (mx) h += `<label style="font-size:13px">強化 <select id="downEnh">${Array.from({length:mx + 1}, (_, k) => `<option value="${k}"${v[1] === k ? ' selected' : ''}>+${k}</option>`).join('')}</select></label>`;
  }
  return h;
}
function detailHTML(x, D){
  const v = owned[x.h], si = curDetail.si ?? (v ? v[0] : x.stg.length - 1), s = x.stg[si];
  const enh = Math.min(curDetail.e ?? (v ? v[1] : s.mx), s.mx);
  let h = `<div class="dhead"><img src="${icon(s.icon)}" alt=""><div><div class="ruby">${esc(x.nk)}</div><h2>${esc(s.fn)}</h2>
    <div class="meta">${x.t <= 2 || x.t === 7 ? esc(TAB[x.t]) + '｜' : ''}<span class="ct ct-${x.c}">${CLS[x.c] || x.c}</span>｜${stgLab(s)}｜${esc(x.src === '도감' ? '圖鑑' : x.src === '합성' ? '合成' : '活動發放')}</div></div></div>
    <div class="down" id="down">${ownBar(x)}</div>
    <div class="dcols"><div class="dart"><img id="dimg" src="${icon(s.card)}" alt="">
      ${x.cos.length > 1 ? `<div class="asc">${x.cos.map((c, i) => `<span data-cos="${i}">${esc(c.n)}</span>`).join('')}</div>` : ''}</div><div>
      <div class="prof">${esc(s.d)}</div>
      <div class="lvsel" style="font-size:13px;color:var(--sub);display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin:6px 0">顯示階段 ${x.stg.map((t, i) => `<span class="chip${i === si ? ' on' : ''}" data-vst="${i}">${stgLab(t)}</span>`).join('')}
        ${s.mx ? `　強化 <select id="vEnh">${Array.from({length:s.mx + 1}, (_, k) => `<option value="${k}"${k === enh ? ' selected' : ''}>+${k}</option>`).join('')}</select>` : ''}</div>
      <table class="kv"><tr><th>等級上限</th><td>${s.ml}</td><th>出戰費用</th><td>${s.co}</td></tr><tr><th>戰鬥力</th><td>${s.bv ?? '-'}</td><th>強化上限</th><td>+${s.mx}</td></tr>
        ${[0, 1, 2, 3, 4, 5, 6, 7, 8].reduce((a, i, k) => a + (k % 2 ? '' : '<tr>') + `<th>${STAT[i]}</th><td>${fmtStat(i, s.st[i] ?? 0)}</td>` + (k % 2 ? '</tr>' : ''), '')}</tr></table>
      <div style="font-size:12px;color:var(--sub);margin-top:4px">能力值為該階段 Lv1 基礎值。</div>
    </div></div>`;
  const lvs = D.sk[String(s.sk)] || [], lv = lvs[Math.min(enh, lvs.length - 1)];
  h += `<h3>技能（+${enh}）</h3>`;
  if (lv){
    h += `<div class="skhead"><img src="${IMG}range/${lv.r}" alt="" onerror="this.style.display='none'"><div><div style="font-weight:700;font-size:15px">${esc(lv.n)}</div>
      <div style="font-size:12.5px;color:var(--sub)">${esc(SKTY[lv.ty] || lv.ty)}・目標 ${esc(lv.st)}</div></div></div>`;
    const bl = id => { const b = D.bf[id]; if (!b || !b.n) return '';
      return `<div class="bf">${b.i ? `<img src="${IMG}buff/${b.i}.png" alt="" onerror="this.style.visibility='hidden'">` : '<span style="width:36px"></span>'}<div style="flex:1">
        <div class="t ${b.d ? 'db' : 'bfz'}">${esc(b.n)}<span class="m">${[b.ty, b.at, b.tu, b.tg].filter(Boolean).map(esc).join('・')}</span></div>
        <div class="x">${esc(b.x)}</div>${b.ex ? `<div class="ex">${esc(b.ex)}</div>` : ''}</div></div>`; };
    h += lv.b.map(bl).join('');
    const sub = lv.sb.map(bl).join('');
    if (sub) h += `<h3 style="font-size:14px">附加效果</h3>` + sub;
  } else h += '<p style="color:var(--sub)">沒有技能資料。</p>';
  if (D.my){
    const f = D.my.fixed;
    h += `<h3>神話技能（召喚時 2／3／4 號技能隨機）</h3><div class="bf">${f.i ? `<img src="${IMG}buff/${f.i}.png" alt="">` : ''}<div><div class="t bfz">${esc(f.n)}<span class="m">${[f.ty, f.at, f.tu, f.tg].filter(Boolean).map(esc).join('・')}</span></div><div class="x">${esc(f.x)}</div></div></div>`;
    h += D.my.slots.map(sl => `<div class="bf"><div><div class="t">${esc(sl.n.replace('번', ' 號'))}候選</div><div class="x">${sl.c.map(esc).join('・')}</div></div></div>`).join('');
  }
  if (D.prof && (D.prof.who || D.prof.ttl)) h += `<h3>角色檔案</h3><div class="prof">${esc(whoTr(D.prof.who))}</div>` +
    (D.prof.ttl ? `<details class="older" style="margin-left:0"><summary>原文介紹（韓文，未翻譯）</summary><div class="prof">${esc(D.prof.ttl)}\n${(D.prof.say || []).map(esc).join('\n')}</div></details>` : '');
  h += `<div class="dfoot">資料來源：<a href="https://browndust-dogam.vercel.app/dogam.html#m=${x.h}" target="_blank" rel="noopener">브라운더스트 1 기록관</a>（ID ${x.h}）</div>`;
  return h;
}
async function openDetail(h){
  const x = L.find(y => y.h === h);
  if (!x){ closeDetail(); return; }
  curDetail = {h};
  document.getElementById('dlg').classList.add('on');
  document.body.classList.add('lock');
  document.getElementById('dbody').innerHTML = '<p style="color:var(--sub)">讀取中…</p>';
  document.getElementById('dlg').scrollTop = 0;
  try{ await loadGroup(x.g); }catch(err){ document.getElementById('dbody').innerHTML = `<p>${esc(err.message)}</p>`; return; }
  if (curDetail && curDetail.h === h) paint();
}
function paint(){
  const x = L.find(y => y.h === curDetail.h), y = document.getElementById('dlg').scrollTop;
  document.getElementById('dbody').innerHTML = detailHTML(x, (window.BD1_D || {})[x.h] || {sk:{}, bf:{}});
  document.getElementById('dlg').scrollTop = y;
}
function closeDetail(){ curDetail = null; document.getElementById('dlg').classList.remove('on'); document.body.classList.remove('lock'); }
function hideDetail(){
  if (pushedHash){ pushedHash = false; history.back(); }
  else { history.replaceState(null, '', location.pathname + location.search); closeDetail(); }
}
function routeHash(){ const m = location.hash.match(/^#m-(\d+)$/); if (m) openDetail(+m[1]); else closeDetail(); }
window.addEventListener('hashchange', routeHash);
document.querySelector('.dclose').addEventListener('click', hideDetail);
document.addEventListener('keydown', ev => { if (ev.key === 'Escape' && curDetail) hideDetail(); });
document.getElementById('dlg').addEventListener('click', ev => {
  if (ev.target.id === 'dlg'){ hideDetail(); return; }
  if (!curDetail) return;
  const x = L.find(y => y.h === curDetail.h);
  const ds = ev.target.closest('[data-dst]');
  if (ds){ const i = +ds.dataset.dst; setOwn(x.h, [i, Math.min(owned[x.h][1], x.stg[i].mx)]); curDetail.si = i; curDetail.e = undefined; paint(); return; }
  const vs = ev.target.closest('[data-vst]');
  if (vs){ curDetail.si = +vs.dataset.vst; paint(); return; }
  const co = ev.target.closest('[data-cos]');
  if (co){ document.getElementById('dimg').src = icon(x.cos[+co.dataset.cos].card); return; }
});
document.getElementById('dlg').addEventListener('change', ev => {
  if (!curDetail) return;
  const x = L.find(y => y.h === curDetail.h);
  if (ev.target.id === 'downChk'){ setOwn(x.h, ev.target.checked ? [0, 0] : 0); curDetail.si = undefined; curDetail.e = undefined; paint(); }
  if (ev.target.id === 'downEnh'){ setOwn(x.h, [owned[x.h][0], +ev.target.value]); curDetail.e = +ev.target.value; paint(); }
  if (ev.target.id === 'vEnh'){ curDetail.e = +ev.target.value; paint(); }
});

/* ===== 分頁、篩選、匯出入 ===== */
document.querySelectorAll('.tab').forEach(t => t.addEventListener('click', () => {
  document.querySelectorAll('.tab').forEach(x => x.classList.toggle('on', x === t));
  const isTeam = t.dataset.tab === 'team';
  document.getElementById('listCtl').hidden = isTeam;
  document.getElementById('grid').hidden = isTeam;
  document.getElementById('teamCtl').hidden = !isTeam;
  document.getElementById('teamOut').hidden = !isTeam;
  window.scrollTo(0, 0);
  if (isTeam) TEAM.render(); else render();
}));
document.querySelectorAll('#listCtl .chips').forEach(box => box.addEventListener('click', ev => {
  const c = ev.target.closest('.chip'); if (!c) return;
  const k = c.dataset.k, v = k === 't' ? +c.dataset.v : c.dataset.v;
  F[k].has(v) ? F[k].delete(v) : F[k].add(v);
  c.classList.toggle('on'); render();
}));
let qTimer;
document.getElementById('q').addEventListener('input', () => { clearTimeout(qTimer); qTimer = setTimeout(render, 150); });
['fOwn', 'fSort'].forEach(id => document.getElementById(id).addEventListener('change', render));
document.getElementById('btnExport').addEventListener('click', () => {
  const blob = new Blob([JSON.stringify({game:'browndust1', version:1, exported:new Date().toISOString(), m:owned}, null, 1)], {type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'browndust1_owned_' + new Date().toISOString().slice(0, 10) + '.json';
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
});
document.getElementById('btnImport').addEventListener('click', () => document.getElementById('fileImport').click());
document.getElementById('fileImport').addEventListener('change', async ev => {
  const f = ev.target.files[0]; if (!f) return;
  try{
    const o = JSON.parse(await f.text());
    if (!o.m) throw new Error('格式不符');
    if (!confirm(`匯入 ${Object.keys(o.m).length} 位傭兵，會覆蓋目前紀錄，確定？`)) return;
    owned = o.m; saveOwned(); render();
  }catch(err){ alert('匯入失敗：' + err.message); }
  ev.target.value = '';
});
</script>
<script src="team.js"></script>
<script>
TEAM.init();
if (!L.length) document.getElementById('grid').innerHTML = '<div class="msg">資料讀取失敗（data/list.js）。</div>';
else { buildChips(); render(); routeHash(); if (location.hash === '#team') document.querySelector('.tab[data-tab="team"]').click(); }
</script>
<script src="../hover.js"></script>
</body>
</html>
