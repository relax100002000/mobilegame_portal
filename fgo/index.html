<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FGO 收藏管理（日服）</title>
<style>
  :root{--bg:#f3f4f8;--card:#fff;--text:#1d2130;--sub:#6b7085;--line:#e3e5ee;--accent:#4a5cff;--ok:#1f9d55;--gold:#d4a017}
  @media (prefers-color-scheme: dark){:root{--bg:#14161d;--card:#1f2230;--text:#eceef5;--sub:#9aa0b5;--line:#2e3244;--accent:#8c98ff;--ok:#3ccf7a}}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);font-family:"Segoe UI","Noto Sans TC","Microsoft JhengHei",sans-serif}
  header{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
  .wrap{max-width:1300px;margin:0 auto;padding:10px 14px}
  .top{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .top h1{margin:0;font-size:20px}
  .top a.back{color:var(--sub);text-decoration:none;font-size:14px}
  .top .sp{flex:1}
  button,select,input{font:inherit;color:var(--text)}
  .btn{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:6px 10px;cursor:pointer;font-size:13px}
  .btn:hover{border-color:var(--accent)}
  .tabs{display:flex;gap:6px;margin-top:10px}
  .tab{padding:7px 16px;border-radius:8px 8px 0 0;border:1px solid var(--line);border-bottom:none;background:var(--card);cursor:pointer;font-weight:600;color:var(--sub)}
  .tab.on{background:var(--accent);border-color:var(--accent);color:#fff}
  .filters{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:8px}
  .filters input[type=search]{flex:1;min-width:180px;padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:var(--card)}
  .filters select{padding:6px 8px;border:1px solid var(--line);border-radius:8px;background:var(--card)}
  .chips{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}
  .chip{padding:3px 9px;border:1px solid var(--line);border-radius:999px;background:var(--card);cursor:pointer;font-size:12px;user-select:none}
  .chip.on{background:var(--accent);border-color:var(--accent);color:#fff}
  .stats{margin-top:8px;font-size:13px;color:var(--sub);display:flex;flex-wrap:wrap;gap:4px 14px}
  .stats b{color:var(--text)}
  main{max-width:1300px;margin:0 auto;padding:14px;display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:10px}
  .item{position:relative;background:var(--card);border:2px solid var(--line);border-radius:10px;overflow:hidden;cursor:pointer;display:flex;flex-direction:column;user-select:none}
  .item .img{position:relative;aspect-ratio:1/1;background:#0002}
  .item img{width:100%;height:100%;object-fit:cover;display:block;filter:grayscale(1);opacity:.45;transition:.15s}
  .item.own{border-color:var(--ok)}
  .item.own img{filter:none;opacity:1}
  .item .no{position:absolute;left:4px;top:4px;background:#000a;color:#fff;font-size:11px;padding:1px 5px;border-radius:5px}
  .item .rar{position:absolute;right:4px;top:4px;background:#000a;color:var(--gold);font-size:11px;padding:1px 5px;border-radius:5px}
  .item .chk{position:absolute;right:4px;bottom:4px;width:24px;height:24px;border-radius:50%;background:#fffc;border:2px solid #888;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:700;color:transparent}
  .item.own .chk{background:var(--ok);border-color:#fff;color:#fff}
  .item .nm{font-size:12px;line-height:1.3;padding:4px 5px 2px;height:36px;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
  .item .cls{font-size:11px;color:var(--sub);padding:0 5px}
  .np{display:flex;gap:2px;padding:4px 4px 5px;visibility:hidden}
  .item.own .np{visibility:visible}
  .np span{flex:1;text-align:center;font-size:11px;border:1px solid var(--line);border-radius:4px;padding:2px 0;color:var(--sub)}
  .np span.on{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:700}
  .np span.mlb{flex:1}
  .item.np5 .np span.on{background:var(--gold);border-color:var(--gold)}
  main[hidden],#teamOut[hidden]{display:none}
  .filters label{font-size:13px;color:var(--sub);display:flex;align-items:center;gap:5px}
  #teamOut{max-width:1300px;margin:0 auto;padding:14px;display:grid;grid-template-columns:repeat(auto-fill,minmax(400px,1fr));gap:12px}
  .tm-card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
  .tm-head{font-size:13px;display:flex;gap:8px;align-items:center;margin-bottom:8px}
  .tm-b{font-size:12px;padding:2px 8px;border-radius:6px;color:#fff;font-weight:600}
  .tm-b.ok{background:var(--ok)}.tm-b.mid{background:#d08a00}.tm-b.ng{background:#c33}
  .tm-mems{display:flex;gap:8px}
  .tm-mem{width:84px;cursor:pointer;text-align:center}
  .tm-mem img{width:72px;height:72px;border-radius:8px;display:block;margin:0 auto}
  .tm-tag{display:inline-block;font-size:11px;padding:0 6px;border-radius:4px;margin-top:3px;color:#fff;background:#888}
  .tm-tag.t-dps{background:#c33}.tm-tag.t-own{background:var(--accent)}.tm-tag.t-friend{background:#d08a00}
  .tm-nm{font-size:11px;line-height:1.25;margin-top:2px;max-height:2.5em;overflow:hidden}
  table.tm-w{width:100%;border-collapse:collapse;font-size:12px;margin-top:8px}
  table.tm-w th,table.tm-w td{border-top:1px solid var(--line);padding:3px 4px;text-align:left;white-space:nowrap}
  table.tm-w th{color:var(--sub);font-weight:400}
  table.tm-w td.tm-plan{white-space:normal;color:var(--sub)}
  .tm-ok{color:var(--ok);font-weight:700}.tm-ng{color:#c33;font-weight:700}
  @media (max-width:600px){#teamOut{grid-template-columns:1fr;padding:8px}}
  .msg{grid-column:1/-1;text-align:center;color:var(--sub);padding:40px 0}
  footer{text-align:center;color:var(--sub);font-size:12px;padding:0 16px 30px}
  footer a{color:var(--sub)}
  .item .chk{width:30px;height:30px;right:3px;bottom:3px;font-size:17px}
  .item .chk:hover{border-color:var(--ok)}
  /* detail modal */
  #dlg{position:fixed;inset:0;z-index:20;background:#000a;display:none;align-items:flex-start;justify-content:center;overflow-y:auto;padding:24px 10px}
  #dlg.on{display:flex}
  body.lock{overflow:hidden}
  .dbox{position:relative;background:var(--card);border-radius:14px;max-width:880px;width:100%;padding:18px 20px 22px;box-shadow:0 20px 50px #0008}
  .dclose{position:absolute;right:10px;top:8px;border:none;background:none;font-size:28px;cursor:pointer;color:var(--sub);line-height:1}
  .dhead{display:flex;gap:14px;align-items:center;padding-right:30px}
  .dhead img{width:72px;height:72px;border-radius:8px}
  .dhead h2{margin:0;font-size:20px}
  .dhead .ruby{color:var(--sub);font-size:12px}
  .dhead .meta{color:var(--sub);font-size:13px;margin-top:2px}
  .down{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:12px 0 4px;padding:8px 10px;border:1px solid var(--line);border-radius:10px}
  .down .np{visibility:visible;padding:0;gap:4px}
  .down .np span{cursor:pointer;padding:4px 10px;font-size:13px}
  .dcols{display:grid;grid-template-columns:minmax(0,300px) minmax(0,1fr);gap:18px;margin-top:12px}
  .dart img{width:100%;border-radius:8px;display:block;background:#0002;min-height:200px}
  .dart .asc{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
  .dart .asc span{font-size:12px;padding:2px 8px;border:1px solid var(--line);border-radius:6px;cursor:pointer}
  .dart .asc span.on{background:var(--accent);border-color:var(--accent);color:#fff}
  .dbox h3{font-size:15px;margin:16px 0 6px;padding-bottom:4px;border-bottom:1px solid var(--line)}
  .dcols h3:first-child{margin-top:0}
  table.kv{border-collapse:collapse;font-size:13px;width:100%}
  table.kv th,table.kv td{border:1px solid var(--line);padding:4px 6px;text-align:left;vertical-align:top}
  table.kv th{background:#8881;white-space:nowrap;font-weight:600;width:1%}
  .sk{display:flex;gap:10px;padding:8px 0;border-bottom:1px dashed var(--line)}
  .sk:last-child{border-bottom:none}
  .sk img{width:40px;height:40px;flex:none}
  .sk .t{font-weight:600;font-size:14px}
  .sk .t small{font-weight:400;color:var(--sub);margin-left:6px}
  .sk .d{font-size:13px;margin-top:3px;white-space:pre-wrap}
  .vals{font-size:12px;color:var(--sub);margin-top:4px;overflow-x:auto}
  .vals table{border-collapse:collapse}
  .vals td{border:1px solid var(--line);padding:1px 5px;white-space:nowrap}
  .vals td:first-child{color:var(--text)}
  .tag{display:inline-block;font-size:11px;padding:0 6px;border-radius:4px;background:var(--accent);color:#fff;margin-left:6px;vertical-align:middle}
  .card-q{color:#2a7de1;font-weight:700}.card-a{color:#1f9d55;font-weight:700}.card-b{color:#d33;font-weight:700}
  .prof{font-size:13px;white-space:pre-wrap;line-height:1.6;padding:8px 0;border-bottom:1px dashed var(--line)}
  .prof .cond{display:block;color:var(--sub);font-size:12px}
  details.older{margin:2px 0 6px 50px;font-size:13px}
  details.older summary{cursor:pointer;color:var(--sub);font-size:12px}
  details.older .sk{opacity:.8}
  .dlink{color:var(--accent);cursor:pointer;text-decoration:underline}
  .dfoot{margin-top:14px;font-size:12px;color:var(--sub)}
  .dfoot a{color:var(--sub)}
  @media (max-width:700px){.dcols{grid-template-columns:1fr}.dart{max-width:320px;margin:0 auto}#dlg{padding:0}.dbox{border-radius:0;min-height:100%}}
  @media (max-width:600px){header{position:static}main{grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:7px}.item .nm{font-size:11px}}
</style>
</head>
<body>
<header><div class="wrap">
  <div class="top">
    <a class="back" href="../">← Portal</a>
    <h1>Fate/Grand Order 收藏管理（日服）</h1>
    <span class="sp"></span>
    <button class="btn" id="btnExport">匯出</button>
    <button class="btn" id="btnImport">匯入</button>
    <button class="btn" id="btnRefresh">更新資料</button>
    <input type="file" id="fileImport" accept=".json,application/json" hidden>
  </div>
  <div class="tabs">
    <div class="tab on" data-tab="svt">從者</div>
    <div class="tab" data-tab="ce">禮裝</div>
    <div class="tab" data-tab="team">周回組隊</div>
  </div>
  <div id="listCtl">
  <div class="filters">
    <input type="search" id="q" placeholder="搜尋名稱或編號">
    <select id="fOwn">
      <option value="all">全部</option>
      <option value="own">持有</option>
      <option value="not">未持有</option>
      <option value="np5">寶具5／滿破</option>
      <option value="notmax">持有但未滿</option>
    </select>
    <select id="fSort">
      <option value="no">編號 ↑</option>
      <option value="noD">編號 ↓</option>
      <option value="rar">稀有度 ↓</option>
    </select>
  </div>
  <div class="chips" id="chipRar"></div>
  <div class="chips" id="chipCat"></div>
  <div class="stats" id="stats"></div>
  </div>
  <div id="teamCtl" hidden>
    <div class="filters">
      <label>敵人職階 <select id="tmEnemy">
        <option value="">不指定</option><option value="saber">Saber</option><option value="archer">Archer</option><option value="lancer">Lancer</option>
        <option value="rider">Rider</option><option value="caster">Caster</option><option value="assassin">Assassin</option><option value="berserker">Berserker</option>
        <option value="ruler">Ruler</option><option value="avenger">Avenger</option><option value="alterEgo">Alter Ego</option><option value="moonCancer">Moon Cancer</option>
        <option value="foreigner">Foreigner</option><option value="pretender">Pretender</option><option value="shielder">Shielder</option><option value="beast">Beast</option>
      </select></label>
      <label>屬性 <select id="tmAttr"><option value="">不指定</option><option value="human">人</option><option value="sky">天</option><option value="earth">地</option><option value="star">星</option><option value="beast">獸</option></select></label>
      <label>每隻敵人 HP <input type="number" id="tmHp" min="0" step="1000" placeholder="可留空" style="width:110px;padding:6px 8px;border:1px solid var(--line);border-radius:8px;background:var(--card)"></label>
    </div>
    <div class="filters">
      <label>禮裝起始 NP <select id="tmCe"><option value="0">0%</option><option value="30">30%</option><option value="50" selected>50%</option><option value="60">60%</option><option value="80">80%</option><option value="100">100%</option></select></label>
      <label>附加技能2 <select id="tmAppend"><option value="0" selected>未開</option><option value="10">Lv1（10%）</option><option value="12">Lv2～（12%~）</option><option value="20">Lv10（20%）</option></select></label>
      <label>芙芙 ATK <select id="tmFou"><option value="0">0</option><option value="1000" selected>+1000</option><option value="2000">+2000</option></select></label>
      <label>好友 <select id="tmFriend"><option value="1" selected>借 1 位輔助</option><option value="0">只用自己的</option></select></label>
    </div>
    <div class="stats" id="teamInfo"></div>
  </div>
</div></header>
<main id="grid"><div class="msg">讀取資料中…</div></main>
<section id="teamOut" hidden></section>
<div id="dlg"><div class="dbox"><button class="dclose" title="關閉">×</button><div id="dbody"></div></div></div>
<footer>資料與圖片來自 <a href="https://atlasacademy.io/" target="_blank" rel="noopener">Atlas Academy</a>，著作權屬 TYPE-MOON / FGO PROJECT 所有。點圖片看詳細資料，點右下圓圈打勾持有。持有紀錄存在此瀏覽器，換裝置請用「匯出／匯入」。</footer>

<script>
const API = 'https://api.atlasacademy.io/export/JP/';
const SAVE_KEY = 'fgo_jp_owned_v1';
const CACHE_KEY = 'fgo_jp_data_v1';

const CLASS_LABEL = {
  saber:'Saber', archer:'Archer', lancer:'Lancer', rider:'Rider', caster:'Caster', assassin:'Assassin',
  berserker:'Berserker', shielder:'Shielder', ruler:'Ruler', avenger:'Avenger', alterEgo:'Alter Ego',
  moonCancer:'Moon Cancer', foreigner:'Foreigner', pretender:'Pretender', beast:'Beast', other:'其他'
};
const CLASS_ORDER = Object.keys(CLASS_LABEL);
const CE_LABEL = {
  normal:'卡池', svtEquipEvent:'活動卡池', svtEquipEventReward:'活動報酬', svtEquipFriendShip:'羈絆',
  svtEquipChocolate:'情人節', svtEquipCampaign:'紀念', svtEquipManaExchange:'魔力稜鏡交換',
  svtEquipExp:'EXP 卡', unknown:'其他'
};
const CE_ORDER = Object.keys(CE_LABEL);

function classGroup(c){
  if (CLASS_LABEL[c]) return c;
  if (/^beast/i.test(c) || /Beast/.test(c)) return 'beast';
  return 'other';
}

let data = null;               // {svt:[], ce:[], time}
let owned = loadOwned();       // {svt:{id:np}, ce:{id:1|2}}
let tab = 'svt';
const fRar = {svt:new Set(), ce:new Set()};
const fCat = {svt:new Set(), ce:new Set()};

function loadOwned(){
  try{ const o = JSON.parse(localStorage.getItem(SAVE_KEY)); if (o && o.svt && o.ce) return o; }catch(e){}
  return {svt:{}, ce:{}};
}
function saveOwned(){
  try{ localStorage.setItem(SAVE_KEY, JSON.stringify(owned)); }catch(e){ alert('儲存失敗：' + e.message); }
}

function trim(svtRaw, ceRaw){
  const svt = svtRaw.filter(s => s.collectionNo > 0 && (s.type === 'normal' || s.type === 'heroine'))
    .map(s => ({id:s.id, no:s.collectionNo, name:s.name, r:s.rarity, c:classGroup(s.className), face:s.face}));
  const ce = ceRaw.filter(e => e.collectionNo > 0)
    .map(e => ({id:e.id, no:e.collectionNo, name:e.name, r:e.rarity, c:(CE_LABEL[e.flag] ? e.flag : 'unknown'), face:e.face}));
  return {svt, ce, time:Date.now()};
}

async function fetchData(){
  const [s, e] = await Promise.all([
    fetch(API + 'basic_servant.json', {cache:'no-cache'}).then(r => { if(!r.ok) throw new Error('HTTP ' + r.status); return r.json(); }),
    fetch(API + 'basic_equip.json', {cache:'no-cache'}).then(r => { if(!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
  ]);
  const d = trim(s, e);
  try{ localStorage.setItem(CACHE_KEY, JSON.stringify(d)); }catch(err){}
  return d;
}

async function init(){
  try{ data = JSON.parse(localStorage.getItem(CACHE_KEY)); }catch(e){ data = null; }
  if (data){ buildChips(); render(); }
  try{
    const fresh = await fetchData();
    const changed = !data || fresh.svt.length !== data.svt.length || fresh.ce.length !== data.ce.length;
    data = fresh;
    if (changed){ buildChips(); render(); }
  }catch(err){
    if (!data) document.getElementById('grid').innerHTML = '<div class="msg">資料讀取失敗：' + err.message + '<br>請確認網路後按「更新資料」。</div>';
  }
  if (!curDetail) routeHash();
}

function buildChips(){
  const list = data[tab];
  const rars = [...new Set(list.map(x => x.r))].sort((a,b) => b - a);
  document.getElementById('chipRar').innerHTML = rars.map(r =>
    `<span class="chip${fRar[tab].has(r)?' on':''}" data-r="${r}">★${r}</span>`).join('');
  const order = tab === 'svt' ? CLASS_ORDER : CE_ORDER;
  const labels = tab === 'svt' ? CLASS_LABEL : CE_LABEL;
  const cats = order.filter(c => list.some(x => x.c === c));
  document.getElementById('chipCat').innerHTML = cats.map(c =>
    `<span class="chip${fCat[tab].has(c)?' on':''}" data-c="${c}">${labels[c]}</span>`).join('');
}

function ownVal(id){ return owned[tab][id] || 0; }
function maxVal(){ return tab === 'svt' ? 5 : 2; }

function filtered(){
  const q = document.getElementById('q').value.trim().toLowerCase();
  const fo = document.getElementById('fOwn').value;
  const so = document.getElementById('fSort').value;
  const mx = maxVal();
  let list = data[tab].filter(x => {
    if (fRar[tab].size && !fRar[tab].has(x.r)) return false;
    if (fCat[tab].size && !fCat[tab].has(x.c)) return false;
    if (q && !(x.name.toLowerCase().includes(q) || String(x.no) === q)) return false;
    const v = owned[tab][x.id] || 0;
    if (fo === 'own' && !v) return false;
    if (fo === 'not' && v) return false;
    if (fo === 'np5' && v !== mx) return false;
    if (fo === 'notmax' && !(v && v < mx)) return false;
    return true;
  });
  if (so === 'noD') list.sort((a,b) => b.no - a.no);
  else if (so === 'rar') list.sort((a,b) => b.r - a.r || a.no - b.no);
  else list.sort((a,b) => a.no - b.no);
  return list;
}

function esc(s){ return String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

function cardHTML(x){
  const v = ownVal(x.id), mx = maxVal();
  const cls = 'item' + (v ? ' own' : '') + (v === mx ? ' np5' : '');
  const sub = tab === 'svt' ? CLASS_LABEL[x.c] : CE_LABEL[x.c];
  let np;
  if (tab === 'svt') np = [1,2,3,4,5].map(n => `<span data-np="${n}" class="${v===n?'on':''}">${n}</span>`).join('');
  else np = `<span data-np="${v===2?1:2}" class="mlb${v===2?' on':''}">${v===2?'滿破':'未滿破'}</span>`;
  return `<div class="${cls}" data-id="${x.id}">
    <div class="img"><img loading="lazy" src="${x.face}" alt=""><span class="no">No.${x.no}</span><span class="rar">★${x.r}</span><span class="chk">✓</span></div>
    <div class="nm" title="${esc(x.name)}">${esc(x.name)}</div>
    <div class="cls">${sub}</div>
    <div class="np" title="${tab==='svt'?'寶具等級':'滿破'}">${np}</div>
  </div>`;
}

function render(){
  if (!data) return;
  const list = filtered();
  const g = document.getElementById('grid');
  g.innerHTML = list.length ? list.map(cardHTML).join('') : '<div class="msg">沒有符合的項目</div>';
  renderStats(list.length);
}

function renderStats(shown){
  const list = data[tab], mx = maxVal();
  const own = list.filter(x => owned[tab][x.id]);
  const maxed = own.filter(x => owned[tab][x.id] === mx).length;
  const byR = {};
  list.forEach(x => { byR[x.r] = byR[x.r] || [0,0]; byR[x.r][1]++; if (owned[tab][x.id]) byR[x.r][0]++; });
  const pct = list.length ? (own.length / list.length * 100).toFixed(1) : 0;
  let h = `<span>持有 <b>${own.length}</b> / ${list.length}（${pct}%）</span>`;
  h += `<span>${tab==='svt'?'寶具5':'滿破'} <b>${maxed}</b></span>`;
  h += Object.keys(byR).sort((a,b) => b - a).map(r => `<span>★${r} <b>${byR[r][0]}</b>/${byR[r][1]}</span>`).join('');
  h += `<span>顯示中 ${shown}</span>`;
  if (data.time) h += `<span>資料：${new Date(data.time).toLocaleString()}</span>`;
  document.getElementById('stats').innerHTML = h;
}

function updateCard(el, id){
  const x = data[tab].find(i => i.id === id);
  const tmp = document.createElement('div');
  tmp.innerHTML = cardHTML(x);
  el.replaceWith(tmp.firstElementChild);
  renderStats(document.querySelectorAll('#grid .item').length);
}

function setOwn(t, id, v){
  if (v) owned[t][id] = v; else delete owned[t][id];
  saveOwned();
  if (t === tab){
    const el = document.querySelector(`#grid .item[data-id="${id}"]`);
    if (el) updateCard(el, id); else renderStats(document.querySelectorAll('#grid .item').length);
  }
}

document.getElementById('grid').addEventListener('click', ev => {
  const el = ev.target.closest('.item'); if (!el) return;
  const id = +el.dataset.id;
  const npEl = ev.target.closest('[data-np]');
  if (npEl) setOwn(tab, id, +npEl.dataset.np);
  else if (ev.target.closest('.chk')) setOwn(tab, id, owned[tab][id] ? 0 : 1);
  else { pushedHash = true; location.hash = tab + '-' + id; }
});

/* ===== 詳細資料 ===== */
const detailCache = {};
const CARD_NAME = {'1':['A','card-a','Arts'], '2':['B','card-b','Buster'], '3':['Q','card-q','Quick'], '4':['EX','','Extra']};
const ATTR = {human:'人', sky:'天', earth:'地', star:'星', beast:'獸'};
const GENDER = {male:'男性', female:'女性', unknown:'不明'};
const PSTAT = [['strength','筋力'],['endurance','耐久'],['agility','敏捷'],['magic','魔力'],['luck','幸運'],['np','寶具']];

function fmtDetail(s){
  return esc(s || '').replace(/\[servantName (\d+)\]/g, (m, id) => {
    const x = data && data.svt.find(v => v.id === +id);
    return x ? esc(x.name) : m;
  });
}
function cardLabel(c){ const k = CARD_NAME[c] || [c,'',c]; return `<span class="${k[1]}">${k[0]}</span>`; }

function fmtVal(f, v){
  if (v == null) return '';
  const t = f.funcType;
  if (/^(gainNp|lossNp)/.test(t)) return (v / 100) + '%';
  if (/^damageNp/.test(t)) return (v / 10) + '%';
  if (/^addState/.test(t)){
    const b = f.buffs && f.buffs[0];
    if (b && /^(up|down)/.test(b.type)) return (v / 10) + '%';
    return String(v);
  }
  return String(v);
}
function funcName(f){
  if (/^damageNp/.test(f.funcType)) return '寶具威力';
  const p = f.funcPopupText;
  if (p && p !== 'なし') return p;
  return (f.buffs && f.buffs[0] && f.buffs[0].name) || f.funcType;
}
// rows: each func -> label + values per level (or per OC)
function valsTable(funcs, isNP){
  const rows = [];
  (funcs || []).forEach(f => {
    if (!f.svals || !f.svals.length) return;
    let vals = f.svals.map(s => s.Value);
    let label = '';
    if (isNP && vals.every(v => v === vals[0]) && f.svals2){
      const oc = [f.svals, f.svals2, f.svals3, f.svals4, f.svals5].filter(Boolean).map(a => a[0].Value);
      if (oc.some(v => v !== oc[0])){ vals = oc; label = '（OC）'; }
    }
    if (vals.every(v => v == null)) return;
    const s0 = f.svals[0];
    const extra = [s0.Turn > 0 ? s0.Turn + 'T' : '', s0.Count > 0 ? s0.Count + '回' : '', s0.Rate && s0.Rate < 1000 ? '機率 ' + s0.Rate / 10 + '%' : ''].filter(Boolean).join('・');
    const same = vals.every(v => v === vals[0]);
    const cells = same ? `<td colspan="${vals.length}">${fmtVal(f, vals[0])}</td>` : vals.map(v => `<td>${fmtVal(f, v)}</td>`).join('');
    rows.push(`<tr><td>${esc(funcName(f))}${label}${extra ? ' <small>(' + extra + ')</small>' : ''}</td>${cells}</tr>`);
  });
  return rows.length ? `<div class="vals"><table>${rows.join('')}</table></div>` : '';
}

function skillHTML(sk, tagText){
  const ct = sk.coolDown && sk.coolDown.length ? (sk.coolDown[0] === sk.coolDown[sk.coolDown.length - 1] ? sk.coolDown[0] : sk.coolDown[0] + '→' + sk.coolDown[sk.coolDown.length - 1]) : '';
  return `<div class="sk">${sk.icon ? `<img src="${sk.icon}" alt="">` : ''}<div style="flex:1;min-width:0">
    <div class="t">${esc(sk.name)}${tagText ? `<span class="tag">${tagText}</span>` : ''}${ct ? `<small>CT ${ct}</small>` : ''}</div>
    <div class="d">${fmtDetail(sk.detail)}</div>${valsTable(sk.functions, false)}</div></div>`;
}

function olderHTML(list){
  return list.length ? `<details class="older"><summary>強化前／其他版本（${list.length}）</summary>${list.join('')}</details>` : '';
}

function artHTML(imgs){
  const keys = Object.keys(imgs);
  if (!keys.length) return '';
  return `<div class="dart"><img id="dimg" src="${imgs[keys[0]][1]}" alt="">
    ${keys.length > 1 ? `<div class="asc">${keys.map((k, i) => `<span data-img="${imgs[k][1]}" class="${i ? '' : 'on'}">${esc(imgs[k][0])}</span>`).join('')}</div>` : ''}</div>`;
}

function profHTML(p){
  if (!p || !p.comments || !p.comments.length) return '';
  return '<h3>簡介</h3>' + p.comments.map(c => {
    let cond = '';
    if (c.condType === 'svtFriendship') cond = '羈絆 Lv.' + c.condValues[0];
    else if (c.condType && c.condType !== 'none') cond = c.condMessage || c.condType;
    return `<div class="prof">${cond ? `<span class="cond">【${esc(cond)}】</span>` : ''}${esc(c.comment)}</div>`;
  }).join('');
}

function ownBarHTML(t, id){
  const v = owned[t][id] || 0;
  let h = `<label style="display:flex;align-items:center;gap:6px;cursor:pointer;font-weight:600"><input type="checkbox" id="downChk" ${v ? 'checked' : ''}> 持有</label>`;
  if (v){
    if (t === 'svt') h += '<span style="color:var(--sub);font-size:13px">寶具</span><div class="np">' + [1,2,3,4,5].map(n => `<span data-dnp="${n}" class="${v===n?'on':''}">${n}</span>`).join('') + '</div>';
    else h += `<div class="np"><span data-dnp="1" class="${v===1?'on':''}">未滿破</span><span data-dnp="2" class="${v===2?'on':''}">滿破</span></div>`;
  }
  return h;
}

let curDetail = null; // {t, id}

async function openDetail(t, id){
  const base = data && data[t].find(x => x.id === id);
  if (!base){ closeDetail(); return; }
  curDetail = {t, id};
  document.getElementById('dlg').classList.add('on');
  document.body.classList.add('lock');
  const body = document.getElementById('dbody');
  body.innerHTML = headHTML(t, base, null) + '<p style="color:var(--sub)">讀取詳細資料中…</p>';
  const key = t + id;
  try{
    if (!detailCache[key]){
      const url = `https://api.atlasacademy.io/nice/JP/${t === 'svt' ? 'servant' : 'equip'}/${id}?lore=true`;
      const r = await fetch(url);
      if (!r.ok) throw new Error('HTTP ' + r.status);
      detailCache[key] = await r.json();
    }
  }catch(err){
    if (curDetail && curDetail.id === id) body.innerHTML = headHTML(t, base, null) + `<p>詳細資料讀取失敗：${esc(err.message)}</p>`;
    return;
  }
  if (!curDetail || curDetail.id !== id || curDetail.t !== t) return;
  const d = detailCache[key];
  body.innerHTML = headHTML(t, base, d) + (t === 'svt' ? svtHTML(d) : ceHTML(d));
  document.getElementById('dlg').scrollTop = 0;
}

function headHTML(t, b, d){
  const meta = t === 'svt'
    ? [CLASS_LABEL[b.c], '★' + b.r, d ? '屬性：' + (ATTR[d.attribute] || d.attribute) : '', d ? GENDER[d.gender] || d.gender : '', d ? 'Cost ' + d.cost : ''].filter(Boolean).join('｜')
    : [CE_LABEL[b.c], '★' + b.r, d ? 'Cost ' + d.cost : ''].filter(Boolean).join('｜');
  return `<div class="dhead"><img src="${b.face}" alt=""><div>
    <div class="ruby">${d && d.ruby && d.ruby !== '-' ? esc(d.ruby) : ''}</div>
    <h2>No.${b.no} ${esc(b.name)}</h2><div class="meta">${meta}</div></div></div>
    <div class="down" id="down">${ownBarHTML(t, b.id)}</div>`;
}

function svtHTML(d){
  const imgs = {};
  const asc = (d.extraAssets && d.extraAssets.charaGraph) || {};
  Object.entries(asc.ascension || {}).forEach(([k, u]) => imgs['a' + k] = ['第' + k + '階段', u]);
  Object.entries(asc.costume || {}).forEach(([k, u]) => {
    const c = d.profile && d.profile.costume && d.profile.costume[k];
    imgs['c' + k] = [c ? c.shortName || c.name : '靈衣', u];
  });
  const np0 = d.noblePhantasms && d.noblePhantasms[0];
  const npGain = np0 && np0.npGain ? (np0.npGain.arts?.[0] ?? np0.npGain.buster?.[0]) / 100 + '%' : '-';
  const npDef = np0 && np0.npGain && np0.npGain.defence ? np0.npGain.defence[0] / 100 + '%' : '-';
  const hits = k => (d.hitsDistribution && d.hitsDistribution[k] || []).length;
  const ps = d.profile && d.profile.stats;
  let h = `<div class="dcols">${artHTML(imgs)}<div>
    <h3>能力值</h3><table class="kv">
      <tr><th>ATK</th><td>${d.atkBase} → ${d.atkMax}</td><th>HP</th><td>${d.hpBase} → ${d.hpMax}</td></tr>
      <tr><th>最大 Lv</th><td>${d.lvMax}</td><th>指令卡</th><td>${d.cards.map(cardLabel).join(' ')}</td></tr>
      <tr><th>Hit 數</th><td colspan="3">Q ${hits('3')}／A ${hits('1')}／B ${hits('2')}／EX ${hits('4')}${np0 ? '／寶具 ' + (np0.npDistribution || []).length : ''}</td></tr>
      <tr><th>NP 獲得</th><td>${npGain}</td><th>受擊 NP</th><td>${npDef}</td></tr>
      <tr><th>出星率</th><td>${d.starGen / 10}%</td><th>集星</th><td>${d.starAbsorb}</td></tr>
      <tr><th>即死率</th><td>${d.instantDeathChance / 10}%</td><th>畫師／CV</th><td>${esc(d.profile?.illustrator || '-')}／${esc(d.profile?.cv || '-')}</td></tr>
    </table>`;
  if (ps) h += `<table class="kv" style="margin-top:6px"><tr>${PSTAT.map(([k, l]) => `<th>${l}</th><td>${esc(ps[k] || '-')}</td>`).join('')}</tr></table>`;
  if (d.bondEquip){
    const ce = data.ce.find(x => x.id === d.bondEquip);
    if (ce) h += `<p style="font-size:13px;margin:8px 0 0">羈絆禮裝：<span class="dlink" data-goto="ce-${ce.id}">${esc(ce.name)}</span></p>`;
  }
  h += '</div></div>';

  const npHTML = n => `<div class="sk"><div style="flex:1;min-width:0">
      <div class="t">${cardLabel(n.card)} ${esc(n.name)} <small>${esc(n.ruby || '')}</small><small>${esc(n.rank)}｜${esc(n.type)}</small></div>
      <div class="d">${fmtDetail(n.detail)}</div>${valsTable(n.functions, true)}</div></div>`;
  const nps = (d.noblePhantasms || []).slice().sort((a, b) => b.priority - a.priority);
  h += '<h3>寶具</h3>' + (nps.length ? npHTML(nps[0]) : '') + olderHTML(nps.slice(1).map(npHTML));

  // 技能：每個欄位顯示 priority 最高的版本，其餘收在「其他版本」
  h += '<h3>保有技能</h3>';
  [...new Set((d.skills || []).map(s => s.num))].sort().forEach(num => {
    const vs = d.skills.filter(s => s.num === num).sort((a, b) => b.priority - a.priority);
    h += skillHTML(vs[0], vs.length > 1 ? '強化後' : '') + olderHTML(vs.slice(1).map(s => skillHTML(s, '')));
  });
  if (d.classPassive && d.classPassive.length) h += '<h3>職階技能</h3>' + d.classPassive.map(sk => skillHTML(sk, '')).join('');
  if (d.appendPassive && d.appendPassive.length) h += '<h3>附加技能</h3>' + d.appendPassive.map(a => skillHTML(a.skill, '')).join('');
  h += profHTML(d.profile);
  h += `<div class="dfoot">更多資料：<a href="https://apps.atlasacademy.io/db/JP/servant/${d.collectionNo}" target="_blank" rel="noopener">Atlas Academy DB</a></div>`;
  return h;
}

function ceHTML(d){
  const imgs = {};
  Object.entries((d.extraAssets && d.extraAssets.charaGraph && d.extraAssets.charaGraph.equip) || {}).forEach(([k, u]) => imgs[k] = ['', u]);
  let h = `<div class="dcols">${artHTML(imgs)}<div>
    <h3>能力值</h3><table class="kv">
      <tr><th>ATK</th><td>${d.atkBase} → ${d.atkMax}</td></tr>
      <tr><th>HP</th><td>${d.hpBase} → ${d.hpMax}</td></tr>
      <tr><th>最大 Lv</th><td>${d.lvMax}</td></tr>
      <tr><th>畫師</th><td>${esc(d.profile?.illustrator || '-')}</td></tr>
    </table>`;
  const owner = d.bondEquipOwner || (d.valentineEquipOwner);
  if (owner){
    const s = data.svt.find(x => x.id === owner);
    if (s) h += `<p style="font-size:13px;margin:8px 0 0">${d.flag === 'svtEquipChocolate' ? '情人節禮裝' : '羈絆禮裝'}：<span class="dlink" data-goto="svt-${s.id}">${esc(s.name)}</span></p>`;
  }
  const sks = (d.skills || []).slice().sort((a, b) => a.num - b.num || a.priority - b.priority);
  const maxP = Math.max(...sks.map(s => s.priority), 0);
  h += '<h3>效果</h3>' + sks.map(sk => skillHTML(sk, sks.length > 1 ? (sk.priority === maxP ? '滿破' : '未滿破') : '')).join('');
  h += '</div></div>';
  h += profHTML(d.profile);
  h += `<div class="dfoot">更多資料：<a href="https://apps.atlasacademy.io/db/JP/craft-essence/${d.collectionNo}" target="_blank" rel="noopener">Atlas Academy DB</a></div>`;
  return h;
}

function closeDetail(){
  curDetail = null;
  document.getElementById('dlg').classList.remove('on');
  document.body.classList.remove('lock');
}
let pushedHash = false;
function hideDetail(){
  if (pushedHash){ pushedHash = false; history.back(); }
  else { history.replaceState(null, '', location.pathname + location.search); closeDetail(); }
}

function routeHash(){
  const m = location.hash.match(/^#(svt|ce)-(\d+)$/);
  if (m && data) openDetail(m[1], +m[2]); else closeDetail();
}
window.addEventListener('hashchange', routeHash);
document.querySelector('.dclose').addEventListener('click', hideDetail);
document.getElementById('dlg').addEventListener('click', ev => {
  if (ev.target.id === 'dlg') { hideDetail(); return; }
  const a = ev.target.closest('.asc span');
  if (a){
    document.getElementById('dimg').src = a.dataset.img;
    a.parentNode.querySelectorAll('span').forEach(s => s.classList.toggle('on', s === a));
    return;
  }
  const g = ev.target.closest('[data-goto]');
  if (g){ location.replace('#' + g.dataset.goto); return; }
  const np = ev.target.closest('[data-dnp]');
  if (np && curDetail){
    setOwn(curDetail.t, curDetail.id, +np.dataset.dnp);
    document.getElementById('down').innerHTML = ownBarHTML(curDetail.t, curDetail.id);
  }
});
document.getElementById('dlg').addEventListener('change', ev => {
  if (ev.target.id === 'downChk' && curDetail){
    setOwn(curDetail.t, curDetail.id, ev.target.checked ? 1 : 0);
    document.getElementById('down').innerHTML = ownBarHTML(curDetail.t, curDetail.id);
  }
});
document.addEventListener('keydown', ev => { if (ev.key === 'Escape' && curDetail) hideDetail(); });

document.querySelectorAll('.tab').forEach(t => t.addEventListener('click', () => {
  document.querySelectorAll('.tab').forEach(x => x.classList.toggle('on', x === t));
  const isTeam = t.dataset.tab === 'team';
  document.getElementById('listCtl').hidden = isTeam;
  document.getElementById('grid').hidden = isTeam;
  document.getElementById('teamCtl').hidden = !isTeam;
  document.getElementById('teamOut').hidden = !isTeam;
  window.scrollTo(0, 0);
  if (isTeam){ if (data) TEAM.render(); return; }
  tab = t.dataset.tab;
  document.querySelector('#fOwn option[value=np5]').textContent = tab === 'svt' ? '寶具5' : '滿破';
  if (data){ buildChips(); render(); }
  window.scrollTo(0, 0);
}));

function chipHandler(set, attr){
  return ev => {
    const c = ev.target.closest('.chip'); if (!c) return;
    const v = attr === 'r' ? +c.dataset.r : c.dataset.c;
    const s = set[tab];
    s.has(v) ? s.delete(v) : s.add(v);
    c.classList.toggle('on');
    render();
  };
}
document.getElementById('chipRar').addEventListener('click', chipHandler(fRar, 'r'));
document.getElementById('chipCat').addEventListener('click', chipHandler(fCat, 'c'));
let qTimer;
document.getElementById('q').addEventListener('input', () => { clearTimeout(qTimer); qTimer = setTimeout(render, 150); });
document.getElementById('fOwn').addEventListener('change', render);
document.getElementById('fSort').addEventListener('change', render);

document.getElementById('btnRefresh').addEventListener('click', async () => {
  const b = document.getElementById('btnRefresh');
  b.disabled = true; b.textContent = '更新中…';
  try{ data = await fetchData(); buildChips(); render(); b.textContent = '已更新'; }
  catch(err){ alert('更新失敗：' + err.message); b.textContent = '更新資料'; }
  setTimeout(() => { b.disabled = false; b.textContent = '更新資料'; }, 1500);
});

document.getElementById('btnExport').addEventListener('click', () => {
  const blob = new Blob([JSON.stringify({game:'fgo', server:'JP', version:1, exported:new Date().toISOString(), ...owned}, null, 1)], {type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'fgo_jp_owned_' + new Date().toISOString().slice(0,10) + '.json';
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
});
document.getElementById('btnImport').addEventListener('click', () => document.getElementById('fileImport').click());
document.getElementById('fileImport').addEventListener('change', async ev => {
  const f = ev.target.files[0]; if (!f) return;
  try{
    const o = JSON.parse(await f.text());
    if (!o.svt || !o.ce) throw new Error('格式不符');
    if (!confirm(`匯入 ${Object.keys(o.svt).length} 位從者、${Object.keys(o.ce).length} 張禮裝，會覆蓋目前紀錄，確定？`)) return;
    owned = {svt:o.svt, ce:o.ce};
    saveOwned(); render();
  }catch(err){ alert('匯入失敗：' + err.message); }
  ev.target.value = '';
});

init();
</script>
<script src="team.js"></script>
<script>TEAM.init();</script>
<script src="../hover.js"></script>
