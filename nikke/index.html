<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>勝利女神：妮姬 收藏管理</title>
<style>
  :root{--bg:#f3f4f8;--card:#fff;--text:#1d2130;--sub:#6b7085;--line:#e3e5ee;--accent:#4a5cff;--ok:#1f9d55;--gold:#d4a017}
  @media (prefers-color-scheme: dark){:root{--bg:#14161d;--card:#1f2230;--text:#eceef5;--sub:#9aa0b5;--line:#2e3244;--accent:#8c98ff;--ok:#3ccf7a}}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);font-family:"Segoe UI","Noto Sans TC","Microsoft JhengHei",sans-serif}
  header{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
  .wrap{max-width:1300px;margin:0 auto;padding:10px 14px}
  .top{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .top h1{margin:0;font-size:20px}
  .top a.back{color:var(--sub);text-decoration:none;font-size:14px}
  .top .sp{flex:1}
  button,select,input{font:inherit;color:var(--text)}
  .btn{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:6px 10px;cursor:pointer;font-size:13px}
  .btn:hover{border-color:var(--accent)}
  .tabs{display:flex;gap:6px;margin-top:10px}
  .tab{padding:7px 16px;border-radius:8px 8px 0 0;border:1px solid var(--line);border-bottom:none;background:var(--card);cursor:pointer;font-weight:600;color:var(--sub)}
  .tab.on{background:var(--accent);border-color:var(--accent);color:#fff}
  .filters{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:8px}
  .filters input[type=search]{flex:1;min-width:180px;padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:var(--card)}
  .filters select{padding:6px 8px;border:1px solid var(--line);border-radius:8px;background:var(--card)}
  .chips{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}
  .chip{padding:3px 9px;border:1px solid var(--line);border-radius:999px;background:var(--card);cursor:pointer;font-size:12px;user-select:none}
  .chip.on{background:var(--accent);border-color:var(--accent);color:#fff}
  .stats{margin-top:8px;font-size:13px;color:var(--sub);display:flex;flex-wrap:wrap;gap:4px 14px}
  .stats b{color:var(--text)}
  main{max-width:1300px;margin:0 auto;padding:14px;display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:10px}
  .item{position:relative;background:var(--card);border:2px solid var(--line);border-radius:10px;overflow:hidden;cursor:pointer;display:flex;flex-direction:column;user-select:none}
  .item .img{position:relative;aspect-ratio:1/1;background:#0002}
  .item img{width:100%;height:100%;object-fit:cover;display:block;filter:grayscale(1);opacity:.45;transition:.15s}
  .item.own{border-color:var(--ok)}
  .item.own img{filter:none;opacity:1}
  .item .no{position:absolute;left:4px;top:4px;background:#000a;color:#fff;font-size:11px;padding:1px 5px;border-radius:5px}
  .item .rar{position:absolute;right:4px;top:4px;background:#000a;color:var(--gold);font-size:11px;padding:1px 5px;border-radius:5px}
  .item .chk{position:absolute;right:4px;bottom:4px;width:24px;height:24px;border-radius:50%;background:#fffc;border:2px solid #888;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:700;color:transparent}
  .item.own .chk{background:var(--ok);border-color:#fff;color:#fff}
  .item .nm{font-size:12px;line-height:1.3;padding:4px 5px 2px;height:36px;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
  .item .cls{font-size:11px;color:var(--sub);padding:0 5px}
  .np{display:flex;gap:2px;padding:4px 4px 5px;visibility:hidden}
  .item.own .np{visibility:visible}
  .np span{flex:1;text-align:center;font-size:11px;border:1px solid var(--line);border-radius:4px;padding:2px 0;color:var(--sub)}
  .np span.on{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:700}
  .np span.mlb{flex:1}
  .item.np5 .np span.on{background:var(--gold);border-color:var(--gold)}
  main[hidden],#teamOut[hidden]{display:none}
  .filters label{font-size:13px;color:var(--sub);display:flex;align-items:center;gap:5px}
  #teamOut{max-width:1300px;margin:0 auto;padding:14px;display:grid;grid-template-columns:repeat(auto-fill,minmax(400px,1fr));gap:12px}
  .tm-card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
  .tm-head{font-size:13px;display:flex;gap:8px;align-items:center;margin-bottom:8px}
  .tm-b{font-size:12px;padding:2px 8px;border-radius:6px;color:#fff;font-weight:600}
  .tm-b.ok{background:var(--ok)}.tm-b.mid{background:#d08a00}.tm-b.ng{background:#c33}
  .tm-mems{display:flex;gap:8px}
  .tm-mem{width:84px;cursor:pointer;text-align:center}
  .tm-mem img{width:72px;height:72px;border-radius:8px;display:block;margin:0 auto}
  .tm-tag{display:inline-block;font-size:11px;padding:0 6px;border-radius:4px;margin-top:3px;color:#fff;background:#888}
  .tm-tag.t-dps{background:#c33}.tm-tag.t-own{background:var(--accent)}.tm-tag.t-friend{background:#d08a00}
  .tm-nm{font-size:11px;line-height:1.25;margin-top:2px;max-height:2.5em;overflow:hidden}
  table.tm-w{width:100%;border-collapse:collapse;font-size:12px;margin-top:8px}
  table.tm-w th,table.tm-w td{border-top:1px solid var(--line);padding:3px 4px;text-align:left;white-space:nowrap}
  table.tm-w th{color:var(--sub);font-weight:400}
  table.tm-w td.tm-plan{white-space:normal;color:var(--sub)}
  .tm-ok{color:var(--ok);font-weight:700}.tm-ng{color:#c33;font-weight:700}
  @media (max-width:600px){#teamOut{grid-template-columns:1fr;padding:8px}}
  .msg{grid-column:1/-1;text-align:center;color:var(--sub);padding:40px 0}
  footer{text-align:center;color:var(--sub);font-size:12px;padding:0 16px 30px}
  footer a{color:var(--sub)}
  .item .chk{width:30px;height:30px;right:3px;bottom:3px;font-size:17px}
  .item .chk:hover{border-color:var(--ok)}
  /* detail modal */
  #dlg{position:fixed;inset:0;z-index:20;background:#000a;display:none;align-items:flex-start;justify-content:center;overflow-y:auto;padding:24px 10px}
  #dlg.on{display:flex}
  body.lock{overflow:hidden}
  .dbox{position:relative;background:var(--card);border-radius:14px;max-width:880px;width:100%;padding:18px 20px 22px;box-shadow:0 20px 50px #0008}
  .dclose{position:absolute;right:10px;top:8px;border:none;background:none;font-size:28px;cursor:pointer;color:var(--sub);line-height:1}
  .dhead{display:flex;gap:14px;align-items:center;padding-right:30px}
  .dhead img{width:72px;height:72px;border-radius:8px}
  .dhead h2{margin:0;font-size:20px}
  .dhead .ruby{color:var(--sub);font-size:12px}
  .dhead .meta{color:var(--sub);font-size:13px;margin-top:2px}
  .down{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:12px 0 4px;padding:8px 10px;border:1px solid var(--line);border-radius:10px}
  .down .np{visibility:visible;padding:0;gap:4px}
  .down .np span{cursor:pointer;padding:4px 10px;font-size:13px}
  .dcols{display:grid;grid-template-columns:minmax(0,300px) minmax(0,1fr);gap:18px;margin-top:12px}
  .dart img{width:100%;border-radius:8px;display:block;background:#0002;min-height:200px}
  .dart .asc{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
  .dart .asc span{font-size:12px;padding:2px 8px;border:1px solid var(--line);border-radius:6px;cursor:pointer}
  .dart .asc span.on{background:var(--accent);border-color:var(--accent);color:#fff}
  .dbox h3{font-size:15px;margin:16px 0 6px;padding-bottom:4px;border-bottom:1px solid var(--line)}
  .dcols h3:first-child{margin-top:0}
  table.kv{border-collapse:collapse;font-size:13px;width:100%}
  table.kv th,table.kv td{border:1px solid var(--line);padding:4px 6px;text-align:left;vertical-align:top}
  table.kv th{background:#8881;white-space:nowrap;font-weight:600;width:1%}
  .sk{display:flex;gap:10px;padding:8px 0;border-bottom:1px dashed var(--line)}
  .sk:last-child{border-bottom:none}
  .sk img{width:40px;height:40px;flex:none}
  .sk .t{font-weight:600;font-size:14px}
  .sk .t small{font-weight:400;color:var(--sub);margin-left:6px}
  .sk .d{font-size:13px;margin-top:3px;white-space:pre-wrap}
  .vals{font-size:12px;color:var(--sub);margin-top:4px;overflow-x:auto}
  .vals table{border-collapse:collapse}
  .vals td{border:1px solid var(--line);padding:1px 5px;white-space:nowrap}
  .vals td:first-child{color:var(--text)}
  .tag{display:inline-block;font-size:11px;padding:0 6px;border-radius:4px;background:var(--accent);color:#fff;margin-left:6px;vertical-align:middle}
  .card-q{color:#2a7de1;font-weight:700}.card-a{color:#1f9d55;font-weight:700}.card-b{color:#d33;font-weight:700}
  .prof{font-size:13px;white-space:pre-wrap;line-height:1.6;padding:8px 0;border-bottom:1px dashed var(--line)}
  .prof .cond{display:block;color:var(--sub);font-size:12px}
  details.older{margin:2px 0 6px 50px;font-size:13px}
  details.older summary{cursor:pointer;color:var(--sub);font-size:12px}
  details.older .sk{opacity:.8}
  .dlink{color:var(--accent);cursor:pointer;text-decoration:underline}
  .dfoot{margin-top:14px;font-size:12px;color:var(--sub)}
  .dfoot a{color:var(--sub)}
  @media (max-width:700px){.dcols{grid-template-columns:1fr}.dart{max-width:320px;margin:0 auto}#dlg{padding:0}.dbox{border-radius:0;min-height:100%}}
  @media (max-width:600px){header{position:static}main{grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:7px}.item .nm{font-size:11px}}
</style>
<style>
  .item .img{aspect-ratio:5/7}
  .item img{object-position:50% 12%}
  .el{display:inline-block;font-size:10px;font-weight:700;border-radius:4px;padding:0 4px;line-height:15px;color:#fff}
  .el-Fire{background:#e0503c}.el-Water{background:#2f8fe0}.el-Wind{background:#2fb37a}.el-Iron{background:#c9902a}.el-Electronic{background:#a05ce0}
  .bu{display:inline-block;font-size:10px;font-weight:700;border-radius:4px;padding:0 4px;line-height:15px;background:#333c;color:#fff}
  .item .tags{position:absolute;left:3px;bottom:3px;display:flex;gap:2px;flex-wrap:wrap;max-width:70%}
  .item .rar.R{color:#9cc8ff}.item .rar.SR{color:#d39bff}
  .lb{display:flex;align-items:center;gap:3px;padding:4px 4px 5px;visibility:hidden}
  .item.own .lb{visibility:visible}
  .lb b{flex:1;text-align:center;font-size:12px;border:1px solid var(--line);border-radius:4px;padding:1px 0}
  .lb span{width:22px;text-align:center;font-size:13px;border:1px solid var(--line);border-radius:4px;cursor:pointer;line-height:18px}
  .lb span:hover{border-color:var(--accent)}
  .item.np5 .lb b{background:var(--gold);border-color:var(--gold);color:#fff}
  .tr{position:absolute;left:4px;top:22px;background:#d4a017;color:#fff;font-size:10px;padding:0 4px;border-radius:4px}
  .down .np span.core{min-width:34px}
  .down .grp{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
  .down .grp>small{color:var(--sub)}
  .dhead img{object-fit:cover;object-position:50% 10%}
  .dart img{background:#8882}
  .skc{color:#2f8fe0;font-weight:600}
  .sk .t .cd{font-weight:400;color:var(--sub);font-size:12px;margin-left:6px}
  .lvsel{font-size:13px;color:var(--sub);display:flex;gap:6px;align-items:center;margin:4px 0}
  .fav{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
  #favOut{max-width:1300px;margin:0 auto;padding:14px}
  #favOut[hidden]{display:none}
  .fv{background:var(--card);border:2px solid var(--line);border-radius:10px;padding:8px;display:flex;gap:8px}
  .fv.own{border-color:var(--ok)}
  .fv img{width:64px;height:64px;flex:none;border-radius:8px;background:#8882}
  .fv .t{font-weight:600;font-size:13px}
  .fv .s{font-size:12px;color:var(--sub)}
  .fv .np{visibility:visible;flex-wrap:wrap;padding:4px 0 0}
  .fv .np span{cursor:pointer;flex:none;min-width:26px;padding:1px 4px}
  .tm-mem{width:92px}
  .tm-mem img{width:72px;height:100px;object-fit:cover;object-position:50% 10%}
  .tm-alt{font-size:12px;color:var(--sub);margin-top:6px}
  #teamOut{grid-template-columns:repeat(auto-fill,minmax(500px,1fr))}
  @media (max-width:600px){#teamOut{grid-template-columns:1fr}.tm-mems{overflow-x:auto}}
</style>
</head>
<body>
<header><div class="wrap">
  <div class="top">
    <a class="back" href="../">← Portal</a>
    <h1>勝利女神：妮姬 收藏管理</h1>
    <span class="sp"></span>
    <button class="btn" id="btnExport">匯出</button>
    <button class="btn" id="btnImport">匯入</button>
    <button class="btn" id="btnRefresh">更新資料</button>
    <input type="file" id="fileImport" accept=".json,application/json" hidden>
  </div>
  <div class="tabs">
    <div class="tab on" data-tab="nikke">妮姬</div>
    <div class="tab" data-tab="fav">收藏品</div>
    <div class="tab" data-tab="team">爆裂組隊</div>
  </div>
  <div id="listCtl">
    <div class="filters">
      <input type="search" id="q" placeholder="搜尋妮姬名字">
      <select id="fOwn">
        <option value="all">全部</option>
        <option value="own">持有</option>
        <option value="not">未持有</option>
        <option value="max">已滿（SSR 核心+7）</option>
        <option value="notmax">持有但未滿</option>
        <option value="fav">有收藏品的妮姬</option>
      </select>
      <select id="fSort">
        <option value="def">官方順序</option>
        <option value="new">新→舊</option>
        <option value="old">舊→新</option>
        <option value="name">名字順</option>
      </select>
    </div>
    <div class="chips" id="chipRar"></div>
    <div class="chips" id="chipBurst"></div>
    <div class="chips" id="chipEl"></div>
    <div class="chips" id="chipCls"></div>
    <div class="chips" id="chipWp"></div>
    <div class="chips" id="chipCorp"></div>
    <div class="stats" id="stats"></div>
  </div>
  <div id="favCtl" hidden><div class="stats" id="favInfo"></div></div>
  <div id="teamCtl" hidden>
    <div class="filters">
      <label>敵人代碼 <select id="tmEl"><option value="">不指定</option></select></label>
      <label><input type="checkbox" id="tmHeal" checked> 至少 1 位補師／坦克</label>
      <label><input type="checkbox" id="tmSSR"> 只用 SSR</label>
    </div>
    <div class="stats" id="teamInfo"></div>
  </div>
</div></header>
<main id="grid"><div class="msg">讀取資料中…</div></main>
<section id="favOut" hidden></section>
<section id="teamOut" hidden></section>
<div id="dlg"><div class="dbox"><button class="dclose" title="關閉">×</button><div id="dbody"></div></div></div>
<footer>資料與圖片來自官方 <a href="https://www.blablalink.com/shiftyspad/nikke-list" target="_blank" rel="noopener">Blablalink ShiftyPad 妮姬圖鑑</a>（繁體中文），著作權屬 SHIFT UP / Level Infinite 所有。點圖片看詳細資料，點右下圓圈打勾持有，下方 −／＋ 調整突破與核心強化。持有紀錄存在此瀏覽器，換裝置請用「匯出／匯入」。</footer>

<script>
const CDN = 'https://sg-tools-cdn.blablalink.com/';
const LOC = 'zh-tw';
const SAVE_KEY = 'nikke_owned_v1';
const CACHE_KEY = 'nikke_data_v1';
const FAV_KEY = 'nikke_fav_v1';
const RAR = ['SSR', 'SR', 'R'];
const EL = {Fire:'燃燒', Water:'水冷', Wind:'風壓', Iron:'鐵甲', Electronic:'電擊'};
const EL_ORDER = ['Fire', 'Water', 'Wind', 'Iron', 'Electronic'];
const STRONG = {Fire:'Wind', Water:'Fire', Wind:'Iron', Iron:'Electronic', Electronic:'Water'};   // 對誰造成額外傷害
const CLS = {Attacker:'火力型', Defender:'防禦型', Supporter:'輔助型'};
const WP = {AR:'突擊步槍', SMG:'衝鋒槍', SG:'霰彈槍', SR:'狙擊步槍', RL:'火箭發射器', MG:'機槍'};
const CORP = {ELYSION:'極樂淨土', MISSILIS:'米西利斯', TETRA:'泰特拉', PILGRIM:'朝聖者', ABNORMAL:'異常'};
const BURST = {Step1:'Ⅰ', Step2:'Ⅱ', Step3:'Ⅲ', AllStep:'全'};

function esc(s){ return String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

/* ---- 官方 CDN 路徑混淆：資料夾＝djb2 雜湊兩碼，檔名＝md5(完整路徑)（照 blablalink 前端的 createNormalObfuscatedPath） ---- */
function md5(str){
  function add(x, y){ const l = (x & 0xFFFF) + (y & 0xFFFF); return (((x >> 16) + (y >> 16) + (l >> 16)) << 16) | (l & 0xFFFF); }
  function rol(n, c){ return (n << c) | (n >>> (32 - c)); }
  const s = unescape(encodeURIComponent(str)), n = s.length, x = [];
  for (let i = 0; i < n; i++) x[i >> 2] |= s.charCodeAt(i) << ((i % 4) * 8);
  x[n >> 2] |= 0x80 << ((n % 4) * 8); x[(((n + 8) >>> 6) << 4) + 14] = n * 8;
  for (let i = 0; i < x.length; i++) x[i] = x[i] | 0;
  let a = 1732584193, b = -271733879, c = -1732584194, d = 271733878;
  const S = [7, 12, 17, 22, 5, 9, 14, 20, 4, 11, 16, 23, 6, 10, 15, 21], T = [];
  for (let i = 0; i < 64; i++) T[i] = (Math.abs(Math.sin(i + 1)) * 4294967296) | 0;
  for (let k = 0; k < x.length; k += 16){
    const A = a, B = b, C = c, D = d;
    for (let i = 0; i < 64; i++){
      const r = i >> 4; let f, g;
      if (r === 0){ f = (b & c) | (~b & d); g = i; } else if (r === 1){ f = (b & d) | (c & ~d); g = (5 * i + 1) % 16; }
      else if (r === 2){ f = b ^ c ^ d; g = (3 * i + 5) % 16; } else { f = c ^ (b | ~d); g = (7 * i) % 16; }
      const tmp = d; d = c; c = b; b = add(b, rol(add(add(a, f), add(T[i], x[k + g] | 0)), S[r * 4 + i % 4])); a = tmp;
    }
    a = add(a, A); b = add(b, B); c = add(c, C); d = add(d, D);
  }
  let o = ''; const w = [a, b, c, d];
  for (let i = 0; i < 16; i++) o += ((w[i >> 2] >>> ((i % 4) * 8)) & 255).toString(16).padStart(2, '0');
  return o;
}
const NK_P = [224737, 1000639, 2654435761, 2654435769, 1000621, 4294967291];
function djb(s, m){ let h = m; for (let i = 0; i < s.length; i++) h = h * 33 + s.charCodeAt(i) & 4294967295; return h; }
function two(s, m){ const r = (djb(s, m) % m + m) % m; return String.fromCharCode(97 + Math.floor(r / 26) % 26, 97 + r % 26) + '-' + String(r % 99).padStart(2, '0'); }
const urlCache = {};
function res(p){
  if (urlCache[p]) return urlCache[p];
  p = p.replace(/^\//, ''); const seg = p.split('/').filter(Boolean);
  return urlCache[p] = CDN + seg.map((s, i) => i === seg.length - 1 ? md5(p) + '.' + s.split('.').slice(1).join('.') : two(p, NK_P[i])).join('/');
}
async function getJson(p){ const r = await fetch(res(p)); if (!r.ok) throw new Error(`HTTP ${r.status}（${p}）`); return r.json(); }
const pad = (n, k) => String(n).padStart(k, '0');
const cKey = (rid, skin) => `c${pad(rid, 3)}_${pad(skin || 0, 2)}`;
const miUrl = (x, skin) => res(`character/mi/mi_${cKey(x.rid, skin)}_s.webp`);
const siUrl = (x, skin) => res(`character/si/si_${cKey(x.rid, skin)}_s.webp`);
const fullUrl = (x, skin) => res(`character/full/${cKey(x.rid, skin)}.webp`);
const favIcon = f => res(`icon/favoriteitem/${f.icon}.webp`);

/* ---- 持有等級：1＝0★ … SSR 4＝3★、5〜11＝核心 +1〜+7；SR 最多 2★；R 不能突破 ---- */
function maxLv(x){ return x.r === 'SSR' ? 11 : x.r === 'SR' ? 3 : 1; }
function lvLabel(x, v){ return v <= 4 ? (v - 1) + '★' : '核心+' + (v - 4); }
function lvShort(x, v){ return v <= 4 ? (v - 1) + '★' : '核+' + (v - 4); }

let data = null;    // {list, time}
let favs = null;    // {list, time}
let owned = {n:{}, f:{}};
try{ const o = JSON.parse(localStorage.getItem(SAVE_KEY)); if (o && o.n) owned = {n:o.n, f:o.f || {}}; }catch(e){}
function saveOwned(){ try{ localStorage.setItem(SAVE_KEY, JSON.stringify(owned)); }catch(e){ alert('儲存失敗：' + e.message); } }
const F = {r:new Set(), b:new Set(), e:new Set(), c:new Set(), w:new Set(), o:new Set()};

async function fetchData(){
  const L = await getJson(`character/${LOC}/nikke_list_zh-TW_v2.json`);
  const list = L.filter(x => x.is_visible !== false).map((x, i) => ({
    id:x.id, rid:x.resource_id, nc:x.name_code, name:x.name_localkey.name, r:x.original_rare, cls:x.class, b:x.use_burst_skill,
    corp:x.corporation, el:x.element_id.element.element, wp:x.shot_id.element.weapon_type, ord:i,
    skins:(x.costumes || []).map(c => c.costume_index).filter(n => n > 0).sort((a, b) => a - b)
  }));
  const d = {list, time:Date.now()};
  try{ localStorage.setItem(CACHE_KEY, JSON.stringify(d)); }catch(e){}
  return d;
}
async function pool(items, n, fn){
  const out = []; let i = 0;
  await Promise.all(Array.from({length:n}, async () => { while (i < items.length){ const k = i++; try{ out[k] = await fn(items[k]); }catch(e){ out[k] = null; } } }));
  return out;
}
async function fetchFavs(){
  const map = await getJson('equip/favorite_rare_map.json');
  const ids = [...(map.SSR || []), ...(map.SR || []), ...(map.R || [])];
  const raw = await pool(ids, 4, id => getJson(`equip/${LOC}/favorite_${id}.json`));
  const list = raw.filter(Boolean).map(f => ({
    id:f.id, name:f.name_localkey, desc:f.description_localkey, r:f.favorite_rare, type:f.favorite_type, wp:f.weapon_type,
    nc:f.name_code, max:f.max_level, icon:f.icon_resource_id,
    stat:{atk:f.atk, hp:f.hp, def:f.def},
    col:(f.collection_skill_group_data || []).map(s => ({name:s.name_localkey, d:s.description_localkey, v:(s.description_value_list || []).map(v => v.description_value || [])})),
    sk:(f.favoriteitem_skill_group_data || []).map(s => ({slot:s.skill_change_slot, name:s.info.name_localkey, kind:s.info.info_description_localkey, d:s.info.description_localkey, v:(s.info.description_value_list || []).map(v => v.description_value || [])}))
  }));
  favs = {list, time:Date.now()};
  try{ localStorage.setItem(FAV_KEY, JSON.stringify(favs)); }catch(e){}
  return favs;
}
async function ensureFavs(){
  if (!favs){ try{ favs = JSON.parse(localStorage.getItem(FAV_KEY)); }catch(e){ favs = null; } }
  if (!favs || Date.now() - favs.time > 86400000){ try{ await fetchFavs(); }catch(e){ if (!favs) throw e; } }
  return favs;
}
const favOf = x => favs && favs.list.find(f => f.type === 'Favorite' && f.nc === x.nc);

async function init(){
  try{ data = JSON.parse(localStorage.getItem(CACHE_KEY)); }catch(e){ data = null; }
  try{ favs = JSON.parse(localStorage.getItem(FAV_KEY)); }catch(e){ favs = null; }
  if (data){ buildChips(); render(); }
  if (!data || Date.now() - data.time > 86400000){
    try{
      const fresh = await fetchData();
      const changed = !data || fresh.list.length !== data.list.length;
      data = fresh;
      if (changed){ buildChips(); render(); }
    }catch(err){
      if (!data) document.getElementById('grid').innerHTML = '<div class="msg">資料讀取失敗：' + esc(err.message) + '<br>請確認網路後按「更新資料」。</div>';
    }
  }
  ensureFavs().then(() => { if (data) render(); }).catch(() => {});
  if (!curDetail) routeHash();
  if (location.hash === '#team') document.querySelector('.tab[data-tab="team"]').click();
}

function elTag(e){ return `<span class="el el-${e}">${EL[e] || e}</span>`; }
function buTag(b){ return `<span class="bu">${BURST[b] || '?'}</span>`; }
function buildChips(){
  const L = data.list;
  const mk = (id, k, vals, lab) => document.getElementById(id).innerHTML = vals.map(v => `<span class="chip${F[k].has(v) ? ' on' : ''}" data-k="${k}" data-v="${v}">${lab(v)}</span>`).join('');
  mk('chipRar', 'r', RAR.filter(r => L.some(x => x.r === r)), v => v);
  mk('chipBurst', 'b', ['Step1', 'Step2', 'Step3', 'AllStep'].filter(b => L.some(x => x.b === b)), v => '爆裂 ' + BURST[v]);
  mk('chipEl', 'e', EL_ORDER.filter(e => L.some(x => x.el === e)), v => elTag(v));
  mk('chipCls', 'c', Object.keys(CLS), v => CLS[v]);
  mk('chipWp', 'w', Object.keys(WP).filter(w => L.some(x => x.wp === w)), v => WP[v]);
  mk('chipCorp', 'o', Object.keys(CORP).filter(c => L.some(x => x.corp === c)), v => CORP[v]);
}
function filtered(){
  const q = document.getElementById('q').value.trim().toLowerCase();
  const fo = document.getElementById('fOwn').value, so = document.getElementById('fSort').value;
  const list = data.list.filter(x => {
    if (F.r.size && !F.r.has(x.r)) return false;
    if (F.b.size && !F.b.has(x.b)) return false;
    if (F.e.size && !F.e.has(x.el)) return false;
    if (F.c.size && !F.c.has(x.cls)) return false;
    if (F.w.size && !F.w.has(x.wp)) return false;
    if (F.o.size && !F.o.has(x.corp)) return false;
    if (q && !x.name.toLowerCase().includes(q)) return false;
    const v = owned.n[x.id] || 0;
    if (fo === 'own' && !v) return false;
    if (fo === 'not' && v) return false;
    if (fo === 'max' && !(v && v >= maxLv(x))) return false;
    if (fo === 'notmax' && !(v && v < maxLv(x))) return false;
    if (fo === 'fav' && !favOf(x)) return false;
    return true;
  });
  if (so === 'new') list.sort((a, b) => b.rid - a.rid);
  else if (so === 'old') list.sort((a, b) => a.rid - b.rid);
  else if (so === 'name') list.sort((a, b) => a.name.localeCompare(b.name, 'zh-Hant'));
  else list.sort((a, b) => a.ord - b.ord);
  return list;
}
function cardHTML(x){
  const v = owned.n[x.id] || 0, f = favOf(x), fv = f && owned.f[f.id];
  return `<div class="item${v ? ' own' : ''}${v && v >= maxLv(x) && x.r === 'SSR' ? ' np5' : ''}" data-id="${x.id}">
    <div class="img"><img loading="lazy" src="${miUrl(x, 0)}" alt="">
      <span class="rar ${x.r}">${x.r}</span>${fv ? `<span class="tr" title="收藏品 Phase ${fv}">寶${fv}</span>` : ''}
      <span class="tags">${buTag(x.b)}${elTag(x.el)}</span><span class="chk">✓</span></div>
    <div class="nm" title="${esc(x.name)}">${esc(x.name)}</div>
    <div class="cls">${CLS[x.cls] || ''}・${x.wp}</div>
    <div class="lb">${maxLv(x) > 1 ? `<span data-step="-1">−</span><b>${lvShort(x, v || 1)}</b><span data-step="1">＋</span>` : '<b>0★</b>'}</div></div>`;
}
function render(){
  if (!data) return;
  const list = filtered();
  const g = document.getElementById('grid');
  g.innerHTML = list.length ? list.map(cardHTML).join('') : '<div class="msg">沒有符合的項目</div>';
  renderStats(list.length);
}
function renderStats(shown){
  const L = data.list, own = L.filter(x => owned.n[x.id]);
  let h = `<span>持有 <b>${own.length}</b> / ${L.length}（${(own.length / L.length * 100).toFixed(1)}%）</span>`;
  h += RAR.map(r => `<span>${r} <b>${own.filter(x => x.r === r).length}</b>/${L.filter(x => x.r === r).length}</span>`).join('');
  h += `<span>SSR 3★以上 <b>${own.filter(x => x.r === 'SSR' && owned.n[x.id] >= 4).length}</b></span><span>核心+7 <b>${own.filter(x => x.r === 'SSR' && owned.n[x.id] >= 11).length}</b></span><span>顯示中 ${shown}</span>`;
  if (data.time) h += `<span>資料：${new Date(data.time).toLocaleString()}</span>`;
  document.getElementById('stats').innerHTML = h;
}
function setOwn(id, v){
  const x = data.list.find(s => s.id === id);
  v = Math.max(0, Math.min(maxLv(x), v));
  if (v) owned.n[id] = v; else delete owned.n[id];
  saveOwned();
  const el = document.querySelector(`#grid .item[data-id="${id}"]`);
  if (el){ const tmp = document.createElement('div'); tmp.innerHTML = cardHTML(x); el.replaceWith(tmp.firstElementChild); }
  renderStats(document.querySelectorAll('#grid .item').length);
}
function setFav(fid, v){
  if (v) owned.f[fid] = v; else delete owned.f[fid];
  saveOwned();
}
document.getElementById('grid').addEventListener('click', ev => {
  const el = ev.target.closest('.item'); if (!el) return;
  const id = +el.dataset.id, st = ev.target.closest('[data-step]');
  if (st){ if (owned.n[id]) setOwn(id, owned.n[id] + +st.dataset.step); }
  else if (ev.target.closest('.chk')) setOwn(id, owned.n[id] ? 0 : 1);
  else if (ev.target.closest('.lb')) {}
  else { pushedHash = true; location.hash = 'n-' + id; }
});

/* ===== 收藏品 ===== */
function favLvLabel(f, v){ return f.type === 'Favorite' ? 'Phase ' + v : 'Lv' + (v - 1); }
function favCard(f){
  const v = owned.f[f.id] || 0, x = f.nc && data && data.list.find(s => s.nc === f.nc);
  const n = f.max + 1;
  return `<div class="fv${v ? ' own' : ''}" data-fid="${f.id}"><img loading="lazy" src="${favIcon(f)}" alt=""><div style="flex:1;min-width:0">
    <div class="t">${esc(f.name)}</div>
    <div class="s">${f.r}・${WP[f.wp] || f.wp}${x ? `・<span class="dlink" data-goto="n-${x.id}">${esc(x.name)}</span> 專屬` : '・通用'}</div>
    <div class="np"><span data-fv="0" class="${v ? '' : 'on'}">無</span>${Array.from({length:n}, (_, i) => `<span data-fv="${i + 1}" class="${v === i + 1 ? 'on' : ''}">${f.type === 'Favorite' ? 'P' + (i + 1) : i}</span>`).join('')}</div>
  </div></div>`;
}
async function renderFav(){
  const out = document.getElementById('favOut'), info = document.getElementById('favInfo');
  if (!favs) out.innerHTML = '<div class="msg">讀取收藏品資料中…</div>';
  try{ await ensureFavs(); }catch(err){ out.innerHTML = `<div class="msg">收藏品讀取失敗：${esc(err.message)}</div>`; return; }
  const ssr = favs.list.filter(f => f.type === 'Favorite'), col = favs.list.filter(f => f.type !== 'Favorite');
  info.innerHTML = `SSR 專屬收藏品 持有 <b>${ssr.filter(f => owned.f[f.id]).length}</b>/${ssr.length}（Phase 1〜3，會替換該妮姬的技能）｜R／SR 收藏品（依武器種類通用，Lv0〜15）`;
  out.innerHTML = `<h3>SSR 專屬收藏品</h3><div class="fav">${ssr.map(favCard).join('')}</div><h3>R／SR 收藏品</h3><div class="fav">${col.map(favCard).join('')}</div>`;
}
document.getElementById('favOut').addEventListener('click', ev => {
  const g = ev.target.closest('[data-goto]'); if (g){ pushedHash = true; location.hash = g.dataset.goto; return; }
  const s = ev.target.closest('[data-fv]'); if (!s) return;
  const box = s.closest('[data-fid]'), f = favs.list.find(z => z.id === +box.dataset.fid);
  setFav(f.id, +s.dataset.fv);
  const tmp = document.createElement('div'); tmp.innerHTML = favCard(f); box.replaceWith(tmp.firstElementChild);
});

/* ===== 詳細資料 ===== */
const roleCache = {};
let curDetail = null, pushedHash = false, skLv = 10;
function getRole(x){ return roleCache[x.rid] || (roleCache[x.rid] = getJson(`roledata/${x.rid}-v2-${LOC}.json`).catch(e => { delete roleCache[x.rid]; throw e; })); }
function ownBarHTML(x){
  const v = owned.n[x.id] || 0, f = favOf(x), fv = f ? owned.f[f.id] || 0 : 0;
  let h = `<label style="display:flex;align-items:center;gap:6px;cursor:pointer;font-weight:600"><input type="checkbox" id="downChk" ${v ? 'checked' : ''}> 持有</label>`;
  if (v && maxLv(x) > 1) h += `<div class="grp"><small>突破</small><div class="np">${Array.from({length:Math.min(4, maxLv(x))}, (_, i) => `<span data-dnp="${i + 1}" class="${v === i + 1 ? 'on' : ''}">${i}★</span>`).join('')}</div></div>`;
  if (v && x.r === 'SSR') h += `<div class="grp"><small>核心強化</small><div class="np">${[1, 2, 3, 4, 5, 6, 7].map(c => `<span class="core${v === c + 4 ? ' on' : ''}" data-dnp="${c + 4}">+${c}</span>`).join('')}</div></div>`;
  if (f) h += `<div class="grp"><small>收藏品「${esc(f.name)}」</small><div class="np"><span data-dfv="0" class="${fv ? '' : 'on'}">無</span>${Array.from({length:f.max + 1}, (_, i) => `<span data-dfv="${i + 1}" class="${fv === i + 1 ? 'on' : ''}">P${i + 1}</span>`).join('')}</div></div>`;
  return h;
}
function headHTML(x){
  return `<div class="dhead"><img src="${siUrl(x, 0)}" alt=""><div>
    <h2>${esc(x.name)}</h2>
    <div class="meta">${x.r}｜爆裂 ${BURST[x.b]}｜${elTag(x.el)}｜${CLS[x.cls] || x.cls}｜${WP[x.wp] || x.wp}｜${CORP[x.corp] || x.corp}</div></div></div>
    <div class="down" id="down">${ownBarHTML(x)}</div>`;
}
const fmt = n => n == null ? '-' : Number(n).toLocaleString();
function gameText(s){
  return esc(s || '').replace(/&lt;color=#?([0-9A-Fa-f]{6})&gt;/g, '<span class="skc">').replace(/&lt;\/color&gt;/g, '</span>')
    .replace(/&lt;word_group=\d+&gt;/g, '').replace(/&lt;\/word_group&gt;/g, '').replace(/\\n/g, '\n');
}
function skillText(d, vals, lv){
  return gameText(d).replace(/\{description_value_(\d+)\}/g, (m, n) => { const a = vals[+n - 1] || []; return a[Math.min(lv, a.length) - 1] ?? a[a.length - 1] ?? '?'; });
}
function shotText(s){ return gameText(s.description_localkey).replace(/\{(\w+)\}/g, (m, k) => typeof s[k] === 'number' ? String(s[k] / 100) : m); }
function skillBlock(kind, name, html, extra){
  return `<div class="sk"><div style="flex:1"><div class="t">${esc(name)}<small>${esc(kind)}</small>${extra ? `<span class="cd">${extra}</span>` : ''}</div><div class="d">${html}</div></div></div>`;
}
function skillsHTML(x, d){
  const lv = skLv, f = favOf(x), fv = f ? owned.f[f.id] || 0 : 0;
  const repl = {};
  if (f && fv) f.sk.forEach(s => { repl[s.slot === 3 ? 'u' : s.slot] = s; });
  const sv = s => (s.description_value_list || []).map(v => v.description_value || []);
  const s1 = d.skill1_detail, s2 = d.skill2_detail, u = d.ulti_skill_detail;
  const blk = (key, kind, s, extra) => repl[key]
    ? skillBlock(kind + '（收藏品強化）', repl[key].name, skillText(repl[key].d, repl[key].v, lv), extra)
    : s ? skillBlock(kind, s.name_localkey, skillText(s.description_localkey, sv(s), lv), extra) : '';
  let h = `<div class="lvsel">技能等級 <select id="skLv">${[1, 4, 7, 10].map(n => `<option value="${n}"${n === lv ? ' selected' : ''}>Lv.${n}</option>`).join('')}</select>${f ? (fv ? `<span>已套用收藏品技能（以最終 Phase 的版本顯示）</span>` : '<span>（持有收藏品後技能會強化／替換，在上方設定 Phase）</span>') : ''}</div>`;
  if (d.shot_detail) h += skillBlock('普通攻擊', d.shot_detail.name_localkey, shotText(d.shot_detail), `彈匣 ${fmt(d.shot_detail.max_ammo)}・換彈 ${(d.shot_detail.reload_time / 100).toFixed(2)} 秒`);
  h += blk(1, '技能 1', s1) + blk(2, '技能 2', s2);
  const cdl = u && (u.skill_cooltime_list || [])[lv - 1] || (u && u.skill_cooltime);
  h += blk('u', '爆裂技能', u, cdl ? `冷卻 ${cdl / 100} 秒` : '');
  return h;
}
function statRows(d){
  const H = d.character_level_hp_list || [], A = d.character_level_attack_list || [], D = d.character_level_defence_list || [];
  return [1, 80, 160, 200, 400, 600, 800, 1000].filter(l => l <= H.length).map(l => `<tr><th>Lv.${l}</th><td>${fmt(H[l - 1])}</td><td>${fmt(A[l - 1])}</td><td>${fmt(D[l - 1])}</td></tr>`).join('');
}
function detailHTML(x, d){
  const skins = [0, ...x.skins];
  const cos = (d.character_costume_list || []);
  const skinName = k => k === 0 ? '原始' : (cos.find(c => c.costume_index === k) || {}).costume_name_locale || '時裝 ' + k;
  const f = favOf(x);
  let h = `<div class="dcols"><div class="dart"><img id="dimg" src="${fullUrl(x, 0)}" alt="">
    <div class="asc">${skins.map(k => `<span data-skin="${k}" class="${k === 0 ? 'on' : ''}">${esc(skinName(k))}</span>`).join('')}</div></div><div>
    <div class="prof">${gameText(d.description_localkey)}</div>
    <table class="kv" style="margin-top:8px">
      <tr><th>所屬</th><td>${esc(CORP[x.corp] || x.corp)}${d.squad_detail ? '・' + esc(d.squad_detail.squad_name) : ''}</td></tr>
      <tr><th>屬性代碼</th><td>${elTag(x.el)} 對<b>${EL[STRONG[x.el]]}</b>代碼敵人有效</td></tr>
      <tr><th>爆裂</th><td>${BURST[x.b]}${d.ulti_skill_detail ? `（冷卻 ${d.ulti_skill_detail.skill_cooltime / 100} 秒）` : ''}</td></tr>
      <tr><th>暴擊</th><td>率 ${(d.critical_ratio || 0) / 100}%・傷害 ${(d.critical_damage || 0) / 100}%</td></tr>
      <tr><th>CV</th><td>${esc((d.cv_localkey_ja || '').replace(/^CV：/, ''))}${d.cv_localkey_ko ? '（韓：' + esc(d.cv_localkey_ko.replace(/^CV：/, '')) + '）' : ''}</td></tr>
    </table>
    <h3>基礎能力值（未含突破／核心／裝備）</h3>
    <table class="kv"><tr><th></th><th>體力</th><th>攻擊力</th><th>防禦力</th></tr>${statRows(d)}</table>
    </div></div>
    <h3>技能</h3><div id="skBox">${skillsHTML(x, d)}</div>`;
  if (f) h += `<h3>專屬收藏品：${esc(f.name)}</h3><div class="prof">${gameText(f.desc)}</div>` +
    f.col.map(s => skillBlock('收藏品效果（Phase 3）', s.name, skillText(s.d, s.v, 4))).join('');
  h += `<div class="dfoot">資料來源：<a href="https://www.blablalink.com/shiftyspad/nikke-list" target="_blank" rel="noopener">Blablalink ShiftyPad</a>（ID ${x.id}）</div>`;
  return h;
}
async function openDetail(id){
  const x = data && data.list.find(s => s.id === id);
  if (!x){ closeDetail(); return; }
  curDetail = {id};
  document.getElementById('dlg').classList.add('on');
  document.body.classList.add('lock');
  document.getElementById('dbody').innerHTML = headHTML(x) + '<p style="color:var(--sub)">讀取中…</p>';
  document.getElementById('dlg').scrollTop = 0;
  try{
    await ensureFavs().catch(() => {});
    const d = await getRole(x);
    if (!curDetail || curDetail.id !== id) return;
    curDetail.d = d;
    document.getElementById('dbody').innerHTML = headHTML(x) + detailHTML(x, d);
  }catch(err){
    if (curDetail && curDetail.id === id) document.getElementById('dbody').innerHTML = headHTML(x) + `<p>詳細資料讀取失敗：${esc(err.message)}</p>`;
  }
}
function closeDetail(){ curDetail = null; document.getElementById('dlg').classList.remove('on'); document.body.classList.remove('lock'); }
function hideDetail(){
  if (pushedHash){ pushedHash = false; history.back(); }
  else { history.replaceState(null, '', location.pathname + location.search); closeDetail(); }
}
function routeHash(){
  const m = location.hash.match(/^#n-(\d+)$/);
  if (m && data) openDetail(+m[1]); else closeDetail();
}
window.addEventListener('hashchange', routeHash);
document.querySelector('.dclose').addEventListener('click', hideDetail);
document.addEventListener('keydown', ev => { if (ev.key === 'Escape' && curDetail) hideDetail(); });
function refreshDetailOwn(x){
  document.getElementById('down').innerHTML = ownBarHTML(x);
  if (curDetail && curDetail.d){ const b = document.getElementById('skBox'); if (b) b.innerHTML = skillsHTML(x, curDetail.d); }
}
document.getElementById('dlg').addEventListener('click', ev => {
  if (ev.target.id === 'dlg'){ hideDetail(); return; }
  const x = curDetail && data.list.find(s => s.id === curDetail.id);
  if (!x) return;
  const sk = ev.target.closest('[data-skin]');
  if (sk){
    document.getElementById('dimg').src = fullUrl(x, +sk.dataset.skin);
    sk.parentNode.querySelectorAll('span').forEach(s => s.classList.toggle('on', s === sk));
    return;
  }
  const np = ev.target.closest('[data-dnp]');
  if (np){ setOwn(x.id, +np.dataset.dnp); refreshDetailOwn(x); return; }
  const fv = ev.target.closest('[data-dfv]');
  if (fv){ const f = favOf(x); setFav(f.id, +fv.dataset.dfv); setOwn(x.id, owned.n[x.id] || 0); refreshDetailOwn(x); }
});
document.getElementById('dlg').addEventListener('change', ev => {
  const x = curDetail && data.list.find(s => s.id === curDetail.id); if (!x) return;
  if (ev.target.id === 'downChk'){ setOwn(x.id, ev.target.checked ? 1 : 0); refreshDetailOwn(x); }
  if (ev.target.id === 'skLv'){ skLv = +ev.target.value; document.getElementById('skBox').innerHTML = skillsHTML(x, curDetail.d); }
});

/* ===== 分頁、篩選、匯出入 ===== */
document.querySelectorAll('.tab').forEach(t => t.addEventListener('click', () => {
  document.querySelectorAll('.tab').forEach(x => x.classList.toggle('on', x === t));
  const tab = t.dataset.tab;
  document.getElementById('listCtl').hidden = tab !== 'nikke';
  document.getElementById('grid').hidden = tab !== 'nikke';
  document.getElementById('favCtl').hidden = tab !== 'fav';
  document.getElementById('favOut').hidden = tab !== 'fav';
  document.getElementById('teamCtl').hidden = tab !== 'team';
  document.getElementById('teamOut').hidden = tab !== 'team';
  window.scrollTo(0, 0);
  if (tab === 'team'){ if (data) TEAM.render(); }
  else if (tab === 'fav'){ if (data) renderFav(); }
  else if (data) render();
}));
document.querySelectorAll('#listCtl .chips').forEach(box => box.addEventListener('click', ev => {
  const c = ev.target.closest('.chip'); if (!c) return;
  const k = c.dataset.k, v = c.dataset.v;
  F[k].has(v) ? F[k].delete(v) : F[k].add(v);
  c.classList.toggle('on'); render();
}));
let qTimer;
document.getElementById('q').addEventListener('input', () => { clearTimeout(qTimer); qTimer = setTimeout(render, 150); });
['fOwn', 'fSort'].forEach(id => document.getElementById(id).addEventListener('change', render));
document.getElementById('btnRefresh').addEventListener('click', async () => {
  const b = document.getElementById('btnRefresh');
  b.disabled = true; b.textContent = '更新中…';
  try{ data = await fetchData(); await fetchFavs().catch(() => {}); TEAM.clearCache(); buildChips(); render(); b.textContent = '已更新'; }
  catch(err){ alert('更新失敗：' + err.message); }
  setTimeout(() => { b.disabled = false; b.textContent = '更新資料'; }, 1500);
});
document.getElementById('btnExport').addEventListener('click', () => {
  const blob = new Blob([JSON.stringify({game:'nikke', version:1, exported:new Date().toISOString(), n:owned.n, f:owned.f}, null, 1)], {type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'nikke_owned_' + new Date().toISOString().slice(0, 10) + '.json';
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
});
document.getElementById('btnImport').addEventListener('click', () => document.getElementById('fileImport').click());
document.getElementById('fileImport').addEventListener('change', async ev => {
  const f = ev.target.files[0]; if (!f) return;
  try{
    const o = JSON.parse(await f.text());
    if (!o.n) throw new Error('格式不符');
    if (!confirm(`匯入 ${Object.keys(o.n).length} 位妮姬、${Object.keys(o.f || {}).length} 件收藏品，會覆蓋目前紀錄，確定？`)) return;
    owned = {n:o.n, f:o.f || {}}; saveOwned(); render();
  }catch(err){ alert('匯入失敗：' + err.message); }
  ev.target.value = '';
});
</script>
<script src="team.js"></script>
<script>TEAM.init(); init();</script>
<script src="../hover.js"></script>
</body>
</html>
