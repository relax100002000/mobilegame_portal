<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ブルーアーカイブ 收藏管理（日服）</title>
<style>
  :root{--bg:#f3f4f8;--card:#fff;--text:#1d2130;--sub:#6b7085;--line:#e3e5ee;--accent:#4a5cff;--ok:#1f9d55;--gold:#d4a017}
  @media (prefers-color-scheme: dark){:root{--bg:#14161d;--card:#1f2230;--text:#eceef5;--sub:#9aa0b5;--line:#2e3244;--accent:#8c98ff;--ok:#3ccf7a}}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);font-family:"Segoe UI","Noto Sans TC","Microsoft JhengHei",sans-serif}
  header{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
  .wrap{max-width:1300px;margin:0 auto;padding:10px 14px}
  .top{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .top h1{margin:0;font-size:20px}
  .top a.back{color:var(--sub);text-decoration:none;font-size:14px}
  .top .sp{flex:1}
  button,select,input{font:inherit;color:var(--text)}
  .btn{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:6px 10px;cursor:pointer;font-size:13px}
  .btn:hover{border-color:var(--accent)}
  .tabs{display:flex;gap:6px;margin-top:10px}
  .tab{padding:7px 16px;border-radius:8px 8px 0 0;border:1px solid var(--line);border-bottom:none;background:var(--card);cursor:pointer;font-weight:600;color:var(--sub)}
  .tab.on{background:var(--accent);border-color:var(--accent);color:#fff}
  .filters{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:8px}
  .filters input[type=search]{flex:1;min-width:180px;padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:var(--card)}
  .filters select{padding:6px 8px;border:1px solid var(--line);border-radius:8px;background:var(--card)}
  .chips{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}
  .chip{padding:3px 9px;border:1px solid var(--line);border-radius:999px;background:var(--card);cursor:pointer;font-size:12px;user-select:none}
  .chip.on{background:var(--accent);border-color:var(--accent);color:#fff}
  .stats{margin-top:8px;font-size:13px;color:var(--sub);display:flex;flex-wrap:wrap;gap:4px 14px}
  .stats b{color:var(--text)}
  main{max-width:1300px;margin:0 auto;padding:14px;display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:10px}
  .item{position:relative;background:var(--card);border:2px solid var(--line);border-radius:10px;overflow:hidden;cursor:pointer;display:flex;flex-direction:column;user-select:none}
  .item .img{position:relative;aspect-ratio:1/1;background:#0002}
  .item img{width:100%;height:100%;object-fit:cover;display:block;filter:grayscale(1);opacity:.45;transition:.15s}
  .item.own{border-color:var(--ok)}
  .item.own img{filter:none;opacity:1}
  .item .no{position:absolute;left:4px;top:4px;background:#000a;color:#fff;font-size:11px;padding:1px 5px;border-radius:5px}
  .item .rar{position:absolute;right:4px;top:4px;background:#000a;color:var(--gold);font-size:11px;padding:1px 5px;border-radius:5px}
  .item .chk{position:absolute;right:4px;bottom:4px;width:24px;height:24px;border-radius:50%;background:#fffc;border:2px solid #888;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:700;color:transparent}
  .item.own .chk{background:var(--ok);border-color:#fff;color:#fff}
  .item .nm{font-size:12px;line-height:1.3;padding:4px 5px 2px;height:36px;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
  .item .cls{font-size:11px;color:var(--sub);padding:0 5px}
  .np{display:flex;gap:2px;padding:4px 4px 5px;visibility:hidden}
  .item.own .np{visibility:visible}
  .np span{flex:1;text-align:center;font-size:11px;border:1px solid var(--line);border-radius:4px;padding:2px 0;color:var(--sub)}
  .np span.on{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:700}
  .np span.mlb{flex:1}
  .item.np5 .np span.on{background:var(--gold);border-color:var(--gold)}
  main[hidden],#teamOut[hidden]{display:none}
  .filters label{font-size:13px;color:var(--sub);display:flex;align-items:center;gap:5px}
  #teamOut{max-width:1300px;margin:0 auto;padding:14px;display:grid;grid-template-columns:repeat(auto-fill,minmax(400px,1fr));gap:12px}
  .tm-card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
  .tm-head{font-size:13px;display:flex;gap:8px;align-items:center;margin-bottom:8px}
  .tm-b{font-size:12px;padding:2px 8px;border-radius:6px;color:#fff;font-weight:600}
  .tm-b.ok{background:var(--ok)}.tm-b.mid{background:#d08a00}.tm-b.ng{background:#c33}
  .tm-mems{display:flex;gap:8px}
  .tm-mem{width:84px;cursor:pointer;text-align:center}
  .tm-mem img{width:72px;height:72px;border-radius:8px;display:block;margin:0 auto}
  .tm-tag{display:inline-block;font-size:11px;padding:0 6px;border-radius:4px;margin-top:3px;color:#fff;background:#888}
  .tm-tag.t-dps{background:#c33}.tm-tag.t-own{background:var(--accent)}.tm-tag.t-friend{background:#d08a00}
  .tm-nm{font-size:11px;line-height:1.25;margin-top:2px;max-height:2.5em;overflow:hidden}
  table.tm-w{width:100%;border-collapse:collapse;font-size:12px;margin-top:8px}
  table.tm-w th,table.tm-w td{border-top:1px solid var(--line);padding:3px 4px;text-align:left;white-space:nowrap}
  table.tm-w th{color:var(--sub);font-weight:400}
  table.tm-w td.tm-plan{white-space:normal;color:var(--sub)}
  .tm-ok{color:var(--ok);font-weight:700}.tm-ng{color:#c33;font-weight:700}
  @media (max-width:600px){#teamOut{grid-template-columns:1fr;padding:8px}}
  .msg{grid-column:1/-1;text-align:center;color:var(--sub);padding:40px 0}
  footer{text-align:center;color:var(--sub);font-size:12px;padding:0 16px 30px}
  footer a{color:var(--sub)}
  .item .chk{width:30px;height:30px;right:3px;bottom:3px;font-size:17px}
  .item .chk:hover{border-color:var(--ok)}
  /* detail modal */
  #dlg{position:fixed;inset:0;z-index:20;background:#000a;display:none;align-items:flex-start;justify-content:center;overflow-y:auto;padding:24px 10px}
  #dlg.on{display:flex}
  body.lock{overflow:hidden}
  .dbox{position:relative;background:var(--card);border-radius:14px;max-width:880px;width:100%;padding:18px 20px 22px;box-shadow:0 20px 50px #0008}
  .dclose{position:absolute;right:10px;top:8px;border:none;background:none;font-size:28px;cursor:pointer;color:var(--sub);line-height:1}
  .dhead{display:flex;gap:14px;align-items:center;padding-right:30px}
  .dhead img{width:72px;height:72px;border-radius:8px}
  .dhead h2{margin:0;font-size:20px}
  .dhead .ruby{color:var(--sub);font-size:12px}
  .dhead .meta{color:var(--sub);font-size:13px;margin-top:2px}
  .down{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:12px 0 4px;padding:8px 10px;border:1px solid var(--line);border-radius:10px}
  .down .np{visibility:visible;padding:0;gap:4px}
  .down .np span{cursor:pointer;padding:4px 10px;font-size:13px}
  .dcols{display:grid;grid-template-columns:minmax(0,300px) minmax(0,1fr);gap:18px;margin-top:12px}
  .dart img{width:100%;border-radius:8px;display:block;background:#0002;min-height:200px}
  .dart .asc{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
  .dart .asc span{font-size:12px;padding:2px 8px;border:1px solid var(--line);border-radius:6px;cursor:pointer}
  .dart .asc span.on{background:var(--accent);border-color:var(--accent);color:#fff}
  .dbox h3{font-size:15px;margin:16px 0 6px;padding-bottom:4px;border-bottom:1px solid var(--line)}
  .dcols h3:first-child{margin-top:0}
  table.kv{border-collapse:collapse;font-size:13px;width:100%}
  table.kv th,table.kv td{border:1px solid var(--line);padding:4px 6px;text-align:left;vertical-align:top}
  table.kv th{background:#8881;white-space:nowrap;font-weight:600;width:1%}
  .sk{display:flex;gap:10px;padding:8px 0;border-bottom:1px dashed var(--line)}
  .sk:last-child{border-bottom:none}
  .sk img{width:40px;height:40px;flex:none}
  .sk .t{font-weight:600;font-size:14px}
  .sk .t small{font-weight:400;color:var(--sub);margin-left:6px}
  .sk .d{font-size:13px;margin-top:3px;white-space:pre-wrap}
  .vals{font-size:12px;color:var(--sub);margin-top:4px;overflow-x:auto}
  .vals table{border-collapse:collapse}
  .vals td{border:1px solid var(--line);padding:1px 5px;white-space:nowrap}
  .vals td:first-child{color:var(--text)}
  .tag{display:inline-block;font-size:11px;padding:0 6px;border-radius:4px;background:var(--accent);color:#fff;margin-left:6px;vertical-align:middle}
  .card-q{color:#2a7de1;font-weight:700}.card-a{color:#1f9d55;font-weight:700}.card-b{color:#d33;font-weight:700}
  .prof{font-size:13px;white-space:pre-wrap;line-height:1.6;padding:8px 0;border-bottom:1px dashed var(--line)}
  .prof .cond{display:block;color:var(--sub);font-size:12px}
  details.older{margin:2px 0 6px 50px;font-size:13px}
  details.older summary{cursor:pointer;color:var(--sub);font-size:12px}
  details.older .sk{opacity:.8}
  .dlink{color:var(--accent);cursor:pointer;text-decoration:underline}
  .dfoot{margin-top:14px;font-size:12px;color:var(--sub)}
  .dfoot a{color:var(--sub)}
  @media (max-width:700px){.dcols{grid-template-columns:1fr}.dart{max-width:320px;margin:0 auto}#dlg{padding:0}.dbox{border-radius:0;min-height:100%}}
  @media (max-width:600px){header{position:static}main{grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:7px}.item .nm{font-size:11px}}
</style>
<style>
  .item .np{gap:3px;align-items:center}
  .lvctl{display:flex;align-items:center;justify-content:space-between;padding:3px 4px 5px;visibility:hidden;font-size:12px;font-weight:700}
  .item.own .lvctl{visibility:visible}
  .lvctl button{border:1px solid var(--line);background:var(--card);border-radius:5px;width:24px;height:22px;cursor:pointer;padding:0;line-height:1}
  .lvctl .lv{color:var(--gold)}
  .lvctl .lv.w{color:#d33}
  .bt{display:inline-block;font-size:10px;font-weight:700;color:#fff;border-radius:4px;padding:0 4px;line-height:15px}
  .bt-Explosion,.ar-LightArmor{background:#a70c19}.bt-Pierce,.ar-HeavyArmor{background:#b26d1f}
  .bt-Mystic,.ar-Unarmed{background:#216f9c}.bt-Sonic,.ar-ElasticArmor{background:#9431a5}
  .bt-Chemical,.ar-CompositeArmor{background:#2d8a5a}.bt-Normal,.ar-Normal,.ar-Structure{background:#777}
  .item .tags{position:absolute;left:3px;bottom:3px;display:flex;flex-direction:column;gap:2px}
  .ba-col-explosion{color:#c4202e;font-weight:700}.ba-col-pierce{color:#c07a22;font-weight:700}.ba-col-mystic{color:#2a7fb3;font-weight:700}.ba-col-sonic{color:#a03bb3;font-weight:700}
  .bf{color:#e8a33d;font-weight:600}.df{color:#d9534f;font-weight:600}.cc{color:#9b59b6;font-weight:600}.spc{color:#2a9d8f;font-weight:600}
  .dart img{background:none;min-height:0}
  .wpn{display:flex;gap:10px;align-items:center}.wpn img{width:160px;flex:none;background:none}
  .tm-mem{width:96px}
  .tm-sec{font-size:13px;font-weight:700;margin:10px 0 4px}
  .tm-list{display:flex;flex-wrap:wrap;gap:6px}
  .tm-list .tm-mem{width:76px}.tm-list .tm-mem img{width:56px;height:56px}
  .adp{font-weight:700}
</style>
</head>
<body>
<header><div class="wrap">
  <div class="top">
    <a class="back" href="../">← Portal</a>
    <h1>ブルーアーカイブ 收藏管理（日服）</h1>
    <span class="sp"></span>
    <button class="btn" id="btnExport">匯出</button>
    <button class="btn" id="btnImport">匯入</button>
    <button class="btn" id="btnRefresh">更新資料</button>
    <input type="file" id="fileImport" accept=".json,application/json" hidden>
  </div>
  <div class="tabs">
    <div class="tab on" data-tab="stu">学生</div>
    <div class="tab" data-tab="team">編成</div>
  </div>
  <div id="listCtl">
    <div class="filters">
      <input type="search" id="q" placeholder="名前で検索">
      <select id="fOwn">
        <option value="all">全部</option>
        <option value="own">持有</option>
        <option value="not">未持有</option>
        <option value="five">★5 以上</option>
        <option value="max">専用武器 ★4</option>
      </select>
      <select id="fSort">
        <option value="def">預設順</option>
        <option value="idD">ID 新→舊</option>
        <option value="rar">初期★ ↓</option>
        <option value="lv">持有星級 ↓</option>
      </select>
    </div>
    <div class="chips" id="chipSquad"></div>
    <div class="chips" id="chipRole"></div>
    <div class="chips" id="chipBullet"></div>
    <div class="chips" id="chipArmor"></div>
    <div class="chips" id="chipSchool"></div>
    <div class="stats" id="stats"></div>
  </div>
  <div id="teamCtl" hidden>
    <div class="filters">
      <label>敵の装甲 <select id="tmArmor"></select></label>
      <label>地形 <select id="tmTerrain"><option value="Street">市街地</option><option value="Outdoor">屋外</option><option value="Indoor">屋内</option></select></label>
    </div>
    <div class="stats" id="teamInfo"></div>
  </div>
</div></header>
<main id="grid"><div class="msg">讀取資料中…</div></main>
<section id="teamOut" hidden></section>
<div id="dlg"><div class="dbox"><button class="dclose" title="關閉">×</button><div id="dbody"></div></div></div>
<footer>資料與圖片來自 <a href="https://schaledb.com/" target="_blank" rel="noopener">SchaleDB</a>，著作權屬 NEXON Games / Yostar 所有。點圖片看詳細資料，點右下圓圈打勾持有，−／＋ 調整星級（★5 之後是專用武器 W1～W4）。持有紀錄存在此瀏覽器，換裝置請用「匯出／匯入」。</footer>

<script>
const DB = 'https://schaledb.com/';
const SAVE_KEY = 'ba_jp_owned_v1';
const CACHE_KEY = 'ba_jp_data_v1';
let L = {};          // localization
let TE = {};         // TypeEffectiveness
let data = null;     // {stu:[], time}
let owned = {stu:{}};  // 1..5 = ★、6..9 = 専用武器 ★1..4
try{ const o = JSON.parse(localStorage.getItem(SAVE_KEY)); if (o && o.stu) owned = o; }catch(e){}
const tab = 'stu';
const F = {squad:new Set(), role:new Set(), bullet:new Set(), armor:new Set(), school:new Set()};

function esc(s){ return String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function saveOwned(){ try{ localStorage.setItem(SAVE_KEY, JSON.stringify(owned)); }catch(e){ alert('儲存失敗：' + e.message); } }
function lvText(v){ return v <= 5 ? '★' + v : 'W' + (v - 5); }
const ADAPT = ['D','C','B','A','S','SS'];
const ADAPT_COLOR = ['#888','#888','#4a90d9','#2a9d8f','#e8a33d','#d33'];

function trim(stuRaw){
  const stu = Object.values(stuRaw).filter(s => s.IsReleased && s.IsReleased[0]).map(s => ({
    id:s.Id, name:s.Name, r:s.StarGrade, squad:s.SquadType, role:s.TacticRole, pos:s.Position,
    bullet:s.BulletType, armor:s.ArmorType, school:s.School, wt:s.WeaponType, ord:s.DefaultOrder,
    ad:[s.StreetBattleAdaptation, s.OutdoorBattleAdaptation, s.IndoorBattleAdaptation],
    wad: s.Weapon ? [s.Weapon.AdaptationType, s.Weapon.AdaptationValue] : null,
    lim: s.IsLimited ? s.IsLimited[0] : 0
  }));
  return {stu, time:Date.now()};
}
async function fetchAll(){
  const get = u => fetch(DB + 'data/' + u, {cache:'no-cache'}).then(r => { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); });
  const [s, l, c] = await Promise.all([get('jp/students.min.json'), get('jp/localization.min.json'), get('config.min.json')]);
  const d = trim(s);
  d.L = {BulletType:l.BulletType, ArmorType:l.ArmorType, TacticRole:l.TacticRole, School:l.School, SquadType:l.SquadType, Position:l.Position, AdaptationType:l.AdaptationType, SkillType:l.SkillType, BuffName:l.BuffName, Club:l.Club};
  d.TE = c.TypeEffectiveness;
  try{ localStorage.setItem(CACHE_KEY, JSON.stringify(d)); }catch(e){}
  return d;
}
function useData(d){
  data = d; TE = d.TE || {};
  // localization 沒有的分類補空物件，Position 補預設文字
  L = Object.assign({}, d.L);
  ['BulletType','ArmorType','TacticRole','School','SquadType','Position','AdaptationType','SkillType','BuffName','Club'].forEach(k => { if (!L[k]) L[k] = {}; });
  if (!Object.keys(L.Position).length) L.Position = {Front:'FRONT', Middle:'MIDDLE', Back:'BACK'};
}
async function init(){
  let cached = null;
  try{ cached = JSON.parse(localStorage.getItem(CACHE_KEY)); }catch(e){}
  if (cached && cached.L){ useData(cached); buildChips(); render(); TEAM.setup(); }
  try{
    const fresh = await fetchAll();
    const changed = !cached || fresh.stu.length !== cached.stu.length;
    useData(fresh);
    if (changed){ buildChips(); render(); TEAM.setup(); }
  }catch(err){
    if (!data) document.getElementById('grid').innerHTML = '<div class="msg">資料讀取失敗：' + esc(err.message) + '<br>請確認網路後按「更新資料」。</div>';
  }
  if (!curDetail) routeHash();
  if (location.hash === '#team') document.querySelector('.tab[data-tab="team"]').click();
}

function faceOf(x){ return DB + 'images/student/icon/' + x.id + '.webp'; }
function bt(b){ return `<span class="bt bt-${b}">${esc((L.BulletType || {})[b] || b)}</span>`; }
function ar(a){ return `<span class="bt ar-${a}">${esc((L.ArmorType || {})[a] || a)}</span>`; }

function buildChips(){
  const list = data.stu;
  const mk = (id, key, vals, label) => document.getElementById(id).innerHTML =
    vals.filter(v => list.some(x => x[key] === v)).map(v => `<span class="chip${F[key].has(v) ? ' on' : ''}" data-k="${key}" data-v="${v}">${label(v)}</span>`).join('');
  mk('chipSquad', 'squad', ['Main','Support'], v => L.SquadType[v] || v);
  mk('chipRole', 'role', ['DamageDealer','Tanker','Healer','Supporter','Vehicle'], v => L.TacticRole[v] || v);
  mk('chipBullet', 'bullet', ['Explosion','Pierce','Mystic','Sonic','Chemical'], v => bt(v));
  mk('chipArmor', 'armor', ['LightArmor','HeavyArmor','Unarmed','ElasticArmor','CompositeArmor'], v => ar(v));
  mk('chipSchool', 'school', [...new Set(list.map(x => x.school))], v => esc(L.School[v] || v));
}

function filtered(){
  const q = document.getElementById('q').value.trim().toLowerCase();
  const fo = document.getElementById('fOwn').value, so = document.getElementById('fSort').value;
  const list = data.stu.filter(x => {
    for (const k in F) if (F[k].size && !F[k].has(x[k])) return false;
    if (q && !x.name.toLowerCase().includes(q)) return false;
    const v = owned.stu[x.id] || 0;
    if (fo === 'own' && !v) return false;
    if (fo === 'not' && v) return false;
    if (fo === 'five' && v < 5) return false;
    if (fo === 'max' && v !== 9) return false;
    return true;
  });
  if (so === 'idD') list.sort((a, b) => b.id - a.id);
  else if (so === 'rar') list.sort((a, b) => b.r - a.r || a.ord - b.ord);
  else if (so === 'lv') list.sort((a, b) => (owned.stu[b.id] || 0) - (owned.stu[a.id] || 0) || a.ord - b.ord);
  else list.sort((a, b) => a.ord - b.ord);
  return list;
}
function cardHTML(x){
  const v = owned.stu[x.id] || 0;
  return `<div class="item${v ? ' own' : ''}${v === 9 ? ' np5' : ''}" data-id="${x.id}">
    <div class="img"><img loading="lazy" src="${faceOf(x)}" alt=""><span class="rar">${x.squad === 'Main' ? 'ST' : 'SP'}</span>
      <span class="tags">${bt(x.bullet)}${ar(x.armor)}</span><span class="chk">✓</span></div>
    <div class="nm" title="${esc(x.name)}">${esc(x.name)}</div>
    <div class="cls">${esc(L.TacticRole[x.role] || x.role)}・${esc(x.wt)}</div>
    <div class="lvctl"><button data-d="-1">−</button><span class="lv${v > 5 ? ' w' : ''}">${v ? lvText(v) : ''}</span><button data-d="1">＋</button></div></div>`;
}
function render(){
  if (!data) return;
  const list = filtered();
  document.getElementById('grid').innerHTML = list.length ? list.map(cardHTML).join('') : '<div class="msg">沒有符合的項目</div>';
  renderStats(list.length);
}
function renderStats(shown){
  const list = data.stu, own = list.filter(x => owned.stu[x.id]);
  const cnt = f => own.filter(x => f(owned.stu[x.id])).length;
  let h = `<span>持有 <b>${own.length}</b> / ${list.length}（${(own.length / list.length * 100).toFixed(1)}%）</span>`;
  h += `<span>★5 以上 <b>${cnt(v => v >= 5)}</b></span><span>専用武器 <b>${cnt(v => v >= 6)}</b></span><span>W4 <b>${cnt(v => v === 9)}</b></span>`;
  h += `<span>顯示中 ${shown}</span>`;
  if (data.time) h += `<span>資料：${new Date(data.time).toLocaleString()}</span>`;
  document.getElementById('stats').innerHTML = h;
}
function setOwn(id, v){
  if (v) owned.stu[id] = Math.max(1, Math.min(9, v)); else delete owned.stu[id];
  saveOwned();
  const el = document.querySelector(`#grid .item[data-id="${id}"]`);
  if (el){ const tmp = document.createElement('div'); tmp.innerHTML = cardHTML(data.stu.find(x => x.id === id)); el.replaceWith(tmp.firstElementChild); }
  renderStats(document.querySelectorAll('#grid .item').length);
}
document.getElementById('grid').addEventListener('click', ev => {
  const el = ev.target.closest('.item'); if (!el) return;
  const id = +el.dataset.id, x = data.stu.find(s => s.id === id), v = owned.stu[id] || 0;
  const d = ev.target.closest('[data-d]');
  if (d){ if (v) setOwn(id, Math.max(x.r, v + +d.dataset.d)); return; }
  if (ev.target.closest('.lvctl')) return;
  if (ev.target.closest('.chk')) setOwn(id, v ? 0 : x.r);
  else { pushedHash = true; location.hash = 'stu-' + id; }
});

/* ===== スキル説明 ===== */
const PFX = {b:'Buff_', d:'Debuff_', c:'CC_', s:'Special_'};
const PCLS = {b:'bf', d:'df', c:'cc', s:'spc'};
function fmtDesc(desc, params, idx){
  let s = esc(String(desc || '').replace(/\\n/g, '\n'));
  s = s.replace(/&lt;\?(\d+)&gt;/g, (m, n) => { const a = params && params[n - 1]; return a ? `<b class="hl">${esc(a[Math.min(idx, a.length - 1)])}</b>` : m; });
  s = s.replace(/&lt;([bdcs]):([A-Za-z0-9_]+)(?:=&#39;([^&]*)&#39;|='([^']*)')?&gt;/g, (m, p, n, l1, l2) =>
    `<span class="${PCLS[p]}">${esc(l1 || l2 || (L.BuffName || {})[PFX[p] + n] || n)}</span>`);
  s = s.replace(/&lt;kb:\d+&gt;/g, 'ノックバック');
  s = s.replace(/&lt;b class=&#39;(ba-col-[a-z]+)&#39;&gt;|&lt;b class='(ba-col-[a-z]+)'&gt;/g, (m, a, b) => `<span class="${a || b}">`).replace(/&lt;\/b&gt;/g, '</span>');
  return s.replace(/&lt;[^&]*&gt;/g, '');
}

/* ===== 詳細資料 ===== */
let raw = null, curDetail = null, pushedHash = false;
async function rawData(){
  if (!raw) raw = await fetch(DB + 'data/jp/students.min.json').then(r => { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); });
  return raw;
}
function ownBarHTML(id){
  const v = owned.stu[id] || 0, x = data.stu.find(s => s.id === id);
  let h = `<label style="display:flex;align-items:center;gap:6px;cursor:pointer;font-weight:600"><input type="checkbox" id="downChk" ${v ? 'checked' : ''}> 持有</label>`;
  if (v) h += '<div class="np">' + [1,2,3,4,5,6,7,8,9].filter(n => n >= x.r).map(n => `<span data-dnp="${n}" class="${v === n ? 'on' : ''}">${lvText(n)}</span>`).join('') + '</div>';
  return h;
}
function headHTML(x, d){
  let meta = `${'★'.repeat(x.r)}｜${esc(L.SquadType[x.squad])}｜${esc(L.TacticRole[x.role])}｜${esc(L.Position[x.pos] || x.pos)}｜${esc(x.wt)}　${bt(x.bullet)} ${ar(x.armor)}`;
  if (d) meta += `<br>${esc(L.School[d.School] || d.School)}／${esc((L.Club || {})[d.Club] || d.Club)}${d.IsLimited && d.IsLimited[0] ? '｜限定' : ''}`;
  return `<div class="dhead"><img src="${faceOf(x)}" alt=""><div>
    <div class="ruby">${d ? esc((d.FamilyNameRuby || '') + ' ' + (d.PersonalNameRuby || '')) : ''}</div>
    <h2>${esc(x.name)}${d && d.FamilyName ? `<small style="font-weight:400;color:var(--sub);font-size:13px">（${esc(d.FamilyName + d.PersonalName)}）</small>` : ''}</h2>
    <div class="meta">${meta}</div></div></div>
    <div class="down" id="down">${ownBarHTML(x.id)}</div>`;
}
const SK_ORDER = ['Ex','Public','GearPublic','Passive','WeaponPassive','ExtraPassive'];
function stuHTML(d){
  const adapt = ['Street','Outdoor','Indoor'].map((k, i) => {
    const v = [d.StreetBattleAdaptation, d.OutdoorBattleAdaptation, d.IndoorBattleAdaptation][i];
    const up = d.Weapon && d.Weapon.AdaptationType === k ? d.Weapon.AdaptationValue : 0;
    return `<th>${esc(L.AdaptationType[k])}</th><td><span class="adp" style="color:${ADAPT_COLOR[v]}">${ADAPT[v]}</span>${up ? ` → <span class="adp" style="color:${ADAPT_COLOR[v + up]}">${ADAPT[v + up]}</span><small>（専武★2）</small>` : ''}</td>`;
  });
  let h = `<div class="dcols"><div class="dart"><img src="${DB}images/student/portrait/${d.Id}.webp" alt=""></div><div>
    <h3>能力値（Lv.1 → Lv.100）</h3><table class="kv">
      <tr><th>攻撃力</th><td>${d.AttackPower1} → ${d.AttackPower100}</td><th>最大HP</th><td>${d.MaxHP1} → ${d.MaxHP100}</td></tr>
      <tr><th>防御力</th><td>${d.DefensePower1} → ${d.DefensePower100}</td><th>治癒力</th><td>${d.HealPower1} → ${d.HealPower100}</td></tr>
      <tr><th>命中値</th><td>${d.AccuracyPoint}</td><th>回避値</th><td>${d.DodgePoint}</td></tr>
      <tr><th>会心値</th><td>${d.CriticalPoint}</td><th>会心ダメージ</th><td>${d.CriticalDamageRate / 100}%</td></tr>
      <tr><th>安定値</th><td>${d.StabilityPoint}</td><th>射程</th><td>${d.Range}</td></tr>
      <tr><th>装弾数</th><td>${d.AmmoCount}（${d.AmmoCost}）</td><th>コスト回復</th><td>${d.RegenCost}</td></tr>
    </table>
    <h3>地形適性</h3><table class="kv"><tr>${adapt.join('')}</tr></table>
    <h3>プロフィール</h3><table class="kv">
      <tr><th>学年</th><td>${esc(d.SchoolYear || '-')}</td><th>年齢</th><td>${esc(d.CharacterAge || '-')}</td></tr>
      <tr><th>誕生日</th><td>${esc(d.Birthday || '-')}</td><th>身長</th><td>${esc(d.CharHeightMetric || '-')}</td></tr>
      <tr><th>趣味</th><td colspan="3">${esc(d.Hobby || '-')}</td></tr>
      <tr><th>CV</th><td>${esc(d.CharacterVoice || '-')}</td><th>イラスト</th><td>${esc(d.Illustrator || '-')}</td></tr>
      <tr><th>装備</th><td colspan="3">${esc((d.Equipment || []).join('・'))}</td></tr>
    </table></div></div>`;
  h += '<h3>スキル</h3>';
  for (const k of SK_ORDER){
    const sk = d.Skills && d.Skills[k]; if (!sk) continue;
    if (k === 'GearPublic' && !(d.Gear && d.Gear.Released && d.Gear.Released[0])) continue;
    const n = (sk.Parameters && sk.Parameters[0] || []).length || 1;
    const cost = k === 'Ex' && sk.Cost ? `コスト ${sk.Cost[sk.Cost.length - 1]}` : '';
    h += `<div class="sk"><img src="${DB}images/skill/${sk.Icon}.webp" alt="" onerror="this.style.visibility='hidden'"><div style="flex:1;min-width:0">
      <div class="t">${esc(sk.Name)}<span class="tag">${esc(L.SkillType[k] || k)}</span><small>Lv.${n}${cost ? '｜' + cost : ''}</small></div>
      <div class="d">${fmtDesc(sk.Desc, sk.Parameters, n - 1)}</div></div></div>`;
  }
  if (d.Weapon) h += `<h3>専用武器</h3><div class="wpn"><img src="${DB}images/weapon/${d.WeaponImg}.webp" alt="" onerror="this.style.display='none'"><div>
      <div class="t" style="font-weight:700">${esc(d.Weapon.Name)}</div>
      <div class="d" style="font-size:13px;white-space:pre-wrap;margin-top:4px">${esc(d.Weapon.Desc || '')}</div>
      <div style="font-size:12px;color:var(--sub);margin-top:4px">★2：${esc(L.AdaptationType[d.Weapon.AdaptationType] || '')}適性 +${d.Weapon.AdaptationValue}｜★3：パッシブスキル＋</div></div></div>`;
  if (d.Gear && d.Gear.Released && d.Gear.Released[0]) h += `<h3>愛用品</h3><div class="prof"><b>${esc(d.Gear.Name)}</b>\n${esc(d.Gear.Desc || '')}</div>`;
  if (d.ProfileIntroduction) h += `<h3>紹介</h3><div class="prof">${esc(d.ProfileIntroduction)}</div>`;
  h += `<div class="dfoot">更多資料：<a href="https://schaledb.com/student/${esc(d.PathName)}" target="_blank" rel="noopener">SchaleDB</a></div>`;
  return h;
}
async function openDetail(id){
  const x = data && data.stu.find(s => s.id === id);
  if (!x){ closeDetail(); return; }
  curDetail = {id};
  document.getElementById('dlg').classList.add('on');
  document.body.classList.add('lock');
  const body = document.getElementById('dbody');
  body.innerHTML = headHTML(x, null) + '<p style="color:var(--sub)">讀取詳細資料中…</p>';
  let all;
  try{ all = await rawData(); }
  catch(err){ if (curDetail && curDetail.id === id) body.innerHTML = headHTML(x, null) + `<p>詳細資料讀取失敗：${esc(err.message)}</p>`; return; }
  if (!curDetail || curDetail.id !== id) return;
  const d = all[id] || Object.values(all).find(s => s.Id === id);
  body.innerHTML = headHTML(x, d) + stuHTML(d);
  document.getElementById('dlg').scrollTop = 0;
}
function closeDetail(){ curDetail = null; document.getElementById('dlg').classList.remove('on'); document.body.classList.remove('lock'); }
function hideDetail(){
  if (pushedHash){ pushedHash = false; history.back(); }
  else { history.replaceState(null, '', location.pathname + location.search); closeDetail(); }
}
function routeHash(){
  const m = location.hash.match(/^#stu-(\d+)$/);
  if (m && data) openDetail(+m[1]); else closeDetail();
}
window.addEventListener('hashchange', routeHash);
document.querySelector('.dclose').addEventListener('click', hideDetail);
document.addEventListener('keydown', ev => { if (ev.key === 'Escape' && curDetail) hideDetail(); });
document.getElementById('dlg').addEventListener('click', ev => {
  if (ev.target.id === 'dlg'){ hideDetail(); return; }
  const np = ev.target.closest('[data-dnp]');
  if (np && curDetail){ setOwn(curDetail.id, +np.dataset.dnp); document.getElementById('down').innerHTML = ownBarHTML(curDetail.id); }
});
document.getElementById('dlg').addEventListener('change', ev => {
  if (ev.target.id === 'downChk' && curDetail){
    const x = data.stu.find(s => s.id === curDetail.id);
    setOwn(curDetail.id, ev.target.checked ? x.r : 0);
    document.getElementById('down').innerHTML = ownBarHTML(curDetail.id);
  }
});

/* ===== 分頁、篩選、匯出入 ===== */
document.querySelectorAll('.tab').forEach(t => t.addEventListener('click', () => {
  document.querySelectorAll('.tab').forEach(x => x.classList.toggle('on', x === t));
  const isTeam = t.dataset.tab === 'team';
  document.getElementById('listCtl').hidden = isTeam;
  document.getElementById('grid').hidden = isTeam;
  document.getElementById('teamCtl').hidden = !isTeam;
  document.getElementById('teamOut').hidden = !isTeam;
  window.scrollTo(0, 0);
  if (isTeam){ if (data) TEAM.render(); }
  else if (data) render();
}));
document.querySelectorAll('#listCtl .chips').forEach(box => box.addEventListener('click', ev => {
  const c = ev.target.closest('.chip'); if (!c) return;
  const s = F[c.dataset.k], v = c.dataset.v;
  s.has(v) ? s.delete(v) : s.add(v);
  c.classList.toggle('on'); render();
}));
let qTimer;
document.getElementById('q').addEventListener('input', () => { clearTimeout(qTimer); qTimer = setTimeout(render, 150); });
document.getElementById('fOwn').addEventListener('change', render);
document.getElementById('fSort').addEventListener('change', render);
document.getElementById('btnRefresh').addEventListener('click', async () => {
  const b = document.getElementById('btnRefresh');
  b.disabled = true; b.textContent = '更新中…';
  try{ useData(await fetchAll()); raw = null; buildChips(); render(); b.textContent = '已更新'; }
  catch(err){ alert('更新失敗：' + err.message); }
  setTimeout(() => { b.disabled = false; b.textContent = '更新資料'; }, 1500);
});
document.getElementById('btnExport').addEventListener('click', () => {
  const blob = new Blob([JSON.stringify({game:'bluearchive', server:'JP', version:1, exported:new Date().toISOString(), stu:owned.stu}, null, 1)], {type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'ba_jp_owned_' + new Date().toISOString().slice(0, 10) + '.json';
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
});
document.getElementById('btnImport').addEventListener('click', () => document.getElementById('fileImport').click());
document.getElementById('fileImport').addEventListener('change', async ev => {
  const f = ev.target.files[0]; if (!f) return;
  try{
    const o = JSON.parse(await f.text());
    if (!o.stu) throw new Error('格式不符');
    if (!confirm(`匯入 ${Object.keys(o.stu).length} 位學生，會覆蓋目前紀錄，確定？`)) return;
    owned = {stu:o.stu}; saveOwned(); render();
  }catch(err){ alert('匯入失敗：' + err.message); }
  ev.target.value = '';
});
</script>
