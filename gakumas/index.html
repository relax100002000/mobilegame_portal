<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>学園アイドルマスター 收藏管理</title>
<style>
  :root{--bg:#f3f4f8;--card:#fff;--text:#1d2130;--sub:#6b7085;--line:#e3e5ee;--accent:#4a5cff;--ok:#1f9d55;--gold:#d4a017}
  @media (prefers-color-scheme: dark){:root{--bg:#14161d;--card:#1f2230;--text:#eceef5;--sub:#9aa0b5;--line:#2e3244;--accent:#8c98ff;--ok:#3ccf7a}}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);font-family:"Segoe UI","Noto Sans TC","Microsoft JhengHei",sans-serif}
  header{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
  .wrap{max-width:1300px;margin:0 auto;padding:10px 14px}
  .top{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .top h1{margin:0;font-size:20px}
  .top a.back{color:var(--sub);text-decoration:none;font-size:14px}
  .top .sp{flex:1}
  button,select,input{font:inherit;color:var(--text)}
  .btn{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:6px 10px;cursor:pointer;font-size:13px}
  .btn:hover{border-color:var(--accent)}
  .tabs{display:flex;gap:6px;margin-top:10px}
  .tab{padding:7px 16px;border-radius:8px 8px 0 0;border:1px solid var(--line);border-bottom:none;background:var(--card);cursor:pointer;font-weight:600;color:var(--sub)}
  .tab.on{background:var(--accent);border-color:var(--accent);color:#fff}
  .filters{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:8px}
  .filters input[type=search]{flex:1;min-width:180px;padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:var(--card)}
  .filters select{padding:6px 8px;border:1px solid var(--line);border-radius:8px;background:var(--card)}
  .chips{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}
  .chip{padding:3px 9px;border:1px solid var(--line);border-radius:999px;background:var(--card);cursor:pointer;font-size:12px;user-select:none}
  .chip.on{background:var(--accent);border-color:var(--accent);color:#fff}
  .stats{margin-top:8px;font-size:13px;color:var(--sub);display:flex;flex-wrap:wrap;gap:4px 14px}
  .stats b{color:var(--text)}
  main{max-width:1300px;margin:0 auto;padding:14px;display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:10px}
  .item{position:relative;background:var(--card);border:2px solid var(--line);border-radius:10px;overflow:hidden;cursor:pointer;display:flex;flex-direction:column;user-select:none}
  .item .img{position:relative;aspect-ratio:1/1;background:#0002}
  .item img{width:100%;height:100%;object-fit:cover;display:block;filter:grayscale(1);opacity:.45;transition:.15s}
  .item.own{border-color:var(--ok)}
  .item.own img{filter:none;opacity:1}
  .item .no{position:absolute;left:4px;top:4px;background:#000a;color:#fff;font-size:11px;padding:1px 5px;border-radius:5px}
  .item .rar{position:absolute;right:4px;top:4px;background:#000a;color:var(--gold);font-size:11px;padding:1px 5px;border-radius:5px}
  .item .chk{position:absolute;right:4px;bottom:4px;width:24px;height:24px;border-radius:50%;background:#fffc;border:2px solid #888;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:700;color:transparent}
  .item.own .chk{background:var(--ok);border-color:#fff;color:#fff}
  .item .nm{font-size:12px;line-height:1.3;padding:4px 5px 2px;height:36px;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
  .item .cls{font-size:11px;color:var(--sub);padding:0 5px}
  .np{display:flex;gap:2px;padding:4px 4px 5px;visibility:hidden}
  .item.own .np{visibility:visible}
  .np span{flex:1;text-align:center;font-size:11px;border:1px solid var(--line);border-radius:4px;padding:2px 0;color:var(--sub)}
  .np span.on{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:700}
  .np span.mlb{flex:1}
  .item.np5 .np span.on{background:var(--gold);border-color:var(--gold)}
  main[hidden],#teamOut[hidden]{display:none}
  .filters label{font-size:13px;color:var(--sub);display:flex;align-items:center;gap:5px}
  #teamOut{max-width:1300px;margin:0 auto;padding:14px;display:grid;grid-template-columns:repeat(auto-fill,minmax(400px,1fr));gap:12px}
  .tm-card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
  .tm-head{font-size:13px;display:flex;gap:8px;align-items:center;margin-bottom:8px}
  .tm-b{font-size:12px;padding:2px 8px;border-radius:6px;color:#fff;font-weight:600}
  .tm-b.ok{background:var(--ok)}.tm-b.mid{background:#d08a00}.tm-b.ng{background:#c33}
  .tm-mems{display:flex;gap:8px}
  .tm-mem{width:84px;cursor:pointer;text-align:center}
  .tm-mem img{width:72px;height:72px;border-radius:8px;display:block;margin:0 auto}
  .tm-tag{display:inline-block;font-size:11px;padding:0 6px;border-radius:4px;margin-top:3px;color:#fff;background:#888}
  .tm-tag.t-dps{background:#c33}.tm-tag.t-own{background:var(--accent)}.tm-tag.t-friend{background:#d08a00}
  .tm-nm{font-size:11px;line-height:1.25;margin-top:2px;max-height:2.5em;overflow:hidden}
  table.tm-w{width:100%;border-collapse:collapse;font-size:12px;margin-top:8px}
  table.tm-w th,table.tm-w td{border-top:1px solid var(--line);padding:3px 4px;text-align:left;white-space:nowrap}
  table.tm-w th{color:var(--sub);font-weight:400}
  table.tm-w td.tm-plan{white-space:normal;color:var(--sub)}
  .tm-ok{color:var(--ok);font-weight:700}.tm-ng{color:#c33;font-weight:700}
  @media (max-width:600px){#teamOut{grid-template-columns:1fr;padding:8px}}
  .msg{grid-column:1/-1;text-align:center;color:var(--sub);padding:40px 0}
  footer{text-align:center;color:var(--sub);font-size:12px;padding:0 16px 30px}
  footer a{color:var(--sub)}
  .item .chk{width:30px;height:30px;right:3px;bottom:3px;font-size:17px}
  .item .chk:hover{border-color:var(--ok)}
  /* detail modal */
  #dlg{position:fixed;inset:0;z-index:20;background:#000a;display:none;align-items:flex-start;justify-content:center;overflow-y:auto;padding:24px 10px}
  #dlg.on{display:flex}
  body.lock{overflow:hidden}
  .dbox{position:relative;background:var(--card);border-radius:14px;max-width:880px;width:100%;padding:18px 20px 22px;box-shadow:0 20px 50px #0008}
  .dclose{position:absolute;right:10px;top:8px;border:none;background:none;font-size:28px;cursor:pointer;color:var(--sub);line-height:1}
  .dhead{display:flex;gap:14px;align-items:center;padding-right:30px}
  .dhead img{width:72px;height:72px;border-radius:8px}
  .dhead h2{margin:0;font-size:20px}
  .dhead .ruby{color:var(--sub);font-size:12px}
  .dhead .meta{color:var(--sub);font-size:13px;margin-top:2px}
  .down{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:12px 0 4px;padding:8px 10px;border:1px solid var(--line);border-radius:10px}
  .down .np{visibility:visible;padding:0;gap:4px}
  .down .np span{cursor:pointer;padding:4px 10px;font-size:13px}
  .dcols{display:grid;grid-template-columns:minmax(0,300px) minmax(0,1fr);gap:18px;margin-top:12px}
  .dart img{width:100%;border-radius:8px;display:block;background:#0002;min-height:200px}
  .dart .asc{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
  .dart .asc span{font-size:12px;padding:2px 8px;border:1px solid var(--line);border-radius:6px;cursor:pointer}
  .dart .asc span.on{background:var(--accent);border-color:var(--accent);color:#fff}
  .dbox h3{font-size:15px;margin:16px 0 6px;padding-bottom:4px;border-bottom:1px solid var(--line)}
  .dcols h3:first-child{margin-top:0}
  table.kv{border-collapse:collapse;font-size:13px;width:100%}
  table.kv th,table.kv td{border:1px solid var(--line);padding:4px 6px;text-align:left;vertical-align:top}
  table.kv th{background:#8881;white-space:nowrap;font-weight:600;width:1%}
  .sk{display:flex;gap:10px;padding:8px 0;border-bottom:1px dashed var(--line)}
  .sk:last-child{border-bottom:none}
  .sk img{width:40px;height:40px;flex:none}
  .sk .t{font-weight:600;font-size:14px}
  .sk .t small{font-weight:400;color:var(--sub);margin-left:6px}
  .sk .d{font-size:13px;margin-top:3px;white-space:pre-wrap}
  .vals{font-size:12px;color:var(--sub);margin-top:4px;overflow-x:auto}
  .vals table{border-collapse:collapse}
  .vals td{border:1px solid var(--line);padding:1px 5px;white-space:nowrap}
  .vals td:first-child{color:var(--text)}
  .tag{display:inline-block;font-size:11px;padding:0 6px;border-radius:4px;background:var(--accent);color:#fff;margin-left:6px;vertical-align:middle}
  .card-q{color:#2a7de1;font-weight:700}.card-a{color:#1f9d55;font-weight:700}.card-b{color:#d33;font-weight:700}
  .prof{font-size:13px;white-space:pre-wrap;line-height:1.6;padding:8px 0;border-bottom:1px dashed var(--line)}
  .prof .cond{display:block;color:var(--sub);font-size:12px}
  details.older{margin:2px 0 6px 50px;font-size:13px}
  details.older summary{cursor:pointer;color:var(--sub);font-size:12px}
  details.older .sk{opacity:.8}
  .dlink{color:var(--accent);cursor:pointer;text-decoration:underline}
  .dfoot{margin-top:14px;font-size:12px;color:var(--sub)}
  .dfoot a{color:var(--sub)}
  @media (max-width:700px){.dcols{grid-template-columns:1fr}.dart{max-width:320px;margin:0 auto}#dlg{padding:0}.dbox{border-radius:0;min-height:100%}}
  @media (max-width:600px){header{position:static}main{grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:7px}.item .nm{font-size:11px}}
</style>
<style>
  .item .img{aspect-ratio:3/4;background:#8881}
  .item .img img{object-fit:cover;object-position:50% 20%}
  .item.sup .img{aspect-ratio:191/100}
  .item.sup .img img{object-position:50% 50%}
  .item .noimg{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;font-size:12px;color:var(--sub);padding:6px}
  .ty{display:inline-block;font-size:10px;font-weight:700;border-radius:4px;padding:0 4px;line-height:15px;color:#fff}
  .ty-vo{background:#e0508a}.ty-da{background:#2f8fe0}.ty-vi{background:#e0a020}.ty-as{background:#3aa070}
  .pl{display:inline-block;font-size:10px;font-weight:700;border-radius:4px;padding:0 4px;line-height:15px;color:#fff;background:#888}
  .pl-1{background:#e06a3a}.pl-2{background:#3a7ae0}.pl-3{background:#8a4ae0}
  .item .tags{position:absolute;left:3px;bottom:3px;display:flex;gap:2px}
  .item .rar.SSR{color:#f7c948}.item .rar.SR{color:#d0d6e2}.item .rar.R{color:#c48a54}
  .item .np span{font-size:10.5px}
  .tm-mem{width:100px}
  .tm-mem img{width:84px;height:84px;object-fit:cover;object-position:50% 20%}
  .tm-mem.sup img{width:96px;height:50px}
  .tm-mem.rent img{outline:3px dashed #d08a00;outline-offset:-3px}
  #teamOut{grid-template-columns:repeat(auto-fill,minmax(680px,1fr))}
  @media (max-width:760px){#teamOut{grid-template-columns:1fr}.tm-mems{overflow-x:auto}}
  .ctl2{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;margin-top:8px;font-size:13px;color:var(--sub)}
  .ctl2 select{padding:5px 7px;border:1px solid var(--line);border-radius:8px;background:var(--card)}
  #deckInfo,#ctInfo{display:block;line-height:1.7}
  .dart img{object-fit:contain;max-height:520px}
  .gr{color:#1f9d55;font-weight:700}
</style>
</head>
<body>
<header><div class="wrap">
  <div class="top">
    <a class="back" href="../">← Portal</a>
    <h1>学園アイドルマスター 收藏管理（日服）</h1>
    <span class="sp"></span>
    <button class="btn" id="btnExport">匯出</button>
    <button class="btn" id="btnImport">匯入</button>
    <button class="btn" id="btnRefresh">更新資料</button>
    <input type="file" id="fileImport" accept=".json,application/json" hidden>
  </div>
  <div class="tabs">
    <div class="tab on" data-tab="idol">Pアイドル</div>
    <div class="tab" data-tab="sup">サポートカード</div>
    <div class="tab" data-tab="deck">サポカ編成</div>
    <div class="tab" data-tab="ct">コンテスト編成</div>
  </div>
  <div id="listCtl">
    <div class="filters">
      <input type="search" id="q" placeholder="名前・カード名で検索">
      <select id="fOwn">
        <option value="all">全部</option>
        <option value="own">持有</option>
        <option value="not">未持有</option>
        <option value="max">才能開花 4／完凸</option>
        <option value="notmax">持有但未滿</option>
      </select>
      <select id="fSort">
        <option value="new">新→舊</option>
        <option value="old">舊→新</option>
        <option value="rar">稀有度 ↓</option>
        <option value="name">名前順</option>
      </select>
    </div>
    <div class="chips" id="chipRar"></div>
    <div class="chips" id="chipA"></div>
    <div class="chips" id="chipB"></div>
    <div class="stats" id="stats"></div>
  </div>
  <div id="deckCtl" hidden>
    <div class="ctl2">
      <label>Pアイドル <select id="dkIdol"></select></label>
      <label>レンタル <select id="dkRent"><option value="1">借 1 張完凸 SSR</option><option value="0">不借</option></select></label>
    </div>
    <div class="stats" id="deckInfo"></div>
  </div>
  <div id="ctCtl" hidden>
    <div class="ctl2">
      <label>ステージ重視 <select id="ctAttr"><option value="">不指定</option><option value="vo">ボーカル</option><option value="da">ダンス</option><option value="vi">ビジュアル</option></select></label>
      <label>プラン <select id="ctPlan"><option value="">不指定</option><option value="1">センス</option><option value="2">ロジック</option><option value="3">アノマリー</option></select></label>
      <label><input type="checkbox" id="ctDiff" checked> 不同アイドル</label>
    </div>
    <div class="stats" id="ctInfo"></div>
  </div>
</div></header>
<main id="grid"><div class="msg">讀取資料中…</div></main>
<section id="teamOut" hidden></section>
<div id="dlg"><div class="dbox"><button class="dclose" title="關閉">×</button><div id="dbody"></div></div></div>
<footer>資料來自遊戲 masterdata（<a href="https://github.com/vertesan/gakumasu-diff" target="_blank" rel="noopener">vertesan/gakumasu-diff</a>），圖片連結 <a href="https://game8.jp/gakuen-idolmaster/" target="_blank" rel="noopener">ゲームエイト</a>／<a href="https://github.com/gakumas-tools/gakumas-tools" target="_blank" rel="noopener">gakumas-tools</a>，著作權屬 Bandai Namco Entertainment 所有。點圖片看詳細資料，點右下圓圈打勾持有，下方選才能開花（Pアイドル）或凸數（サポカ）。持有紀錄存在此瀏覽器，換裝置請用「匯出／匯入」。</footer>

<script src="yaml.js"></script>
<script src="img.js"></script>
<script src="art.js"></script>
<script src="desc.js"></script>
<script>
const MD = 'https://raw.githubusercontent.com/vertesan/gakumasu-diff/main/';
const SAVE_KEY = 'gkms_owned_v1';
const CACHE_KEY = 'gkms_data_v1';
const FEAT_KEY = 'gkms_feat_v1';
const RAR = {Ssr:'SSR', Sr:'SR', R:'R'};
const RAR_N = {SSR:3, SR:2, R:1};
const PLAN = {1:'センス', 2:'ロジック', 3:'アノマリー', 0:'フリー'};
const STYPE = {vo:'ボーカル', da:'ダンス', vi:'ビジュアル', as:'アシスト'};
const STYPE_S = {vo:'Vo', da:'Da', vi:'Vi', as:'As'};
const EXAM = {ExamParameterBuff:'好調', ExamLessonBuff:'集中', ExamReview:'好印象', ExamCardPlayAggressive:'やる気', ExamConcentration:'強気', ExamFullPower:'温存'};
const POT = ['未開花', '開花1', '開花2', '開花3', '開花4'];
const LB = ['0凸', '1凸', '2凸', '3凸', '完凸'];

function esc(s){ return String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
const nz = s => String(s).normalize('NFKC').replace(/[^\p{L}\p{N}]/gu, '').replace(/[ー〜～]/g, '');
const G8 = p => 'https://img.game8.jp/' + p;
const TOOLS = id => `https://cdn.jsdelivr.net/gh/gakumas-tools/gakumas-tools@master/packages/gakumas-images/images/pIdols/${id}.png`;
function idolImg(x){
  const k = nz(x.title + x.cname), I = window.GK_IMG || {i:{}, t:{}};
  return I.i[k] ? G8(I.i[k]) : I.t[k] ? TOOLS(I.t[k]) : '';
}
function idolArt(x){ return ((window.GK_ART || {})[x.id] || []).map(k => 'https://cdn.gamerch.com/contents/wiki/4990/entry/' + k); }
function supImg(s){ const I = window.GK_IMG || {s:{}}; const p = I.s[nz(s.name)]; return p ? G8(p) : ''; }
function imgTag(src, alt, big){ return src ? `<img loading="lazy" src="${src}" alt=""${big ? ` data-big="${big}"` : ''}>` : `<span class="noimg">${esc(alt)}</span>`; }

let data = null;   // {idols, sups, chars, time}
let owned = {i:{}, s:{}};   // i: 1=未開花〜5=開花4，s: 1=0凸〜5=完凸
try{ const o = JSON.parse(localStorage.getItem(SAVE_KEY)); if (o && o.i) owned = {i:o.i, s:o.s || {}}; }catch(e){}
function saveOwned(){ try{ localStorage.setItem(SAVE_KEY, JSON.stringify(owned)); }catch(e){ alert('儲存失敗：' + e.message); } }
let tab = 'idol';
const F = {idol:{r:new Set(), a:new Set(), b:new Set()}, sup:{r:new Set(), a:new Set(), b:new Set()}};

async function getYaml(name){
  const r = await fetch(MD + name + '.yaml', {cache:'no-cache'});
  if (!r.ok) throw new Error(name + ' HTTP ' + r.status);
  return yamlParse(await r.text()) || [];
}
const planN = p => +(String(p).match(/Plan(\d)/) || [0, 0])[1];
async function fetchData(){
  const [ch, ic, sc] = await Promise.all([getYaml('Character'), getYaml('IdolCard'), getYaml('SupportCard')]);
  const now = Date.now(), C = {};
  ch.forEach(c => C[c.id] = (c.lastName || '') + (c.firstName || ''));
  const idols = ic.filter(x => !(+x.viewStartTime > now)).map(x => ({
    id:x.id, cid:x.characterId, cname:C[x.characterId] || x.characterId, title:x.name, r:RAR[x.rarity.split('_')[1]] || 'R',
    plan:planN(x.planType), ex:String(x.examEffectType).replace('ProduceExamEffectType_', ''), lim:!!x.isLimited, vst:+x.viewStartTime || 0, ord:String(x.order),
    st:[x.produceVocal, x.produceDance, x.produceVisual], gr:[x.produceVocalGrowthRatePermil, x.produceDanceGrowthRatePermil, x.produceVisualGrowthRatePermil], hp:x.produceStamina
  }));
  const sups = sc.filter(x => !(+x.viewStartTime > now)).map(x => ({
    id:x.id, name:x.name, r:RAR[x.rarity.split('_')[1]] || 'R', type:{Vocal:'vo', Dance:'da', Visual:'vi', Assist:'as'}[x.type.split('_')[1]] || 'as',
    plan:planN(x.planType), chars:(x.characterIds || []).map(c => C[c] || c), lim:!!x.isLimited, free:!!x.isFree, vst:+x.viewStartTime || 0, num:+x.id.split('-')[2] || 0
  }));
  const chars = ch.filter(c => c.isPlayable).map(c => ({id:c.id, name:C[c.id]}));
  const d = {idols, sups, chars, time:Date.now()};
  try{ localStorage.setItem(CACHE_KEY, JSON.stringify(d)); }catch(e){}
  return d;
}

/* ---- サポカ技能：等級檔＋ProduceSkill（約 11MB，需要時才讀，只放記憶體） ---- */
let skillDB = null, skillLoading = null;
function loadSkills(){
  if (skillDB) return Promise.resolve(skillDB);
  if (skillLoading) return skillLoading;
  skillLoading = (async () => {
    const [vo, da, vi, as, ps] = await Promise.all(['Vocal', 'Dance', 'Visual', 'Assist'].map(t => getYaml('SupportCardProduceSkillLevel' + t)).concat([getYaml('ProduceSkill')]));
    const lv = {};
    [...vo, ...da, ...vi, ...as].forEach(e => (lv[e.supportCardId] = lv[e.supportCardId] || []).push(e));
    const desc = {};
    ps.forEach(p => { if (/^p_support_skill/.test(p.id)) desc[p.id + '#' + p.level] = (p.produceDescriptions || []).map(d => d.text || '').join('').replace(/\s+$/, ''); });
    skillDB = {lv, desc};
    return skillDB;
  })();
  skillLoading.catch(() => { skillLoading = null; });
  return skillLoading;
}
const MAXLV = {R:20, SR:30, SSR:40};
const supMaxLv = (s, lb) => MAXLV[s.r] + 5 * lb;
function supSkillsAt(s, level){
  const ent = (skillDB.lv[s.id] || []).filter(e => e.supportCardLevel <= level);
  const slot = {};
  ent.forEach(e => { if (!slot[e.order] || slot[e.order].supportCardLevel < e.supportCardLevel) slot[e.order] = e; });
  return Object.keys(slot).sort((a, b) => a - b).map(o => ({o:+o, lv:slot[o].produceSkillLevel, id:slot[o].produceSkillId, t:skillDB.desc[slot[o].produceSkillId + '#' + slot[o].produceSkillLevel] || slot[o].produceSkillId}));
}
function skillValue(t){
  let m, v = 0;
  if ((m = t.match(/SPレッスン発生率\+(\d+)%/))) return +m[1] * 0.2;
  if ((m = t.match(/^初期(ボーカル|ダンス|ビジュアル)上昇\+(\d+)/))) return +m[2] * 0.04;
  if ((m = t.match(/パラメータ上昇を(\d+)%増加/))) return +m[1] * 0.02;
  if (/スキルカードサポート発生率/.test(t)) return 0.4;
  if ((m = t.match(/(ボーカル|ダンス|ビジュアル)上昇\+(\d+)/))) v = +m[2] * 0.25;
  else if (/上昇量|成長率/.test(t)){ m = t.match(/(\d+)%/); v = m ? +m[1] * 0.25 : 1.5; }
  else if (/体力回復|体力上限/.test(t)) v = 0.6;
  else if (/Pポイント|Pドリンク|Pアイテム/.test(t)) v = 0.6;
  else v = 0.3;
  return v;
}
function featScores(){
  let f = null;
  try{ f = JSON.parse(localStorage.getItem(FEAT_KEY)); }catch(e){}
  if (f && Date.now() - f.time < 3 * 86400000 && f.n === data.sups.length) return f.v;
  return null;
}
async function ensureFeat(){
  let v = featScores();
  if (v) return v;
  await loadSkills();
  v = {};
  data.sups.forEach(s => { v[s.id] = [0, 1, 2, 3, 4].map(lb => +supSkillsAt(s, supMaxLv(s, lb)).reduce((a, k) => a + skillValue(k.t), 0).toFixed(2)); });
  try{ localStorage.setItem(FEAT_KEY, JSON.stringify({time:Date.now(), n:data.sups.length, v})); }catch(e){}
  return v;
}

async function init(){
  try{ data = JSON.parse(localStorage.getItem(CACHE_KEY)); }catch(e){ data = null; }
  if (data){ buildChips(); render(); }
  if (!data || Date.now() - data.time > 86400000){
    try{
      const fresh = await fetchData();
      const changed = !data || fresh.idols.length !== data.idols.length || fresh.sups.length !== data.sups.length;
      data = fresh;
      if (changed){ buildChips(); render(); }
    }catch(err){
      if (!data) document.getElementById('grid').innerHTML = '<div class="msg">資料讀取失敗：' + esc(err.message) + '<br>請確認網路後按「更新資料」。</div>';
    }
  }
  if (!curDetail) routeHash();
  const h = location.hash.slice(1);
  if (['sup', 'deck', 'ct'].includes(h)) document.querySelector(`.tab[data-tab="${h}"]`).click();
}

/* ===== 清單 ===== */
function buildChips(){
  const isSup = tab === 'sup', f = F[isSup ? 'sup' : 'idol'];
  const mk = (id, k, vals, lab) => document.getElementById(id).innerHTML = vals.map(v => `<span class="chip${f[k].has(String(v)) ? ' on' : ''}" data-k="${k}" data-v="${v}">${lab(v)}</span>`).join('');
  mk('chipRar', 'r', ['SSR', 'SR', 'R'], v => v);
  if (isSup){
    mk('chipA', 'a', ['vo', 'da', 'vi', 'as'], v => `<span class="ty ty-${v}">${STYPE[v]}</span>`);
    mk('chipB', 'b', [1, 2, 3, 0], v => v ? `<span class="pl pl-${v}">${PLAN[v]}</span>` : 'フリー');
  } else {
    mk('chipA', 'a', data.chars.map(c => c.id), v => esc((data.chars.find(c => c.id === v) || {}).name || v));
    mk('chipB', 'b', [1, 2, 3], v => `<span class="pl pl-${v}">${PLAN[v]}</span>`);
  }
}
function filtered(){
  const q = nz(document.getElementById('q').value.trim().toLowerCase());
  const fo = document.getElementById('fOwn').value, so = document.getElementById('fSort').value;
  const isSup = tab === 'sup', f = F[isSup ? 'sup' : 'idol'], box = isSup ? owned.s : owned.i;
  const L = (isSup ? data.sups : data.idols).filter(x => {
    if (f.r.size && !f.r.has(x.r)) return false;
    if (isSup){
      if (f.a.size && !f.a.has(x.type)) return false;
      if (f.b.size && !f.b.has(String(x.plan))) return false;
    } else {
      if (f.a.size && !f.a.has(x.cid)) return false;
      if (f.b.size && !f.b.has(String(x.plan))) return false;
    }
    if (q && !nz((isSup ? x.name + x.chars.join('') : x.title + x.cname).toLowerCase()).includes(q)) return false;
    const v = box[x.id] || 0;
    if (fo === 'own' && !v) return false;
    if (fo === 'not' && v) return false;
    if (fo === 'max' && !(v >= 5)) return false;
    if (fo === 'notmax' && !(v && v < 5)) return false;
    return true;
  });
  const newer = isSup ? (a, b) => b.vst - a.vst || RAR_N[b.r] - RAR_N[a.r] || b.num - a.num : (a, b) => b.vst - a.vst || b.id.localeCompare(a.id);
  if (so === 'old') L.sort((a, b) => newer(b, a));
  else if (so === 'rar') L.sort((a, b) => RAR_N[b.r] - RAR_N[a.r] || newer(a, b));
  else if (so === 'name') L.sort((a, b) => (isSup ? a.name.localeCompare(b.name, 'ja') : a.cname.localeCompare(b.cname, 'ja') || a.title.localeCompare(b.title, 'ja')));
  else L.sort(newer);
  return L;
}
function idolCard(x){
  const v = owned.i[x.id] || 0;
  return `<div class="item${v ? ' own' : ''}${v >= 5 ? ' np5' : ''}" data-id="${x.id}" data-k="i">
    <div class="img">${imgTag(idolImg(x), x.title, idolArt(x)[0])}<span class="rar ${x.r}">${x.r}</span>
      <span class="tags"><span class="pl pl-${x.plan}">${PLAN[x.plan]}</span></span><span class="chk">✓</span></div>
    <div class="nm" title="${esc(x.title)}">${esc(x.cname)}</div>
    <div class="cls" title="${esc(x.title)}" style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(x.title)}</div>
    <div class="np" title="才能開花">${[1, 2, 3, 4, 5].map(n => `<span data-np="${n}" class="${v === n ? 'on' : ''}">${n === 1 ? '未' : n - 1}</span>`).join('')}</div></div>`;
}
function supCard(s){
  const v = owned.s[s.id] || 0;
  return `<div class="item sup${v ? ' own' : ''}${v >= 5 ? ' np5' : ''}" data-id="${s.id}" data-k="s">
    <div class="img">${imgTag(supImg(s), s.name)}<span class="rar ${s.r}">${s.r}</span>
      <span class="tags"><span class="ty ty-${s.type}">${STYPE_S[s.type]}</span>${s.plan ? `<span class="pl pl-${s.plan}">${PLAN[s.plan]}</span>` : ''}</span><span class="chk">✓</span></div>
    <div class="nm" title="${esc(s.name)}">${esc(s.name)}</div>
    <div class="cls" style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(s.chars.join('・'))}</div>
    <div class="np" title="凸數">${[1, 2, 3, 4, 5].map(n => `<span data-np="${n}" class="${v === n ? 'on' : ''}">${n === 5 ? '完' : n - 1}</span>`).join('')}</div></div>`;
}
function render(){
  if (!data) return;
  const L = filtered(), g = document.getElementById('grid');
  g.innerHTML = L.length ? L.map(tab === 'sup' ? supCard : idolCard).join('') : '<div class="msg">沒有符合的項目</div>';
  renderStats(L.length);
}
function renderStats(shown){
  const isSup = tab === 'sup', L = isSup ? data.sups : data.idols, box = isSup ? owned.s : owned.i, own = L.filter(x => box[x.id]);
  let h = `<span>持有 <b>${own.length}</b> / ${L.length}</span>` + ['SSR', 'SR', 'R'].map(r => `<span>${r} <b>${own.filter(x => x.r === r).length}</b>/${L.filter(x => x.r === r).length}</span>`).join('');
  h += isSup ? `<span>SSR 完凸 <b>${own.filter(x => x.r === 'SSR' && box[x.id] >= 5).length}</b></span>` : `<span>開花4 <b>${own.filter(x => box[x.id] >= 5).length}</b></span>`;
  h += `<span>顯示中 ${shown}</span>`;
  if (data.time) h += `<span>資料：${new Date(data.time).toLocaleString()}</span>`;
  document.getElementById('stats').innerHTML = h;
}
function setOwn(k, id, v){
  const box = k === 's' ? owned.s : owned.i;
  if (v) box[id] = v; else delete box[id];
  saveOwned();
  const el = document.querySelector(`#grid .item[data-k="${k}"][data-id="${id}"]`);
  if (el){ const tmp = document.createElement('div'); tmp.innerHTML = (k === 's' ? supCard : idolCard)(findX(k, id)); el.replaceWith(tmp.firstElementChild); }
  if (!document.getElementById('grid').hidden) renderStats(document.querySelectorAll('#grid .item').length);
}
document.getElementById('grid').addEventListener('click', ev => {
  const el = ev.target.closest('.item'); if (!el) return;
  const id = el.dataset.id, k = el.dataset.k, np = ev.target.closest('[data-np]');
  const box = k === 's' ? owned.s : owned.i;
  if (np) setOwn(k, id, +np.dataset.np);
  else if (ev.target.closest('.chk')) setOwn(k, id, box[id] ? 0 : 1);
  else { pushedHash = true; location.hash = k + '/' + id; }
});

/* ===== 詳細資料 ===== */
let curDetail = null, pushedHash = false;
function findX(k, id){ return k === 's' ? data.sups.find(s => s.id === id) : data.idols.find(c => c.id === id); }
function ownBarHTML(k, x){
  const box = k === 's' ? owned.s : owned.i, v = box[x.id] || 0;
  let h = `<label style="display:flex;align-items:center;gap:6px;cursor:pointer;font-weight:600"><input type="checkbox" id="downChk" ${v ? 'checked' : ''}> 持有</label>`;
  if (v) h += `<div class="np">${[1, 2, 3, 4, 5].map(n => `<span data-dnp="${n}" class="${v === n ? 'on' : ''}">${k === 's' ? LB[n - 1] : POT[n - 1]}</span>`).join('')}</div>`;
  return h;
}
function headHTML(k, x){
  const img = k === 's' ? supImg(x) : idolImg(x);
  return `<div class="dhead">${img ? `<img src="${img}" alt="" style="object-fit:cover">` : ''}<div>
    <div class="ruby">${k === 's' ? esc(x.chars.join('・')) : esc(x.cname)}</div><h2>${esc(k === 's' ? x.name : x.title)}</h2>
    <div class="meta">${x.r}｜${k === 's' ? `<span class="ty ty-${x.type}">${STYPE[x.type]}</span>｜` : ''}<span class="pl pl-${x.plan}">${PLAN[x.plan]}</span>${k === 'i' ? '｜' + esc(EXAM[x.ex] || x.ex) : ''}${x.lim ? '｜限定' : ''}${x.vst ? '｜' + new Date(x.vst).toLocaleDateString() : ''}</div></div></div>
    <div class="down" id="down">${ownBarHTML(k, x)}</div>`;
}
function descBlock(t, arr){
  if (!arr || !arr.length) return '';
  return `<h3>${t}</h3>` + arr.map((c, i) => `<div class="sk"><div><div class="t">${esc(c.n)}${c.cat ? `<small>${esc(c.cat)}</small>` : ''}${c.st !== undefined ? `<small>体力 ${c.fst ? c.fst + '（固定）' : c.st}</small>` : ''}${i ? '<span class="tag">強化</span>' : ''}</div><div class="d">${esc(c.d)}</div></div></div>`).join('');
}
function idolDetail(x){
  const img = idolImg(x), art = idolArt(x), ai = Math.min(curDetail.art || 0, Math.max(art.length - 1, 0));
  const tot = x.st.reduce((a, b) => a + b, 0), D = ((window.GK_DESC || {}).i || {})[x.id] || {}, P = ((window.GK_DESC || {}).p || {})[x.cid] || [];
  const main = art[ai] || img;
  return `<div class="dcols"><div class="dart">${main ? `<img id="dimg" src="${main}" alt="">` : '<p style="color:var(--sub)">（沒有圖片）</p>'}
      ${art.length > 1 ? `<div class="asc">${art.map((u, i) => `<span data-art="${i}" class="${i === ai ? 'on' : ''}">${['覚醒前', '覚醒後'][i] || 'イラスト' + (i + 1)}</span>`).join('')}</div>` : ''}</div><div>
    <h3>初期パラメータ</h3>
    <table class="kv"><tr><th></th><th>ボーカル</th><th>ダンス</th><th>ビジュアル</th><th>合計</th><th>体力</th></tr>
      <tr><th>初期</th>${x.st.map(n => `<td>${n}</td>`).join('')}<td>${tot}</td><td>${x.hp}</td></tr>
      <tr><th>成長率</th>${x.gr.map(n => `<td class="${n === Math.max(...x.gr) ? 'gr' : ''}">${n ? '+' + n / 10 + '%' : '-'}</td>`).join('')}<td></td><td></td></tr></table>
    <table class="kv" style="margin-top:8px"><tr><th>プラン</th><td><span class="pl pl-${x.plan}">${PLAN[x.plan]}</span></td></tr>
      <tr><th>おすすめ効果</th><td>${esc(EXAM[x.ex] || x.ex)}</td></tr><tr><th>得意</th><td>${['ボーカル', 'ダンス', 'ビジュアル'].filter((_, i) => x.gr[i] === Math.max(...x.gr)).join('・')}</td></tr>
      <tr><th>入手</th><td>${x.lim ? '限定' : '通常'}</td></tr><tr><th>ID</th><td>${esc(x.id)}</td></tr></table>
    ${descBlock('固有スキルカード', D.card)}${descBlock('固有スキルカード 2', D.card2)}${descBlock('固有Pアイテム', D.it)}
    </div></div>
    ${P.length ? `<h3>プロフィール・${esc(x.cname)}</h3><table class="kv">${P.filter(r => r[0] !== '紹介').reduce((a, r, i, A) => a + (i % 2 ? '' : '<tr>') + `<th>${esc(r[0])}</th><td>${esc(r[1])}</td>` + (i % 2 || i === A.length - 1 ? '</tr>' : ''), '')}</table>
      ${P.filter(r => r[0] === '紹介').map(r => `<div class="prof">${esc(r[1])}</div>`).join('')}` : ''}
    <div class="dfoot">數值・スキル・プロフィール：masterdata（vertesan/gakumasu-diff）；カードイラスト：<a href="https://gamerch.com/gakumasu/850392" target="_blank" rel="noopener">学マスWiki（Gamerch）</a>。</div>`;
}
function supDetail(s){
  const img = supImg(s), v = owned.s[s.id] || 0, lb = v ? v - 1 : 4;
  let sk = '<h3>サポートスキル</h3><p id="skLoad" style="color:var(--sub)">讀取スキル資料中（第一次約 11MB）…</p>';
  if (skillDB){
    const L = supSkillsAt(s, supMaxLv(s, lb)), L4 = supSkillsAt(s, supMaxLv(s, 4));
    sk = `<h3>サポートスキル（${v ? '目前 ' + LB[lb] : '完凸'}・Lv${supMaxLv(s, lb)}）</h3>` + L.map(k => `<div class="sk"><div><div class="t">スキル${k.o}<small>Lv${k.lv}</small></div><div class="d">${esc(k.t)}</div></div></div>`).join('');
    if (v && lb < 4) sk += `<details class="older"><summary>完凸（Lv${supMaxLv(s, 4)}）時</summary>${L4.map(k => `<div class="sk"><div><div class="t">スキル${k.o}<small>Lv${k.lv}</small></div><div class="d">${esc(k.t)}</div></div></div>`).join('')}</details>`;
  }
  return `<div class="dcols"><div class="dart">${img ? `<img src="${img}" alt="">` : '<p style="color:var(--sub)">（沒有圖片）</p>'}</div><div>
    <table class="kv"><tr><th>タイプ</th><td><span class="ty ty-${s.type}">${STYPE[s.type]}</span></td></tr><tr><th>プラン</th><td>${PLAN[s.plan]}</td></tr>
      <tr><th>レア</th><td>${s.r}</td></tr><tr><th>最大 Lv</th><td>${[0, 1, 2, 3, 4].map(l => LB[l] + ' ' + supMaxLv(s, l)).join('／')}</td></tr>
      <tr><th>登場</th><td>${esc(s.chars.join('・'))}</td></tr><tr><th>入手</th><td>${s.lim ? '限定' : '通常'}${s.free ? '' : ''}</td></tr><tr><th>ID</th><td>${esc(s.id)}</td></tr></table>
    </div></div>${sk}`;
}
function paint(){
  const {k, id} = curDetail, x = findX(k, id);
  document.getElementById('dbody').innerHTML = headHTML(k, x) + (k === 's' ? supDetail(x) : idolDetail(x));
}
function openDetail(k, id){
  const x = data && findX(k, id);
  if (!x){ closeDetail(); return; }
  curDetail = {k, id};
  document.getElementById('dlg').classList.add('on');
  document.body.classList.add('lock');
  paint();
  document.getElementById('dlg').scrollTop = 0;
  if (k === 's' && !skillDB) loadSkills().then(() => { if (curDetail && curDetail.id === id) paint(); })
    .catch(err => { const p = document.getElementById('skLoad'); if (p) p.textContent = 'スキル資料讀取失敗：' + err.message; });
}
function closeDetail(){ curDetail = null; document.getElementById('dlg').classList.remove('on'); document.body.classList.remove('lock'); }
function hideDetail(){
  if (pushedHash){ pushedHash = false; history.back(); }
  else { history.replaceState(null, '', location.pathname + location.search); closeDetail(); }
}
function routeHash(){
  const m = location.hash.match(/^#([is])\/(.+)$/);
  if (m && data) openDetail(m[1], decodeURIComponent(m[2])); else closeDetail();
}
window.addEventListener('hashchange', routeHash);
document.querySelector('.dclose').addEventListener('click', hideDetail);
document.addEventListener('keydown', ev => { if (ev.key === 'Escape' && curDetail) hideDetail(); });
function repaintKeep(){ const y = document.getElementById('dlg').scrollTop; paint(); document.getElementById('dlg').scrollTop = y; }
document.getElementById('dlg').addEventListener('click', ev => {
  if (ev.target.id === 'dlg'){ hideDetail(); return; }
  const np = ev.target.closest('[data-dnp]');
  if (np && curDetail){ setOwn(curDetail.k, curDetail.id, +np.dataset.dnp); repaintKeep(); }
  const ar = ev.target.closest('[data-art]');
  if (ar && curDetail){ curDetail.art = +ar.dataset.art; repaintKeep(); }
});
document.getElementById('dlg').addEventListener('change', ev => {
  if (ev.target.id === 'downChk' && curDetail){ setOwn(curDetail.k, curDetail.id, ev.target.checked ? 1 : 0); repaintKeep(); }
});

/* ===== 分頁、篩選、匯出入 ===== */
document.querySelectorAll('.tab').forEach(t => t.addEventListener('click', () => {
  document.querySelectorAll('.tab').forEach(x => x.classList.toggle('on', x === t));
  const prev = tab; tab = t.dataset.tab;
  const isList = tab === 'idol' || tab === 'sup';
  document.getElementById('listCtl').hidden = !isList;
  document.getElementById('grid').hidden = !isList;
  document.getElementById('deckCtl').hidden = tab !== 'deck';
  document.getElementById('ctCtl').hidden = tab !== 'ct';
  document.getElementById('teamOut').hidden = isList;
  window.scrollTo(0, 0);
  if (!data) return;
  if (isList){
    if (prev !== tab){ document.getElementById('q').value = ''; document.getElementById('fOwn').value = 'all'; }
    buildChips(); render();
  } else TEAM.render(tab);
}));
document.querySelectorAll('#listCtl .chips').forEach(box => box.addEventListener('click', ev => {
  const c = ev.target.closest('.chip'); if (!c) return;
  const f = F[tab === 'sup' ? 'sup' : 'idol'][c.dataset.k], v = c.dataset.v;
  f.has(v) ? f.delete(v) : f.add(v);
  c.classList.toggle('on'); render();
}));
let qTimer;
document.getElementById('q').addEventListener('input', () => { clearTimeout(qTimer); qTimer = setTimeout(render, 150); });
['fOwn', 'fSort'].forEach(id => document.getElementById(id).addEventListener('change', render));
document.getElementById('btnRefresh').addEventListener('click', async () => {
  const b = document.getElementById('btnRefresh');
  b.disabled = true; b.textContent = '更新中…';
  try{ data = await fetchData(); skillDB = null; try{ localStorage.removeItem(FEAT_KEY); }catch(e){} if (tab === 'idol' || tab === 'sup'){ buildChips(); render(); } else TEAM.render(tab); b.textContent = '已更新'; }
  catch(err){ alert('更新失敗：' + err.message); }
  setTimeout(() => { b.disabled = false; b.textContent = '更新資料'; }, 1500);
});
document.getElementById('btnExport').addEventListener('click', () => {
  const blob = new Blob([JSON.stringify({game:'gakumas', version:1, exported:new Date().toISOString(), i:owned.i, s:owned.s}, null, 1)], {type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'gakumas_owned_' + new Date().toISOString().slice(0, 10) + '.json';
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
});
document.getElementById('btnImport').addEventListener('click', () => document.getElementById('fileImport').click());
document.getElementById('fileImport').addEventListener('change', async ev => {
  const f = ev.target.files[0]; if (!f) return;
  try{
    const o = JSON.parse(await f.text());
    if (!o.i) throw new Error('格式不符');
    if (!confirm(`匯入 Pアイドル ${Object.keys(o.i).length}、サポカ ${Object.keys(o.s || {}).length} 筆，會覆蓋目前紀錄，確定？`)) return;
    owned = {i:o.i, s:o.s || {}}; saveOwned(); render();
  }catch(err){ alert('匯入失敗：' + err.message); }
  ev.target.value = '';
});
</script>
<script src="team.js"></script>
<script>TEAM.init(); init();</script>
<script src="../hover.js"></script>
