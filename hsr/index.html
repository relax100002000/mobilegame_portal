<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>崩壞：星穹鐵道 收藏管理</title>
<style>
  :root{--bg:#f3f4f8;--card:#fff;--text:#1d2130;--sub:#6b7085;--line:#e3e5ee;--accent:#4a5cff;--ok:#1f9d55;--gold:#d4a017}
  @media (prefers-color-scheme: dark){:root{--bg:#14161d;--card:#1f2230;--text:#eceef5;--sub:#9aa0b5;--line:#2e3244;--accent:#8c98ff;--ok:#3ccf7a}}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);font-family:"Segoe UI","Noto Sans TC","Microsoft JhengHei",sans-serif}
  header{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
  .wrap{max-width:1300px;margin:0 auto;padding:10px 14px}
  .top{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .top h1{margin:0;font-size:20px}
  .top a.back{color:var(--sub);text-decoration:none;font-size:14px}
  .top .sp{flex:1}
  button,select,input{font:inherit;color:var(--text)}
  .btn{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:6px 10px;cursor:pointer;font-size:13px}
  .btn:hover{border-color:var(--accent)}
  .tabs{display:flex;gap:6px;margin-top:10px}
  .tab{padding:7px 16px;border-radius:8px 8px 0 0;border:1px solid var(--line);border-bottom:none;background:var(--card);cursor:pointer;font-weight:600;color:var(--sub)}
  .tab.on{background:var(--accent);border-color:var(--accent);color:#fff}
  .filters{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:8px}
  .filters input[type=search]{flex:1;min-width:180px;padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:var(--card)}
  .filters select{padding:6px 8px;border:1px solid var(--line);border-radius:8px;background:var(--card)}
  .chips{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}
  .chip{padding:3px 9px;border:1px solid var(--line);border-radius:999px;background:var(--card);cursor:pointer;font-size:12px;user-select:none}
  .chip.on{background:var(--accent);border-color:var(--accent);color:#fff}
  .stats{margin-top:8px;font-size:13px;color:var(--sub);display:flex;flex-wrap:wrap;gap:4px 14px}
  .stats b{color:var(--text)}
  main{max-width:1300px;margin:0 auto;padding:14px;display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:10px}
  .item{position:relative;background:var(--card);border:2px solid var(--line);border-radius:10px;overflow:hidden;cursor:pointer;display:flex;flex-direction:column;user-select:none}
  .item .img{position:relative;aspect-ratio:1/1;background:#0002}
  .item img{width:100%;height:100%;object-fit:cover;display:block;filter:grayscale(1);opacity:.45;transition:.15s}
  .item.own{border-color:var(--ok)}
  .item.own img{filter:none;opacity:1}
  .item .no{position:absolute;left:4px;top:4px;background:#000a;color:#fff;font-size:11px;padding:1px 5px;border-radius:5px}
  .item .rar{position:absolute;right:4px;top:4px;background:#000a;color:var(--gold);font-size:11px;padding:1px 5px;border-radius:5px}
  .item .chk{position:absolute;right:4px;bottom:4px;width:24px;height:24px;border-radius:50%;background:#fffc;border:2px solid #888;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:700;color:transparent}
  .item.own .chk{background:var(--ok);border-color:#fff;color:#fff}
  .item .nm{font-size:12px;line-height:1.3;padding:4px 5px 2px;height:36px;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
  .item .cls{font-size:11px;color:var(--sub);padding:0 5px}
  .np{display:flex;gap:2px;padding:4px 4px 5px;visibility:hidden}
  .item.own .np{visibility:visible}
  .np span{flex:1;text-align:center;font-size:11px;border:1px solid var(--line);border-radius:4px;padding:2px 0;color:var(--sub)}
  .np span.on{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:700}
  .np span.mlb{flex:1}
  .item.np5 .np span.on{background:var(--gold);border-color:var(--gold)}
  main[hidden],#teamOut[hidden]{display:none}
  .filters label{font-size:13px;color:var(--sub);display:flex;align-items:center;gap:5px}
  #teamOut{max-width:1300px;margin:0 auto;padding:14px;display:grid;grid-template-columns:repeat(auto-fill,minmax(400px,1fr));gap:12px}
  .tm-card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
  .tm-head{font-size:13px;display:flex;gap:8px;align-items:center;margin-bottom:8px}
  .tm-b{font-size:12px;padding:2px 8px;border-radius:6px;color:#fff;font-weight:600}
  .tm-b.ok{background:var(--ok)}.tm-b.mid{background:#d08a00}.tm-b.ng{background:#c33}
  .tm-mems{display:flex;gap:8px}
  .tm-mem{width:84px;cursor:pointer;text-align:center}
  .tm-mem img{width:72px;height:72px;border-radius:8px;display:block;margin:0 auto}
  .tm-tag{display:inline-block;font-size:11px;padding:0 6px;border-radius:4px;margin-top:3px;color:#fff;background:#888}
  .tm-tag.t-dps{background:#c33}.tm-tag.t-own{background:var(--accent)}.tm-tag.t-friend{background:#d08a00}
  .tm-nm{font-size:11px;line-height:1.25;margin-top:2px;max-height:2.5em;overflow:hidden}
  table.tm-w{width:100%;border-collapse:collapse;font-size:12px;margin-top:8px}
  table.tm-w th,table.tm-w td{border-top:1px solid var(--line);padding:3px 4px;text-align:left;white-space:nowrap}
  table.tm-w th{color:var(--sub);font-weight:400}
  table.tm-w td.tm-plan{white-space:normal;color:var(--sub)}
  .tm-ok{color:var(--ok);font-weight:700}.tm-ng{color:#c33;font-weight:700}
  @media (max-width:600px){#teamOut{grid-template-columns:1fr;padding:8px}}
  .msg{grid-column:1/-1;text-align:center;color:var(--sub);padding:40px 0}
  footer{text-align:center;color:var(--sub);font-size:12px;padding:0 16px 30px}
  footer a{color:var(--sub)}
  .item .chk{width:30px;height:30px;right:3px;bottom:3px;font-size:17px}
  .item .chk:hover{border-color:var(--ok)}
  /* detail modal */
  #dlg{position:fixed;inset:0;z-index:20;background:#000a;display:none;align-items:flex-start;justify-content:center;overflow-y:auto;padding:24px 10px}
  #dlg.on{display:flex}
  body.lock{overflow:hidden}
  .dbox{position:relative;background:var(--card);border-radius:14px;max-width:880px;width:100%;padding:18px 20px 22px;box-shadow:0 20px 50px #0008}
  .dclose{position:absolute;right:10px;top:8px;border:none;background:none;font-size:28px;cursor:pointer;color:var(--sub);line-height:1}
  .dhead{display:flex;gap:14px;align-items:center;padding-right:30px}
  .dhead img{width:72px;height:72px;border-radius:8px}
  .dhead h2{margin:0;font-size:20px}
  .dhead .ruby{color:var(--sub);font-size:12px}
  .dhead .meta{color:var(--sub);font-size:13px;margin-top:2px}
  .down{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:12px 0 4px;padding:8px 10px;border:1px solid var(--line);border-radius:10px}
  .down .np{visibility:visible;padding:0;gap:4px}
  .down .np span{cursor:pointer;padding:4px 10px;font-size:13px}
  .dcols{display:grid;grid-template-columns:minmax(0,300px) minmax(0,1fr);gap:18px;margin-top:12px}
  .dart img{width:100%;border-radius:8px;display:block;background:#0002;min-height:200px}
  .dart .asc{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
  .dart .asc span{font-size:12px;padding:2px 8px;border:1px solid var(--line);border-radius:6px;cursor:pointer}
  .dart .asc span.on{background:var(--accent);border-color:var(--accent);color:#fff}
  .dbox h3{font-size:15px;margin:16px 0 6px;padding-bottom:4px;border-bottom:1px solid var(--line)}
  .dcols h3:first-child{margin-top:0}
  table.kv{border-collapse:collapse;font-size:13px;width:100%}
  table.kv th,table.kv td{border:1px solid var(--line);padding:4px 6px;text-align:left;vertical-align:top}
  table.kv th{background:#8881;white-space:nowrap;font-weight:600;width:1%}
  .sk{display:flex;gap:10px;padding:8px 0;border-bottom:1px dashed var(--line)}
  .sk:last-child{border-bottom:none}
  .sk img{width:40px;height:40px;flex:none}
  .sk .t{font-weight:600;font-size:14px}
  .sk .t small{font-weight:400;color:var(--sub);margin-left:6px}
  .sk .d{font-size:13px;margin-top:3px;white-space:pre-wrap}
  .vals{font-size:12px;color:var(--sub);margin-top:4px;overflow-x:auto}
  .vals table{border-collapse:collapse}
  .vals td{border:1px solid var(--line);padding:1px 5px;white-space:nowrap}
  .vals td:first-child{color:var(--text)}
  .tag{display:inline-block;font-size:11px;padding:0 6px;border-radius:4px;background:var(--accent);color:#fff;margin-left:6px;vertical-align:middle}
  .card-q{color:#2a7de1;font-weight:700}.card-a{color:#1f9d55;font-weight:700}.card-b{color:#d33;font-weight:700}
  .prof{font-size:13px;white-space:pre-wrap;line-height:1.6;padding:8px 0;border-bottom:1px dashed var(--line)}
  .prof .cond{display:block;color:var(--sub);font-size:12px}
  details.older{margin:2px 0 6px 50px;font-size:13px}
  details.older summary{cursor:pointer;color:var(--sub);font-size:12px}
  details.older .sk{opacity:.8}
  .dlink{color:var(--accent);cursor:pointer;text-decoration:underline}
  .dfoot{margin-top:14px;font-size:12px;color:var(--sub)}
  .dfoot a{color:var(--sub)}
  @media (max-width:700px){.dcols{grid-template-columns:1fr}.dart{max-width:320px;margin:0 auto}#dlg{padding:0}.dbox{border-radius:0;min-height:100%}}
  @media (max-width:600px){header{position:static}main{grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:7px}.item .nm{font-size:11px}}
</style>
<style>
  .item .np span{font-size:10px;padding:2px 0}
  .el{display:inline-block;width:16px;height:16px;vertical-align:-3px}
  .item .elm{position:absolute;left:4px;bottom:4px;width:22px;height:22px;background:#000a;border-radius:50%;padding:2px}
  .hl{color:#e8a33d;font-weight:700}
  .stat-tags{display:flex;flex-wrap:wrap;gap:6px;font-size:12px}
  .stat-tags span{border:1px solid var(--line);border-radius:6px;padding:2px 8px}
  .sl{display:flex;gap:4px;flex-wrap:wrap;margin:4px 0}
  .sl span{font-size:12px;padding:1px 8px;border:1px solid var(--line);border-radius:6px;cursor:pointer}
  .sl span.on{background:var(--accent);border-color:var(--accent);color:#fff}
  .reason{font-size:12px;color:var(--sub);margin-top:6px;line-height:1.5}
  .tm-tag.t-sup{background:var(--accent)}.tm-tag.t-sus{background:var(--ok)}.tm-tag.t-sub{background:#8a5cff}
  .tm-mem{width:120px}
  #teamOut{grid-template-columns:repeat(auto-fill,minmax(540px,1fr))}
  @media (max-width:600px){#teamOut{grid-template-columns:1fr}.tm-mem{width:calc(50% - 6px)}}
  .tm-lc{display:flex;gap:4px;align-items:flex-start;text-align:left;font-size:11px;line-height:1.3;margin-top:6px;padding-top:6px;border-top:1px dashed var(--line);cursor:pointer}
  .tm-lc img{width:30px;height:30px;border-radius:4px;flex:none;margin:0}
  .tm-lc small{color:var(--sub)}
  .tm-lc.none{color:var(--sub);cursor:default}
  .tm-sig{font-size:10px;color:#d08a00;margin-top:3px;text-align:left}
  .tm-mems{flex-wrap:wrap}
  .roleSel{padding:4px 6px;border:1px solid var(--line);border-radius:6px;background:var(--card);color:var(--text)}
</style>
</head>
<body>
<header><div class="wrap">
  <div class="top">
    <a class="back" href="../">← Portal</a>
    <h1>崩壞：星穹鐵道 收藏管理</h1>
    <span class="sp"></span>
    <button class="btn" id="btnExport">匯出</button>
    <button class="btn" id="btnImport">匯入</button>
    <button class="btn" id="btnRefresh">更新資料</button>
    <input type="file" id="fileImport" accept=".json,application/json" hidden>
  </div>
  <div class="tabs">
    <div class="tab on" data-tab="chr">角色</div>
    <div class="tab" data-tab="lc">光錐</div>
    <div class="tab" data-tab="team">簡易組隊</div>
  </div>
  <div id="listCtl">
    <div class="filters">
      <input type="search" id="q" placeholder="搜尋名稱">
      <select id="fOwn">
        <option value="all">全部</option>
        <option value="own">持有</option>
        <option value="not">未持有</option>
        <option value="max">滿星魂／疊影5</option>
        <option value="notmax">持有但未滿</option>
      </select>
      <select id="fSort">
        <option value="new">實裝 新→舊</option>
        <option value="old">實裝 舊→新</option>
        <option value="rar">稀有度 ↓</option>
      </select>
    </div>
    <div class="chips" id="chipRar"></div>
    <div class="chips" id="chipPath"></div>
    <div class="chips" id="chipElem"></div>
    <div class="stats" id="stats"></div>
  </div>
  <div id="teamCtl" hidden>
    <div class="filters"><span style="font-size:13px;color:var(--sub)">敵人弱點（可複選）</span></div>
    <div class="chips" id="tmWeak"></div>
    <div class="filters">
      <label>顯示 <select id="tmShow"><option value="10">10 隊</option><option value="20" selected>20 隊</option><option value="50">50 隊</option></select></label>
      <label><input type="checkbox" id="tmMatchOnly"> 只列主 C 屬性符合弱點的</label>
      <label><input type="checkbox" id="tmLC" checked> 搭配光錐</label>
    </div>
    <div class="stats" id="teamInfo"></div>
  </div>
</div></header>
<main id="grid"><div class="msg">讀取資料中…</div></main>
<section id="teamOut" hidden></section>
<div id="dlg"><div class="dbox"><button class="dclose" title="關閉">×</button><div id="dbody"></div></div></div>
<footer>資料與圖片來自 <a href="https://sr.yatta.moe/" target="_blank" rel="noopener">Project Yatta</a>，著作權屬 HoYoverse 所有。點圖片看詳細資料，點右下圓圈打勾持有。持有紀錄存在此瀏覽器，換裝置請用「匯出／匯入」。</footer>

<script>
const API = 'https://sr.yatta.moe/api/v2/cht/';
const ASSET = 'https://sr.yatta.moe/hsr/assets/UI/';
const SAVE_KEY = 'hsr_owned_v1';
const ROLE_KEY = 'hsr_role_v1';
const CACHE_KEY = 'hsr_data_v1';

const PATH = {Warrior:'毀滅', Rogue:'巡獵', Mage:'智識', Shaman:'同諧', Warlock:'虛無', Knight:'存護', Priest:'豐饒', Memory:'記憶', Elation:'歡愉'};
const ELEM = {Physical:'物理', Fire:'火', Ice:'冰', Thunder:'雷', Wind:'風', Quantum:'量子', Imaginary:'虛數'};
const ELEM_COLOR = {Physical:'#9a9a9a', Fire:'#e2533c', Ice:'#4fb4e8', Thunder:'#b05ce6', Wind:'#3fc59a', Quantum:'#5b5fe0', Imaginary:'#e8c23a'};
const ROLE = {dps:'主 C', sub:'副 C', sup:'輔助', sus:'生存'};

function stripTags(s){ return String(s || '').replace(/<[^>]+>/g, ''); }
function esc(s){ return String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

let data = null;    // {chr:[], lc:[], time}
let owned = loadJSON(SAVE_KEY, {chr:{}, lc:{}});   // chr: 星魂+1 (1..7)，lc: 疊影 (1..5)
let roleOv = loadJSON(ROLE_KEY, {});
let tab = 'chr';
const fRar = {chr:new Set(), lc:new Set()}, fPath = {chr:new Set(), lc:new Set()}, fElem = new Set();

function loadJSON(k, def){ try{ const o = JSON.parse(localStorage.getItem(k)); if (o) return Object.assign(def, o); }catch(e){} return def; }
function saveOwned(){ try{ localStorage.setItem(SAVE_KEY, JSON.stringify(owned)); }catch(e){ alert('儲存失敗：' + e.message); } }

function trim(cRaw, lRaw){
  const now = Date.now() / 1000;
  const chr = Object.values(cRaw.data.items).filter(x => !x.release || x.release <= now).map(x => {
    let name = stripTags(x.name);
    if (x.id > 8000) name += '（' + PATH[x.types.pathType] + '・' + (x.id % 2 ? '男' : '女') + '）';
    return {id:x.id, name, r:x.rank, p:x.types.pathType, e:x.types.combatType, rel:x.release || 0, icon:x.icon};
  });
  const lc = Object.values(lRaw.data.items).map(x => ({id:x.id, name:stripTags(x.name), r:x.rank, p:x.types.pathType, rel:x.id, icon:x.icon}));
  return {chr, lc, time:Date.now()};
}
async function fetchData(){
  const get = u => fetch(API + u, {cache:'no-cache'}).then(r => { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); });
  const [c, l] = await Promise.all([get('avatar'), get('equipment')]);
  const d = trim(c, l);
  try{ localStorage.setItem(CACHE_KEY, JSON.stringify(d)); }catch(e){}
  return d;
}
async function init(){
  try{ data = JSON.parse(localStorage.getItem(CACHE_KEY)); }catch(e){ data = null; }
  if (data){ buildChips(); render(); }
  try{
    const fresh = await fetchData();
    const changed = !data || fresh.chr.length !== data.chr.length || fresh.lc.length !== data.lc.length;
    data = fresh;
    if (changed){ buildChips(); render(); }
  }catch(err){
    if (!data) document.getElementById('grid').innerHTML = '<div class="msg">資料讀取失敗：' + esc(err.message) + '<br>請確認網路後按「更新資料」。</div>';
  }
  if (!curDetail) routeHash();
}

function faceOf(t, x){ return ASSET + (t === 'chr' ? 'avatar/medium/' : 'equipment/medium/') + x.icon + '.png'; }
function elemDot(e){ return `<span class="el" style="background:${ELEM_COLOR[e]};border-radius:50%" title="${ELEM[e]}"></span>`; }

function buildChips(){
  const list = data[tab];
  const rars = [...new Set(list.map(x => x.r))].sort((a, b) => b - a);
  document.getElementById('chipRar').innerHTML = rars.map(r => `<span class="chip${fRar[tab].has(r)?' on':''}" data-r="${r}">★${r}</span>`).join('');
  document.getElementById('chipPath').innerHTML = Object.keys(PATH).filter(p => list.some(x => x.p === p))
    .map(p => `<span class="chip${fPath[tab].has(p)?' on':''}" data-p="${p}">${PATH[p]}</span>`).join('');
  document.getElementById('chipElem').innerHTML = tab === 'chr' ? Object.keys(ELEM)
    .map(e => `<span class="chip${fElem.has(e)?' on':''}" data-e="${e}">${elemDot(e)} ${ELEM[e]}</span>`).join('') : '';
}

function maxVal(t = tab){ return t === 'chr' ? 7 : 5; }
function filtered(){
  const q = document.getElementById('q').value.trim().toLowerCase();
  const fo = document.getElementById('fOwn').value, so = document.getElementById('fSort').value, mx = maxVal();
  const list = data[tab].filter(x => {
    if (fRar[tab].size && !fRar[tab].has(x.r)) return false;
    if (fPath[tab].size && !fPath[tab].has(x.p)) return false;
    if (tab === 'chr' && fElem.size && !fElem.has(x.e)) return false;
    if (q && !x.name.toLowerCase().includes(q)) return false;
    const v = owned[tab][x.id] || 0;
    if (fo === 'own' && !v) return false;
    if (fo === 'not' && v) return false;
    if (fo === 'max' && v !== mx) return false;
    if (fo === 'notmax' && !(v && v < mx)) return false;
    return true;
  });
  if (so === 'old') list.sort((a, b) => a.rel - b.rel || a.id - b.id);
  else if (so === 'rar') list.sort((a, b) => b.r - a.r || b.rel - a.rel);
  else list.sort((a, b) => b.rel - a.rel || b.id - a.id);
  return list;
}

function lvBtns(t, v, full){
  return t === 'chr'
    ? [1,2,3,4,5,6,7].map(n => `<span data-np="${n}" class="${v===n?'on':''}" title="星魂 E${n-1}">${full ? 'E' : ''}${n-1}</span>`).join('')
    : [1,2,3,4,5].map(n => `<span data-np="${n}" class="${v===n?'on':''}" title="疊影 ${n}">S${n}</span>`).join('');
}
function cardHTML(x){
  const v = owned[tab][x.id] || 0, mx = maxVal();
  return `<div class="item${v ? ' own' : ''}${v === mx ? ' np5' : ''}" data-id="${x.id}">
    <div class="img"><img loading="lazy" src="${faceOf(tab, x)}" data-big="${ASSET}${tab === 'chr' ? 'avatar' : 'equipment'}/large/${x.icon}.png" alt=""><span class="rar">★${x.r}</span>
      ${tab === 'chr' ? `<span class="elm">${elemDot(x.e)}</span>` : ''}<span class="chk">✓</span></div>
    <div class="nm" title="${esc(x.name)}">${esc(x.name)}</div>
    <div class="cls">${PATH[x.p] || x.p}${tab === 'chr' ? '・' + ELEM[x.e] : ''}</div>
    <div class="np" title="${tab === 'chr' ? '星魂' : '疊影'}">${lvBtns(tab, v)}</div></div>`;
}
function render(){
  if (!data) return;
  const list = filtered();
  document.getElementById('grid').innerHTML = list.length ? list.map(cardHTML).join('') : '<div class="msg">沒有符合的項目</div>';
  renderStats(list.length);
}
function renderStats(shown){
  const list = data[tab], mx = maxVal();
  const own = list.filter(x => owned[tab][x.id]);
  const byR = {};
  list.forEach(x => { byR[x.r] = byR[x.r] || [0,0]; byR[x.r][1]++; if (owned[tab][x.id]) byR[x.r][0]++; });
  let h = `<span>持有 <b>${own.length}</b> / ${list.length}（${list.length ? (own.length / list.length * 100).toFixed(1) : 0}%）</span>`;
  h += `<span>${tab === 'chr' ? 'E6' : 'S5'} <b>${own.filter(x => owned[tab][x.id] === mx).length}</b></span>`;
  h += Object.keys(byR).sort((a, b) => b - a).map(r => `<span>★${r} <b>${byR[r][0]}</b>/${byR[r][1]}</span>`).join('');
  h += `<span>顯示中 ${shown}</span>`;
  if (data.time) h += `<span>資料：${new Date(data.time).toLocaleString()}</span>`;
  document.getElementById('stats').innerHTML = h;
}
function setOwn(t, id, v){
  if (v) owned[t][id] = v; else delete owned[t][id];
  saveOwned();
  if (t === tab){
    const el = document.querySelector(`#grid .item[data-id="${id}"]`);
    if (el){ const tmp = document.createElement('div'); tmp.innerHTML = cardHTML(data[t].find(x => x.id === id)); el.replaceWith(tmp.firstElementChild); }
    renderStats(document.querySelectorAll('#grid .item').length);
  }
}
document.getElementById('grid').addEventListener('click', ev => {
  const el = ev.target.closest('.item'); if (!el) return;
  const id = +el.dataset.id, npEl = ev.target.closest('[data-np]');
  if (npEl) setOwn(tab, id, +npEl.dataset.np);
  else if (ev.target.closest('.chk')) setOwn(tab, id, owned[tab][id] ? 0 : 1);
  else { pushedHash = true; location.hash = tab + '-' + id; }
});

/* ===== 敘述文字（#1[i]% 等參數代入） ===== */
function fmtDesc(text, params, idx){
  let s = String(text || '').replace(/\\n/g, '\n').replace(/\{NICKNAME\}/g, '開拓者').replace(/\{RUBY_B#([^}]*)\}|\{RUBY_E#\}/g, '');
  s = s.replace(/#(\d+)\[(i|f\d)\](%?)/g, (m, n, f, pct) => {
    let arr = params ? (Array.isArray(params) ? [params[n - 1]] : params[n]) : null;
    let v = Array.isArray(arr) ? arr[Math.min(idx, arr.length - 1)] : arr;
    if (v == null) return m;
    if (pct) v *= 100;
    const out = f === 'i' ? String(Math.round(v)) : v.toFixed(+f.slice(1));
    return out + pct;
  });
  return esc(s).replace(/&lt;color=#[0-9a-fA-F]+&gt;/g, '<span class="hl">').replace(/&lt;\/color&gt;/g, '</span>')
    .replace(/&lt;\/?unbreak&gt;/g, '').replace(/&lt;(\/?)(u|i|b)&gt;/g, '<$1$2>').replace(/&lt;[^&]*&gt;/g, '');
}

/* ===== 詳細資料 ===== */
const detailCache = {};
let curDetail = null, pushedHash = false;

function roleOf(c){ return roleOv[c.id] || TEAM.defaultRole(c); }
function ownBarHTML(t, id){
  const v = owned[t][id] || 0;
  let h = `<label style="display:flex;align-items:center;gap:6px;cursor:pointer;font-weight:600"><input type="checkbox" id="downChk" ${v ? 'checked' : ''}> 持有</label>`;
  if (v) h += `<div class="np">${lvBtns(t, v, true).replace(/data-np/g, 'data-dnp')}</div>`;
  if (t === 'chr'){
    const c = data.chr.find(x => x.id === id);
    h += `<span style="flex:1"></span><label style="font-size:13px;color:var(--sub)">組隊定位 <select class="roleSel" id="roleSel">${Object.entries(ROLE).map(([k, l]) =>
      `<option value="${k}" ${roleOf(c) === k ? 'selected' : ''}>${l}${TEAM.defaultRole(c) === k ? '（預設）' : ''}</option>`).join('')}</select></label>`;
  }
  return h;
}
function headHTML(t, b, d){
  let meta = [PATH[b.p], t === 'chr' ? ELEM[b.e] : '', '★' + b.r].filter(Boolean).join('｜');
  if (d && t === 'chr' && d.fetter){
    if (d.fetter.faction) meta += '｜' + esc(stripTags(d.fetter.faction));
    const cv = d.fetter.cv || {};
    if (cv.CV_JP || cv.CV_CN) meta += `<br>CV：日 ${esc(cv.CV_JP || '-')}／中 ${esc(cv.CV_CN || '-')}`;
  }
  return `<div class="dhead"><img src="${faceOf(t, b)}" alt=""><div><h2>${esc(b.name)}</h2><div class="meta">${meta}</div></div></div>
    <div class="down" id="down">${ownBarHTML(t, b.id)}</div>`;
}
function statsAt80(up, keys){
  const last = up && up[up.length - 1]; if (!last) return null;
  const lv = last.maxLevel, o = {};
  keys.forEach(([k, b, a]) => o[k] = (last.skillBase[b] || 0) + (last.skillAdd[a] || 0) * (lv - 1));
  o.lv = lv; o.spd = last.skillBase.speedBase; o.cr = last.skillBase.criticalChance; o.cd = last.skillBase.criticalDamage; o.aggro = last.skillBase.baseAggro;
  return o;
}
function skillBlock(sk, lvIdx, lvLabel){
  return `<div class="sk"><img src="${ASSET}skill/${sk.icon}.png" alt="" onerror="this.style.visibility='hidden'"><div style="flex:1;min-width:0">
    <div class="t">${esc(stripTags(sk.name))}<span class="tag">${esc(sk.type || '')}</span>${sk.tag ? `<small>${esc(sk.tag)}</small>` : ''}${lvLabel ? `<small>${lvLabel}</small>` : ''}</div>
    <div class="d">${fmtDesc(sk.description, sk.params, lvIdx)}</div></div></div>`;
}
function chrHTML(d){
  const st = statsAt80(d.upgrade, [['hp','hPBase','hPAdd'],['atk','attackBase','attackAdd'],['def','defenceBase','defenceAdd']]);
  let h = `<div class="dcols"><div class="dart"><img src="${ASSET}avatar/large/${d.icon}.png" alt=""></div><div>`;
  if (st) h += `<h3>能力值（Lv.${st.lv}）</h3><table class="kv">
      <tr><th>生命</th><td>${Math.round(st.hp)}</td><th>攻擊</th><td>${Math.round(st.atk)}</td></tr>
      <tr><th>防禦</th><td>${Math.round(st.def)}</td><th>速度</th><td>${st.spd}</td></tr>
      <tr><th>暴擊率</th><td>${(st.cr * 100).toFixed(0)}%</td><th>暴擊傷害</th><td>${(st.cd * 100).toFixed(0)}%</td></tr>
      <tr><th>嘲諷</th><td colspan="3">${st.aggro}</td></tr></table>`;
  // 行跡數值加成
  const add = {};
  Object.values(d.traces.subSkills || {}).filter(s => s.pointType === 'Attribute').forEach(s => (s.statusList || []).forEach(x => {
    add[x.name] = (add[x.name] || 0) + x.value;
  }));
  if (Object.keys(add).length) h += '<h3>行跡加成（全點滿）</h3><div class="stat-tags">' + Object.entries(add).map(([n, v]) => `<span>${fmtDesc(n, [v], 0)}</span>`).join('') + '</div>';
  h += '</div></div>';

  h += '<h3>技能</h3>';
  Object.values(d.traces.mainSkills || {}).sort((a, b) => a.pointPosition.localeCompare(b.pointPosition)).forEach(pt => {
    const lv = pt.maxLevel || 1;
    Object.values(pt.skillList || {}).forEach(sk => h += skillBlock(sk, lv - 1, lv > 1 ? 'Lv.' + lv : ''));
  });
  const sv = d.traces.servantSkills;
  if (sv && sv.skills && Object.keys(sv.skills).length){
    h += '<h3>憶靈技能</h3>';
    Object.values(sv.skills).forEach(pt => { const lv = pt.maxLevel || 1; Object.values(pt.skillList || {}).forEach(sk => h += skillBlock(sk, lv - 1, lv > 1 ? 'Lv.' + lv : '')); });
  }
  const sp = Object.values(d.traces.subSkills || {}).filter(s => s.pointType === 'Special');
  if (sp.length) h += '<h3>額外能力</h3>' + sp.map(s => `<div class="sk"><img src="${ASSET}skill/${s.icon}.png" alt="" onerror="this.style.visibility='hidden'"><div style="flex:1;min-width:0">
      <div class="t">${esc(stripTags(s.name))}</div><div class="d">${fmtDesc(s.description, s.params, 0)}</div></div></div>`).join('');
  if (d.eidolons) h += '<h3>星魂</h3>' + Object.values(d.eidolons).sort((a, b) => a.rank - b.rank).map(e => `<div class="sk"><img src="${ASSET}skill/${e.icon}.png" alt="" onerror="this.style.visibility='hidden'"><div style="flex:1;min-width:0">
      <div class="t">E${e.rank} ${esc(stripTags(e.name))}</div><div class="d">${fmtDesc(e.description, e.params, 0)}</div></div></div>`).join('');
  const story = d.script && d.script.story;
  if (story && story.length) h += '<h3>角色故事</h3>' + story.map(s => `<div class="prof"><span class="cond">【${esc(s.title || '')}】</span>${fmtDesc(s.text, null, 0)}</div>`).join('');
  h += `<div class="dfoot">更多資料：<a href="https://sr.yatta.moe/cht/archive/avatar/${d.id}" target="_blank" rel="noopener">Project Yatta</a></div>`;
  return h;
}
function lcHTML(d, sIdx){
  const st = statsAt80(d.upgrade, [['hp','hPBase','hPAdd'],['atk','attackBase','attackAdd'],['def','defenceBase','defenceAdd']]);
  let h = `<div class="dcols"><div class="dart"><img src="${ASSET}equipment/large/${d.icon}.png" alt=""></div><div>`;
  if (st) h += `<h3>能力值（Lv.${st.lv}）</h3><table class="kv"><tr><th>生命</th><td>${Math.round(st.hp)}</td></tr><tr><th>攻擊</th><td>${Math.round(st.atk)}</td></tr><tr><th>防禦</th><td>${Math.round(st.def)}</td></tr></table>`;
  if (d.skill){
    h += `<h3>${esc(stripTags(d.skill.name))}</h3><div class="sl" id="lcS">${[0,1,2,3,4].map(i => `<span data-s="${i}" class="${i === sIdx ? 'on' : ''}">疊影 ${i + 1}</span>`).join('')}</div>
      <div class="d" style="font-size:13px;white-space:pre-wrap" id="lcDesc">${fmtDesc(d.skill.description, d.skill.params, sIdx)}</div>`;
  }
  h += '</div></div>';
  if (d.description) h += `<h3>故事</h3><div class="prof">${fmtDesc(d.description, null, 0)}</div>`;
  h += `<div class="dfoot">更多資料：<a href="https://sr.yatta.moe/cht/archive/weapon/${d.id}" target="_blank" rel="noopener">Project Yatta</a></div>`;
  return h;
}

async function openDetail(t, id){
  const base = data && data[t].find(x => x.id === id);
  if (!base){ closeDetail(); return; }
  curDetail = {t, id};
  document.getElementById('dlg').classList.add('on');
  document.body.classList.add('lock');
  const body = document.getElementById('dbody');
  body.innerHTML = headHTML(t, base, null) + '<p style="color:var(--sub)">讀取詳細資料中…</p>';
  const key = t + id;
  try{
    if (!detailCache[key]){
      const r = await fetch(API + (t === 'chr' ? 'avatar/' : 'equipment/') + id);
      if (!r.ok) throw new Error('HTTP ' + r.status);
      detailCache[key] = (await r.json()).data;
    }
  }catch(err){
    if (curDetail && curDetail.id === id) body.innerHTML = headHTML(t, base, null) + `<p>詳細資料讀取失敗：${esc(err.message)}</p>`;
    return;
  }
  if (!curDetail || curDetail.id !== id || curDetail.t !== t) return;
  const d = detailCache[key];
  body.innerHTML = headHTML(t, base, d) + (t === 'chr' ? chrHTML(d) : lcHTML(d, Math.max(0, (owned.lc[id] || 1) - 1)));
  document.getElementById('dlg').scrollTop = 0;
}
function closeDetail(){
  curDetail = null;
  document.getElementById('dlg').classList.remove('on');
  document.body.classList.remove('lock');
}
function hideDetail(){
  if (pushedHash){ pushedHash = false; history.back(); }
  else { history.replaceState(null, '', location.pathname + location.search); closeDetail(); }
}
function routeHash(){
  const m = location.hash.match(/^#(chr|lc)-(\d+)$/);
  if (m && data) openDetail(m[1], +m[2]); else closeDetail();
}
window.addEventListener('hashchange', routeHash);
document.querySelector('.dclose').addEventListener('click', hideDetail);
document.addEventListener('keydown', ev => { if (ev.key === 'Escape' && curDetail) hideDetail(); });
document.getElementById('dlg').addEventListener('click', ev => {
  if (ev.target.id === 'dlg'){ hideDetail(); return; }
  const s = ev.target.closest('#lcS span');
  if (s && curDetail){
    const d = detailCache['lc' + curDetail.id];
    document.getElementById('lcDesc').innerHTML = fmtDesc(d.skill.description, d.skill.params, +s.dataset.s);
    s.parentNode.querySelectorAll('span').forEach(x => x.classList.toggle('on', x === s));
    return;
  }
  const np = ev.target.closest('[data-dnp]');
  if (np && curDetail){
    setOwn(curDetail.t, curDetail.id, +np.dataset.dnp);
    document.getElementById('down').innerHTML = ownBarHTML(curDetail.t, curDetail.id);
  }
});
document.getElementById('dlg').addEventListener('change', ev => {
  if (!curDetail) return;
  if (ev.target.id === 'downChk'){
    setOwn(curDetail.t, curDetail.id, ev.target.checked ? 1 : 0);
    document.getElementById('down').innerHTML = ownBarHTML(curDetail.t, curDetail.id);
  } else if (ev.target.id === 'roleSel'){
    const c = data.chr.find(x => x.id === curDetail.id);
    if (ev.target.value === TEAM.defaultRole(c)) delete roleOv[c.id]; else roleOv[c.id] = ev.target.value;
    try{ localStorage.setItem(ROLE_KEY, JSON.stringify(roleOv)); }catch(e){}
  }
});

/* ===== 分頁、篩選、匯出入 ===== */
document.querySelectorAll('.tab').forEach(t => t.addEventListener('click', () => {
  document.querySelectorAll('.tab').forEach(x => x.classList.toggle('on', x === t));
  const isTeam = t.dataset.tab === 'team';
  document.getElementById('listCtl').hidden = isTeam;
  document.getElementById('grid').hidden = isTeam;
  document.getElementById('teamCtl').hidden = !isTeam;
  document.getElementById('teamOut').hidden = !isTeam;
  window.scrollTo(0, 0);
  if (isTeam){ if (data) TEAM.render(); return; }
  tab = t.dataset.tab;
  document.querySelector('#fOwn option[value=max]').textContent = tab === 'chr' ? '滿星魂（E6）' : '疊影 5';
  if (data){ buildChips(); render(); }
}));
function chipToggle(ev, getSet, attr, conv){
  const c = ev.target.closest('.chip'); if (!c) return;
  const v = conv(c.dataset[attr]), s = getSet();
  s.has(v) ? s.delete(v) : s.add(v);
  c.classList.toggle('on'); render();
}
document.getElementById('chipRar').addEventListener('click', ev => chipToggle(ev, () => fRar[tab], 'r', Number));
document.getElementById('chipPath').addEventListener('click', ev => chipToggle(ev, () => fPath[tab], 'p', String));
document.getElementById('chipElem').addEventListener('click', ev => chipToggle(ev, () => fElem, 'e', String));
let qTimer;
document.getElementById('q').addEventListener('input', () => { clearTimeout(qTimer); qTimer = setTimeout(render, 150); });
document.getElementById('fOwn').addEventListener('change', render);
document.getElementById('fSort').addEventListener('change', render);
document.getElementById('btnRefresh').addEventListener('click', async () => {
  const b = document.getElementById('btnRefresh');
  b.disabled = true; b.textContent = '更新中…';
  try{ data = await fetchData(); buildChips(); render(); b.textContent = '已更新'; }
  catch(err){ alert('更新失敗：' + err.message); }
  setTimeout(() => { b.disabled = false; b.textContent = '更新資料'; }, 1500);
});
document.getElementById('btnExport').addEventListener('click', () => {
  const blob = new Blob([JSON.stringify({game:'hsr', version:1, exported:new Date().toISOString(), chr:owned.chr, lc:owned.lc, role:roleOv}, null, 1)], {type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'hsr_owned_' + new Date().toISOString().slice(0, 10) + '.json';
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
});
document.getElementById('btnImport').addEventListener('click', () => document.getElementById('fileImport').click());
document.getElementById('fileImport').addEventListener('change', async ev => {
  const f = ev.target.files[0]; if (!f) return;
  try{
    const o = JSON.parse(await f.text());
    if (!o.chr || !o.lc) throw new Error('格式不符');
    if (!confirm(`匯入 ${Object.keys(o.chr).length} 位角色、${Object.keys(o.lc).length} 張光錐，會覆蓋目前紀錄，確定？`)) return;
    owned = {chr:o.chr, lc:o.lc}; saveOwned();
    if (o.role){ roleOv = o.role; try{ localStorage.setItem(ROLE_KEY, JSON.stringify(roleOv)); }catch(e){} }
    render();
  }catch(err){ alert('匯入失敗：' + err.message); }
  ev.target.value = '';
});
</script>
